<!doctype html>
<html lang="en"><head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manager · This Time Next Year</title>
<meta name="description" content="Take charge of a Premier League club for a season: squad, tactics, and every match live in words.">
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Manager: a season in charge of a club. The squad with PES-style attributes, a formation and instructions, the league
   and a cup, and every one of your matches told minute by minute; the other matches are played by the same engine. */
:root{
  --night:#0B1626; --panel:#13233A; --panel-2:#1A2E4A; --line:#294060; --grass:#103828; --grass-2:#13422F;
  --gold:#4FD18B; --gold-ink:#06210F; --text:#F3EFE6; --muted:#A3B1C4;
  --win:#5CC08A; --loss:#E57A62; --draw:#C9B458; --hot:#FFB547;
  --display:'Oswald','Arial Narrow',Arial,sans-serif; --body:'Rubik','Segoe UI',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--night);color:var(--text)}
body{font:15px/1.45 var(--body);margin:0;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px 90px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.1;text-transform:uppercase;letter-spacing:.01em}
h1{font-size:30px}h2{font-size:20px}h3{font-size:15px}
.eyebrow{font:500 12px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)}.num{font-variant-numeric:tabular-nums}.small{font-size:13px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.mark{display:flex;align-items:center;gap:8px;font:700 16px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.mark a{display:flex;align-items:center;gap:8px;color:var(--text);text-decoration:none}.mark img{height:40px}.mark .mtxt span{color:var(--gold)}
.games{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.games a{padding:5px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font:600 13px/1 var(--body);white-space:nowrap}
.games a.on{background:var(--gold);color:var(--gold-ink)}.games a:not(.on):hover{color:var(--text)}
@media(max-width:520px){.mark .mtxt{display:none}.mark img{height:32px}.games a{padding:5px 9px;font-size:12px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px 16px;font-weight:500}
.btn:hover{border-color:var(--muted)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700}
.btn.small{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],select{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:9px 12px;font:inherit}
/* the club strip under the top bar */
.clubbar{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:linear-gradient(90deg,var(--k1),color-mix(in srgb,var(--k1) 55%,var(--night)));color:var(--k2);margin-bottom:12px;position:sticky;top:0;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.clubbar .crest{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.clubbar .cn{font:600 18px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.clubbar .cd{font-size:12px;opacity:.85}
.clubbar .go{margin-left:auto}
.clubbar .go .btn{background:var(--night);color:var(--text);border-color:transparent}
.clubbar .go .btn.primary{background:var(--gold);color:var(--gold-ink)}
/* navigation: tabs on top on a wide screen, a bar at the bottom on a phone */
.tabs{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;color:var(--muted);white-space:nowrap;font-weight:500}
.tabs button.on{background:var(--text);color:var(--night);border-color:var(--text)}
.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--hot);color:#2A1700;font-size:11px;line-height:18px}
@media(max-width:700px){
  .tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;margin:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:rgba(11,22,38,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px);justify-content:space-between}
  .tabs button{border:0;background:none;padding:6px 6px;font-size:12px;flex:1}
  .tabs button.on{background:var(--panel-2);color:var(--text)}
}
/* tables */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:6px 6px;text-align:left;border-bottom:1px solid rgba(41,64,96,.7);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;position:sticky;top:0;background:var(--panel)}
td.r,th.r{text-align:right}td.c,th.c{text-align:center}
tr.me td{background:rgba(79,209,139,.10)}
tr.click{cursor:pointer}tr.click:hover td{background:rgba(255,255,255,.04)}
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
.pos{display:inline-block;min-width:34px;padding:1px 5px;border-radius:5px;font:600 11px/16px var(--body);text-align:center;color:#06121F}
.pos.GK{background:#F2C14E}.pos.DEF{background:#5DA9E9}.pos.MID{background:#6DD39B}.pos.FWD{background:#F2766B}
.att{display:inline-block;min-width:26px;text-align:center;border-radius:5px;font-weight:600;font-size:13px;padding:1px 3px}
.a9{background:#1E7A4C;color:#fff}.a8{background:#2E9B5F;color:#fff}.a7{background:#8DBA3E;color:#0B1A06}.a6{background:#D9B84A;color:#241A00}.a5{background:#D98A4A;color:#2A1200}.a4{background:#B9584A;color:#fff}
.cond{display:inline-block;width:42px;height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden;vertical-align:middle}.cond i{display:block;height:100%}
.form span{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:4px;font-size:11px;font-weight:700;margin-right:2px;color:#0B1626}
.form .W{background:var(--win)}.form .D{background:var(--draw)}.form .L{background:var(--loss)}
.flag{font-size:12px;color:var(--muted)}
.inj{color:var(--loss);font-weight:700}.sus{color:var(--hot);font-weight:700}
/* the pitch */
.pitch{position:relative;background:repeating-linear-gradient(180deg,var(--grass) 0 10%,var(--grass-2) 10% 20%);border:2px solid rgba(255,255,255,.25);border-radius:12px;aspect-ratio:68/90;max-width:420px;width:100%;margin:0 auto;overflow:hidden}
.pitch::before{content:'';position:absolute;left:22%;right:22%;bottom:0;height:15%;border:2px solid rgba(255,255,255,.22);border-bottom:0}
.pitch::after{content:'';position:absolute;left:0;right:0;top:0;height:0;border-top:2px solid rgba(255,255,255,.22)}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:84px;cursor:pointer;background:none;border:0;padding:0}
.slot .dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--body);background:var(--k1,#ddd);color:var(--k2,#111);border:2px solid rgba(255,255,255,.7);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.slot .nm{font-size:11px;line-height:1.15;text-align:center;text-shadow:0 1px 2px #000;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .sp{font-size:10px;color:#cfe;opacity:.85}
.slot.bad .dot{border-color:var(--loss)}.slot.ok .dot{border-color:var(--hot)}.slot.sel .dot{outline:3px solid var(--gold)}
.slot.empty .dot{background:rgba(0,0,0,.35);color:#fff;border-style:dashed}
.tac{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:16px;align-items:start}
@media(max-width:800px){.tac{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--panel-2);padding:6px 10px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--gold);color:var(--gold-ink);font-weight:600}
.instr{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
/* the player card */
.ov{position:fixed;inset:0;background:rgba(3,8,16,.72);z-index:60;display:grid;place-items:center;padding:16px;overflow-y:auto}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:760px;width:100%;padding:18px;position:relative}
.sheet .x{position:absolute;right:10px;top:10px;border:0;background:var(--panel-2);border-radius:50%;width:32px;height:32px}
.pcard-head{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.pcard-head .big{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;font:700 26px/1 var(--display);background:var(--k1);color:var(--k2)}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:640px){.agrid{grid-template-columns:1fr 1fr}}
.agroup h4{margin:0 0 6px;font:500 11px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.arow{display:flex;justify-content:space-between;gap:8px;padding:2px 0;font-size:13px}
.posgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:300px}
.posgrid div{padding:4px 0;text-align:center;border-radius:6px;background:var(--panel-2);font-size:11px}
.posgrid div b{display:block;font-size:14px}
/* the match */
.mhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.mhead .tm{font:600 18px/1.1 var(--display);text-transform:uppercase}
.mhead .sc{font:700 44px/1 var(--display);font-variant-numeric:tabular-nums;padding:0 6px}
.mhead .clock{font:600 14px/1 var(--body);color:var(--gold);margin-top:4px}
.kit{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-right:6px;border:1px solid rgba(255,255,255,.4)}
.feed{height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-right:4px;scroll-behavior:smooth}
.feed p{margin:0;padding:5px 8px;border-radius:8px;font-size:14px}
.feed p .m{display:inline-block;width:34px;color:var(--muted);font-variant-numeric:tabular-nums}
.feed p.goal{background:rgba(79,209,139,.16);font-weight:600}.feed p.goal.them{background:rgba(229,122,98,.16)}
.feed p.big{color:var(--text)}.feed p.minor{color:var(--muted)}.feed p.yel{color:var(--hot)}.feed p.red{color:var(--loss);font-weight:600}
.mgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
@media(max-width:800px){.mgrid{grid-template-columns:1fr}.feed{height:260px}}
.sbar{display:grid;grid-template-columns:40px 1fr 40px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.sbar .b{height:7px;border-radius:4px;background:var(--panel-2);display:flex;overflow:hidden}.sbar .b i:first-child{background:var(--k1h,#7ab)}.sbar .b i:last-child{background:var(--k1a,#e88)}
.sbar .l{text-align:center;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;grid-column:1/-1;margin-bottom:-4px}
.subs{display:flex;flex-direction:column;gap:4px}
.subs button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px 8px;font-size:13px}
.subs button.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.speed{display:inline-flex;gap:4px}
.mom{color:var(--gold)}
.news{display:flex;flex-direction:column;gap:8px}
.news .it{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel-2)}
.news .it.new{border-color:var(--gold)}
.news .it h3{font-size:15px;margin-bottom:4px}
.news .it .d{font-size:12px;color:var(--muted)}
.clubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.clubs button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:10px;text-align:left}
.clubs button:hover{border-color:var(--gold)}
.clubs .sw{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--k1);color:var(--k2);font:700 12px/1 var(--display)}
.clubs .sw img{width:28px;height:28px;object-fit:contain}
.clubs b{display:block;font-size:15px}.clubs small{color:var(--muted);font-size:12px}
.stars{color:var(--hot);letter-spacing:1px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#08111E;border:1px solid var(--line);border-radius:10px;padding:10px 14px;z-index:80;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.empty{padding:20px;text-align:center;color:var(--muted)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:800px){.split{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0}
</style>

<div class="wrap" id="app"><p class="muted">Loading…</p></div>
<script>
'use strict';
/* =====================================================================================================================
   data: cm.json from the pipeline (pipeline/cm_model.py): clubs, players with 25 attributes, the fixture list
   ===================================================================================================================== */
let D = null, P = new Map(), C = new Map();
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const STORE = 'ttny.manager.v1';
const ATTR_NAME = {};
const GROUP = { GK: 'GK', CB: 'DEF', LB: 'DEF', RB: 'DEF', DMF: 'MID', CMF: 'MID', LMF: 'MID', RMF: 'MID', AMF: 'MID', LWF: 'FWD', RWF: 'FWD', SS: 'FWD', CF: 'FWD' };
const ROLE = { GK: 'GK', CB: 'CB', LB: 'FB', RB: 'FB', DMF: 'DM', CMF: 'CM', LMF: 'WM', RMF: 'WM', AMF: 'AM', LWF: 'W', RWF: 'W', SS: 'ST', CF: 'ST' };
const crestURL = id => `https://media.api-sports.io/football/teams/${id}.png`;
const short = n => { const p = String(n || '').split(' '); return p.length > 1 && p[p.length - 1].length > 2 ? p.slice(-1)[0] : n; };
const surname = n => { const p = String(n || '').trim().split(/\s+/); if (p.length < 2) return n; const parts = ['van', 'de', 'der', 'da', 'dos', 'di', 'el', 'ben', 'mac', 'le']; let i = p.length - 1; while (i > 1 && parts.includes(p[i - 1].toLowerCase())) i--; return p.slice(i).join(' '); };
const attrClass = v => 'a' + Math.max(4, Math.min(9, Math.floor(v / 10)));
const pick = (L, rnd = Math.random) => L[Math.floor(rnd() * L.length)];
function toast(t, ms = 2600){ const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), ms); }
// a seeded random source, so a saved season replays the same draws where it must (fixtures, the cup draw)
function rng(seed){ let s = 0; for (const ch of String(seed)) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* =====================================================================================================================
   formations: slot positions on a pitch 100 wide and 100 deep (0 = their goal line), and the position each slot asks for
   ===================================================================================================================== */
const FORMS = {
  '4-4-2':   [['GK', 50, 93], ['LB', 14, 74], ['CB', 38, 78], ['CB', 62, 78], ['RB', 86, 74], ['LMF', 14, 50], ['CMF', 38, 54], ['CMF', 62, 54], ['RMF', 86, 50], ['CF', 38, 24], ['CF', 62, 24]],
  '4-3-3':   [['GK', 50, 93], ['LB', 14, 74], ['CB', 38, 78], ['CB', 62, 78], ['RB', 86, 74], ['CMF', 28, 54], ['DMF', 50, 60], ['CMF', 72, 54], ['LWF', 16, 26], ['CF', 50, 20], ['RWF', 84, 26]],
  '4-2-3-1': [['GK', 50, 93], ['LB', 14, 74], ['CB', 38, 78], ['CB', 62, 78], ['RB', 86, 74], ['DMF', 38, 60], ['DMF', 62, 60], ['LMF', 16, 40], ['AMF', 50, 40], ['RMF', 84, 40], ['CF', 50, 18]],
  '4-1-4-1': [['GK', 50, 93], ['LB', 14, 74], ['CB', 38, 78], ['CB', 62, 78], ['RB', 86, 74], ['DMF', 50, 62], ['LMF', 14, 44], ['CMF', 38, 46], ['CMF', 62, 46], ['RMF', 86, 44], ['CF', 50, 20]],
  '4-4-1-1': [['GK', 50, 93], ['LB', 14, 74], ['CB', 38, 78], ['CB', 62, 78], ['RB', 86, 74], ['LMF', 14, 52], ['CMF', 38, 56], ['CMF', 62, 56], ['RMF', 86, 52], ['SS', 50, 34], ['CF', 50, 18]],
  '3-5-2':   [['GK', 50, 93], ['CB', 26, 78], ['CB', 50, 80], ['CB', 74, 78], ['LMF', 10, 50], ['CMF', 32, 54], ['DMF', 50, 62], ['CMF', 68, 54], ['RMF', 90, 50], ['CF', 38, 22], ['CF', 62, 22]],
  '3-4-3':   [['GK', 50, 93], ['CB', 26, 78], ['CB', 50, 80], ['CB', 74, 78], ['LMF', 12, 52], ['CMF', 38, 56], ['CMF', 62, 56], ['RMF', 88, 52], ['LWF', 18, 26], ['CF', 50, 20], ['RWF', 82, 26]],
  '5-3-2':   [['GK', 50, 93], ['LB', 10, 68], ['CB', 30, 78], ['CB', 50, 80], ['CB', 70, 78], ['RB', 90, 68], ['CMF', 30, 52], ['DMF', 50, 58], ['CMF', 70, 52], ['CF', 38, 24], ['CF', 62, 24]],
};
// how well a player suits a slot: his rating there (cm.json has every position's rating, the out-of-position cost in it)
const fitIn = (p, pos) => (p.r && p.r[pos]) || p.ovr - 15;

/* =====================================================================================================================
   the state of a season, saved on the device
   ===================================================================================================================== */
let S = null;
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) { toast('This device could not save the game.'); } };
const load = () => { try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { return null; } };
const club = id => C.get(id) || { id, name: '?', kit: ['#888', '#fff'] };
const kitOf = id => (club(id).kit || ['#8899AA', '#FFFFFF']);
const me = () => S && S.club;
const ps = id => S.pl[id] || (S.pl[id] = { cond: 100, mor: 70, inj: 0, sus: 0, yc: 0, apps: 0, g: 0, a: 0, rt: [], mom: 0 });
const avail = id => { const x = ps(id); return !x.inj && !x.sus; };
const squadOf = cid => (S && S.squads && S.squads[cid] ? S.squads[cid] : D.players.filter(p => p.club === cid).map(p => p.id)).map(id => P.get(id)).filter(Boolean);

/* =====================================================================================================================
   the season: the league's fixture list (the real one from the API when the pipeline has it, otherwise a round robin)
   and a cup, single matches, drawn as it goes
   ===================================================================================================================== */
function buildSchedule(ids, seed){
  const real = (D.fixtures || []).filter(f => ids.includes(f[2]) && ids.includes(f[3]));
  const rounds = [];
  if (real.length >= ids.length * (ids.length - 1) * .95){
    const byRound = new Map();
    for (const [date, round, h, a] of real){ const n = parseInt(String(round).replace(/\D+/g, ''), 10) || 0; if (!byRound.has(n)) byRound.set(n, { date, m: [] }); const r = byRound.get(n); r.m.push({ h, a }); if (date < r.date) r.date = date; }
    [...byRound.keys()].sort((a, b) => a - b).forEach(k => rounds.push(byRound.get(k)));
  } else {
    // the circle method, then the same again with home and away swapped
    const L = ids.slice(); const r0 = rng(seed); for (let i = L.length - 1; i > 0; i--){ const j = Math.floor(r0() * (i + 1)); [L[i], L[j]] = [L[j], L[i]]; }
    if (L.length % 2) L.push(null);
    const n = L.length, half = [];
    for (let r = 0; r < n - 1; r++){
      const m = [];
      for (let i = 0; i < n / 2; i++){ const a = L[i], b = L[n - 1 - i]; if (a && b) m.push(r % 2 ? { h: a, a: b } : { h: b, a: a }); }
      half.push(m); L.splice(1, 0, L.pop());
    }
    const start = new Date(Date.UTC(D.season || 2026, 7, 15));

function bestXI(cid, form, keepFit){

  if (M.half === 1 && M.min === 45 && M.add1) say(M, null, 'minor', `${M.add1} minute${M.add1 > 1 ? 's' : ''} added on.`);

    // the cup: penalties straight away
    let h = 0, a = 0; const takers = s => s.on.filter(x => x.pos !== 'GK').sort((x, y) => A(y.p, 'pk') - A(x.p, 'pk'));
    const th = takers(M.H), ta = takers(M.A), kh = M.A.on.find(x => x.pos === 'GK'), ka = M.H.on.find(x => x.pos === 'GK');
    const kick = (x, k) => Math.random() < .76 * (0.85 + 0.15 * A(x.p, 'pk') / 75) * (1.05 - 0.05 * (k ? A(k.p, 'gr') : 50) / 75);
    for (let i = 0; i < 5 || h === a; i++){ if (kick(th[i % th.length], kh)) h++; if (kick(ta[i % ta.length], ka)) a++; if (i >= 4 && h !== a) break; if (i > 20) break; }
    M.pens = [h, a];
    say(M, null, 'big', `Penalties: ${esc(club(M.h).name)} ${h}-${a} ${esc(club(M.a).name)}.`);
  }
  // match ratings: 6.0 to 6.8 by the result and how his side played, then what he did

    const o = s === M.H ? M.A : M.H, res = s.goals > o.goals ? .45 : s.goals === o.goals ? .1 : -.25;

    for (const x of all){ if (!x.p) continue;
      let v = 6.3 + res + (s.rate[x.id] || 0) + (Math.random() - .5) * .5;
      if (o.goals === 0 && ['GK', 'CB', 'FB'].includes(ROLE[x.pos] || '')) v += .4;
      s.rate[x.id] = Math.max(4, Math.min(10, Math.round(v * 10) / 10)); }
  }

  M.mom = best ? +best[0] : null;

// after a match: the table, the players' condition, goals, cards, injuries, suspensions

  if (kind === 'league'){
    for (const [s, gf, ga] of [[H, hg, ag], [Aw, ag, hg]]){ const t = S.table[s.cid]; t.p++; t.gf += gf; t.ga += ga; const r = gf > ga ? 'W' : gf === ga ? 'D' : 'L'; t[r.toLowerCase() === 'w' ? 'w' : r === 'D' ? 'd' : 'l']++; t.form = [...t.form, r].slice(-5); }
  }
  for (const s of [H, Aw]){
    const played = new Set([...s.on.map(x => x.id), ...(s.subbed || []).flatMap(x => [x[0], x[1]])]);
    for (const x of [...s.on, ...(s.subbed || []).map(([o]) => ({ id: o, e: 40 }))]){ const q = ps(x.id); q.cond = Math.max(30, Math.min(100, q.cond - (100 - (x.e || 60)) * .55)); }
    for (const id of played){ const q = ps(id); q.apps++; const ev = s.ev[id] || {}; q.g += ev.g || 0; q.a += ev.a || 0; if (s.rate[id]) q.rt.push(s.rate[id]); if (M.mom === id) q.mom++;
      if (ev.rc){ q.sus = Math.max(q.sus, ev.yc >= 2 && !ev.rcStraight ? 1 : 3); }
      else if (ev.yc){ q.yc += ev.yc; if (q.yc === 5 || q.yc === 10){ q.sus = Math.max(q.sus, q.yc === 5 ? 1 : 2); } }
    }

    const won = (s === H ? hg - ag : ag - hg);

}
function between(){
  // a week passes: condition comes back, injuries heal, suspensions are served (counted when a match is missed)
  for (const id in S.pl){ const q = S.pl[id]; q.cond = Math.min(100, q.cond + 22 + Math.random() * 6); if (q.inj) q.inj = Math.max(0, q.inj - 1); }
}

/* =====================================================================================================================
   moving the season on: one round of the league (and the cup when it falls), your match live, the rest played out
   ===================================================================================================================== */
let LIVE = null;
function nextEvent(){
  if (S.done) return null;
  const cupDue = S.cup.stage < 5 && S.cupAt[S.cup.stage] === S.round && !S.cup.playedAt?.includes(S.round);
  if (cupDue) return { kind: 'cup' };
  if (S.round >= S.rounds.length) return null;
  return { kind: 'league', r: S.rounds[S.round] };
}
function cupDraw(){
  const alive = S.cup.alive.slice(), rnd = rng(`${S.seed}-cup-${S.cup.stage}`);
  for (let i = alive.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [alive[i], alive[j]] = [alive[j], alive[i]]; }

  let ties = [], bye = [];
  if (S.cup.stage === 0 && alive.length > 16){ const byQ = alive.slice().sort((a, b) => club(a).q - club(b).q); const play = byQ.slice(0, (alive.length - 16) * 2); bye = alive.filter(x => !play.includes(x)); for (let i = 0; i < play.length; i += 2) ties.push({ h: play[i], a: play[i + 1] }); }

function advance(){
  const ev = nextEvent(); if (!ev){ endSeason(); return; }

    const { ties, bye } = cupDraw(), mine = ties.find(t => t.h === me() || t.a === me());
    S.cup.cur = { ties, bye, stage: S.cup.stage };
    if (mine){ startLive(mine.h, mine.a, { cup: CUP_NAMES[S.cup.stage] }); return; }
    finishCupRound(null); return;
  }

}
function finishLeagueRound(myM){
  const r = S.rounds[S.round], res = [];

    const M = myM && m.h === myM.h && m.a === myM.a ? myM : playOut(newMatch(m.h, m.a));

  S.round++; between(); roundNews(res, 'league'); boardMood(res);

}
function finishCupRound(myM){
  const cur = S.cup.cur, res = [];
  for (const t of cur.ties){ const M = myM && t.h === myM.h && t.a === myM.a ? myM : playOut(newMatch(t.h, t.a, { cup: CUP_NAMES[cur.stage] })); apply(M, 'cup'); res.push(summary(M)); }

// a suspension is served by missing a match the club played
function serve(cids){ const set = new Set(cids); for (const id in S.pl){ const p = P.get(+id); if (p && set.has(p.club) && S.pl[id].sus > 0 && !S.pl[id].justBanned) S.pl[id].sus--; delete S.pl[id].justBanned; } }
function summary(M){

      <div class="row" style="justify-content:center;margin-top:12px">${M.over ? `<button class="btn primary" id="done">Continue</button>` : `${L.started && !L.paused ? '<button class="btn" id="pause">Pause</button>' : `<button class="btn primary" id="play">${L.started ? 'Resume' : 'Kick off'}</button>`}<span class="speed">${SPEEDS.map(([, n], i) => `<button class="btn small ${SPEED === i ? 'primary' : ''}" data-speed="${i}">${n}</button>`).join('')}</span><button class="btn small" id="skip">To the end</button>`}</div></section>
    <div class="mgrid"><section class="card"><h3 style="margin-bottom:8px">Commentary</h3><div class="feed" id="feed">${M.feed.map(f => `<p class="${f.c} ${f.c === 'goal' && f.side === 'them' ? 'them' : ''}"><span class="m">${f.m ? f.m + "'" : ''}</span>${f.t}</p>`).join('') || '<p class="minor">The teams are out.</p>'}</div></section>
      <div class="stack"><section class="card"><h3 style="margin-bottom:6px">Match stats</h3>${statBars([['Shots', [M.H.sh, M.A.sh]], ['On target', [M.H.sot, M.A.sot]], ['Possession %', [Math.round(100 * M.H.poss / Math.max(1, M.H.poss + M.A.poss)), 100 - Math.round(100 * M.H.poss / Math.max(1, M.H.poss + M.A.poss))]], ['Corners', [M.H.corners, M.A.corners]], ['Fouls', [M.H.fouls, M.A.fouls]], ['Cards', [M.H.yc + M.H.rc, M.A.yc + M.A.rc]]], M.h, M.a)}</section>
      ${M.over ? ratingsCard(M) : changesCard(M, us)}</div></div></div>`;
  const feed = $('#feed'); if (feed) feed.scrollTop = feed.scrollHeight;
  const on = (id, f) => { const el = $('#' + id); if (el) el.addEventListener('click', f); };
  on('play', () => { L.started = true; L.paused = false; run(); viewMatch(); });
  on('pause', () => { L.paused = true; clearTimeout(TIMER); viewMatch(); });
  on('skip', () => { clearTimeout(TIMER); L.started = true; playOut(M); viewMatch(); });
  on('done', () => { const kind = L.cup ? 'cup' : 'league'; LIVE = null; if (kind === 'cup') finishCupRound(M); else finishLeagueRound(M); TAB = 'home'; view(); scrollTo(0, 0); });
  document.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => { SPEED = +b.dataset.speed; viewMatch(); }));
  document.querySelectorAll('[data-off]').forEach(b => b.addEventListener('click', () => { L.sel = { off: +b.dataset.off, on: L.sel && L.sel.on }; trySub(); }));
  document.querySelectorAll('[data-on]').forEach(b => b.addEventListener('click', () => { L.sel = { on: +b.dataset.on, off: L.sel && L.sel.off }; trySub(); }));
  document.querySelectorAll('.seg[data-mk] button').forEach(b => b.addEventListener('click', () => { us.t[b.parentElement.dataset.mk] = +b.dataset.v; say(M, us, 'minor', `${esc(club(us.cid).name)} change their approach: ${b.parentElement.dataset.mk === 'men' ? MENTALITY[+b.dataset.v].toLowerCase() : b.textContent.toLowerCase()}.`); viewMatch(); }));
}
function trySub(){
  const L = LIVE, M = L.M, us = M.h === me() ? M.H : M.A;
  if (L.sel && L.sel.off && L.sel.on){ const out = us.on.find(x => x.id === L.sel.off); if (out && substitute(M, us, out, false, L.sel.on)) L.sel = null; else { toast('No more changes allowed.'); L.sel = null; } }
  viewMatch();
}
function changesCard(M, us){
  const L = LIVE;
  const segs = (key, Lb) => `<div class="seg" data-mk="${key}">${Lb.map((n, i) => `<button data-v="${i}" class="${us.t[key] === i ? 'on' : ''}">${n}</button>`).join('')}</div>`;
  return `<section class="card"><h3 style="margin-bottom:6px">Changes <span class="muted small">${us.subs}/5 used</span></h3>
    <div class="instr" style="margin-bottom:10px"><span class="small muted">Mentality</span>${segs('men', ['V.def', 'Def', 'Bal', 'Att', 'V.att'])}<span class="small muted">Pressing</span>${segs('press', PRESS)}</div>
    <div class="split"><div class="subs"><div class="small muted">Take off</div>${us.on.map(x => `<button data-off="${x.id}" class="${L.sel && L.sel.off === x.id ? 'sel' : ''}"><span>${x.pos} ${esc(surname(x.p.n))}</span><span class="num muted">${Math.round(x.e)}%</span></button>`).join('')}</div>
    <div class="subs"><div class="small muted">Bring on</div>${us.bench.map(id => P.get(id)).filter(Boolean).map(p => `<button data-on="${p.id}" class="${L.sel && L.sel.on === p.id ? 'sel' : ''}"><span>${p.prim} ${esc(surname(p.n))}</span><span class="num muted">${p.ovr}</span></button>`).join('') || '<span class="small muted">No one left</span>'}</div></div>
    <p class="small muted" style="margin:8px 0 0">The percentages are the players' energy. Pick one to take off and one to bring on.</p></section>`;
}
function ratingsCard(M){
  const col = s => [...s.on.map(x => x.id), ...(s.subbed || []).map(x => x[0])].filter((id, i, L) => L.indexOf(id) === i).map(id => ({ id, v: s.rate[id] })).filter(x => x.v).sort((a, b) => b.v - a.v);
  const list = s => col(s).map(x => `<div class="arow"><span>${esc(surname(P.get(x.id).n))}${x.id === M.mom ? ' <span class="mom">★</span>' : ''}</span><span class="num">${x.v.toFixed(1)}</span></div>`).join('');
  return `<section class="card"><h3 style="margin-bottom:6px">Ratings</h3><div class="split small"><div><div class="muted small">${esc(club(M.h).name)}</div>${list(M.H)}</div><div><div class="muted small">${esc(club(M.a).name)}</div>${list(M.A)}</div></div></section>`;
}
function run(){
  clearTimeout(TIMER);
  const L = LIVE; if (!L || L.paused) return;
  const M = L.M, before = M.feed.length, goalsBefore = M.H.goals + M.A.goals;
  const going = step(M);
  if (M.ht && M.half === 2 && M.min === 45){ M.ht = false; L.paused = true; viewMatch(); return; }   // half-time: a pause for changes
  if (M.feed.length !== before || !going || M.min % 5 === 0) viewMatch(); else { const c = document.querySelector('.clock'); if (c) c.textContent = `${Math.min(M.min, M.half === 1 ? 45 : 90)}'${M.min > (M.half === 1 ? 45 : 90) ? '+' + (M.min - (M.half === 1 ? 45 : 90)) : ''}`; }
  if (!going) return;
  const pause = M.H.goals + M.A.goals > goalsBefore ? 3 : 1;
  TIMER = setTimeout(run, SPEEDS[SPEED][0] * pause);
}

/* =====================================================================================================================
   start
   ===================================================================================================================== */
(async () => {
  try { const r = (await window.__cm) || await fetch('cm.json', { cache: 'no-cache' }); if (r.ok) D = await r.json(); } catch (e) {}
  if (!D || !D.clubs || D.clubs.length < 4){ $('#app').innerHTML = `${header()}<section class="card"><h2>Coming soon</h2><p class="muted" style="margin:8px 0 0">The league is being put together. Come back tomorrow.</p></section>`; return; }
  for (const [k, n] of D.attrs || []) ATTR_NAME[k] = n;
  D.players.forEach(p => P.set(p.id, p)); D.clubs.forEach(c => C.set(c.id, c));
  const s = load();
  // a saved season goes on only with the same league data's clubs; otherwise a new one starts
  if (s && s.v === 1 && C.has(s.club) && Object.keys(s.table).every(id => C.has(+id)) && Object.keys(s.table).length === D.clubs.length) S = s;
  view();
})();
</script>
</body></html>
