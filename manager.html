<style>
/* Manager: laid out the classic way (a bar down the left with the date and Continue Game, a title, tabs above and
   below the content, Back and Next) and dressed like the other two games: the night blue, the panels, Oswald and Rubik,
   and its own colour, the green of a fresh pitch. */
:root{
  --night:#0B1626; --panel:#13233A; --panel-2:#1A2E4A; --panel-3:#22395A; --line:#294060;
  --gold:#4FD18B; --gold-ink:#06210F; --text:#F3EFE6; --muted:#A3B1C4; --dim:#7488A3;
  --win:#5CC08A; --loss:#E57A62; --draw:#C9B458; --hot:#E57A62; --ok:#5CC08A; --warn:#F2B24A; --sky:#7FC8F8; --yel:#F2D33D;
  --display:'Oswald','Arial Narrow',Arial,sans-serif; --body:'Rubik','Segoe UI',Arial,sans-serif; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--night);color:var(--text)}
body{font:14px/1.45 var(--body);margin:0;min-height:100vh;background-attachment:fixed;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27130%27%20height%3D%27130%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27white%27%20stroke-opacity%3D%27.035%27%20stroke-width%3D%273%27%20stroke-linecap%3D%27round%27%3E%3Cpath%20d%3D%27M18%2022l14%2014M32%2022L18%2036%27%2F%3E%3Ccircle%20cx%3D%2795%27%20cy%3D%2798%27%20r%3D%279%27%2F%3E%3Cpath%20d%3D%27M40%2050q20%2018%2045%2034%27%20stroke-dasharray%3D%274%207%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E")}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.small{font-size:12px}.dim{color:var(--muted)}.yel{color:var(--gold)}.sky{color:var(--sky)}.r{text-align:right}.c{text-align:center}.num{font-variant-numeric:tabular-nums}
/* the strip the three games share */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;max-width:1180px;margin:0 auto}
.mark{display:flex;align-items:center;gap:8px;font:700 16px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}.mark .home{display:flex;align-items:center;gap:8px;color:var(--text);text-decoration:none}.mark img{height:28px;width:auto}.mark .mtxt>span{color:var(--gold)}
.mark .trk{display:inline-flex;align-items:center;gap:5px;margin-left:6px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);text-decoration:none;font:500 11px/1 var(--body);letter-spacing:.04em;text-transform:none}.mark .trk:hover{color:var(--text)}
.games{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}.games a{padding:5px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font:600 13px/1 var(--body);white-space:nowrap}.games a.on{background:var(--gold);color:var(--gold-ink)}.games a:not(.on):hover{color:var(--text)}
@media(max-width:440px){.mark .trk span{display:none}.mark .trk{padding:5px 6px;margin-left:2px}.mark .mtxt{display:none}.mark img{height:32px}.games a{padding:5px 10px;font-size:12px}}
@media(max-width:400px){.games a{padding:5px 7px;font-size:11.5px}.mark .trk{display:none}}
/* the frame */
.cm{display:grid;grid-template-columns:200px 1fr;gap:12px;max-width:1180px;margin:0 auto;padding:0 16px 30px}
.side{background:var(--panel);border-radius:14px;display:flex;flex-direction:column;align-items:stretch;padding:10px 8px;gap:4px;align-self:start;position:sticky;top:10px}
.date{background:var(--panel-2);border-radius:10px;text-align:center;padding:8px 4px;font:600 15px/1.25 var(--display);letter-spacing:.04em;text-transform:uppercase}
.date span{display:block}.date span:first-child{color:var(--gold)}.date span:last-child{color:var(--muted);font-size:12px}
.arrows{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.arrows button{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;color:var(--text);font-weight:700;padding:5px 0}
.arrows button:disabled{opacity:.35;cursor:default}
.sb{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;color:var(--muted);font-weight:500;padding:8px 10px;line-height:1.2}
.sb:hover{background:var(--panel-2);color:var(--text)}
.sb.go{background:var(--gold);color:var(--gold-ink);text-align:center;font:600 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;border-radius:10px;padding:12px 6px;margin:4px 0}
.sb.go:hover{filter:brightness(1.08)}
.sb.mgr,.sb.myclub{color:var(--text);font-weight:700}
.sb.on{background:var(--panel-3);color:var(--text);box-shadow:inset 3px 0 0 var(--gold)}
.mtree{display:flex;flex-direction:column;gap:1px;margin-top:2px}
.mi{display:flex;align-items:center;gap:5px;width:100%;text-align:left;background:none;border:0;border-radius:7px;color:var(--muted);font-weight:500;font-size:13px;padding:6px 8px 6px calc(8px + var(--d) * 11px);line-height:1.2}
.mi.d0{font-size:14px;font-weight:600;color:var(--text);padding-top:8px;padding-bottom:8px}
.mi.mgr,.mi.myclub{font-weight:700}
.mi:hover{background:var(--panel-2);color:var(--text)}
.mi.path{color:var(--text)}
.mi.on{background:var(--panel-3);color:var(--text);box-shadow:inset 3px 0 0 var(--gold)}
.mi.ctx{color:var(--gold)}
.mi .car{font-style:normal;font-size:10px;width:10px;flex:0 0 10px;color:var(--muted)}
.mi span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .mcr{width:14px;height:14px;object-fit:contain;vertical-align:-2px;margin-right:5px}
.msub{display:flex;flex-direction:column;gap:1px}
.mtog{display:none;flex-basis:100%;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-weight:600;text-align:left}
.mtog .crumb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-weight:500}
.mi .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--warn);color:#2A1700;font-size:11px;line-height:18px;text-align:center}
.sb .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--warn);color:#2A1700;font-size:11px;line-height:18px;text-align:center}
.main{display:flex;flex-direction:column;gap:8px;min-width:0}
/* the title */
.banner{position:relative;display:grid;grid-template-columns:30px 1fr auto;align-items:center;min-height:66px;border-radius:14px;overflow:hidden;
  background:linear-gradient(100deg,var(--k1,#1A2E4A) 0,color-mix(in srgb,var(--k1,#1A2E4A) 55%,var(--night)) 100%)}
.banner h1{margin:0;text-align:center;font:600 30px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em;color:var(--k2,var(--text));padding:10px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner .sub{display:block;font:500 13px/1.3 var(--body);text-transform:none;letter-spacing:0;opacity:.9;margin-top:2px}
.banner .act{margin:8px;align-self:start}
@media(max-width:600px){.banner{grid-template-columns:1fr}.banner>span:first-child{display:none}.banner h1{font-size:22px;white-space:normal}.banner .act{justify-self:center;margin:0 8px 10px}.banner .act:empty{display:none}}
/* tabs, dropdowns, buttons */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--panel);border-radius:999px;padding:4px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;min-width:90px;background:none;border:0;color:var(--muted);font-weight:600;padding:7px 12px;border-radius:999px;white-space:nowrap}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:var(--gold);color:var(--gold-ink)}
.tabs button:disabled{color:#4F6280;cursor:default}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dd{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;color:var(--text);font-weight:500;padding:6px 8px;min-width:120px}
.dd option{background:var(--panel)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;color:var(--text);font-weight:600;padding:7px 13px}
.btn:hover{border-color:var(--muted)}
.btn.y{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
input[type=text]{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:7px 10px}
.bn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bn button{background:var(--panel-2);border:0;border-radius:10px;color:var(--text);font:600 16px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:13px 0}
.bn button:hover:not(:disabled){background:var(--panel-3)}
.bn #next:not(:disabled){background:var(--gold);color:var(--gold-ink)}
.bn button:disabled{color:#4F6280;cursor:default}
/* the content */
.pane{background:var(--panel);border-radius:14px;padding:14px;min-height:240px;overflow:auto}
.ptitle{font:600 15px/1.2 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:2px 0 10px}
select.pick{background:var(--panel-3);border:1px solid var(--line);border-radius:7px;color:var(--muted);font:600 12px/1 var(--body);padding:5px 4px;min-width:62px;max-width:96px}
select.pick.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}select.pick.sub{background:color-mix(in srgb,var(--sky) 30%,var(--panel-3));color:var(--text);border-color:var(--sky)}
select.pick option,select.pick optgroup{background:var(--panel);color:var(--text)}
.mov{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr) minmax(0,1fr);gap:12px;margin-top:12px;align-items:start}
.mov>div{background:var(--panel-2);border-radius:12px;padding:8px 10px;min-width:0}.mov .pitch.mini{max-width:none}
.mov .sbar{grid-template-columns:30px 1fr 30px;margin:4px 0}.mov-sc{width:100%;font-size:12.5px}.mov-sc td{padding:3px 2px}
.dot.rtd{background:var(--rc)!important;color:#0b1626!important;font-weight:700}
@media(max-width:900px){.mov{grid-template-columns:1fr 1fr}.mov-m{grid-column:1/-1;order:3}}
@media(max-width:560px){.mov{grid-template-columns:1fr}.mov .pitch.mini{max-width:290px;margin:0 auto}}
.troph{margin-bottom:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}.tph{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.ovc .troph{margin:4px 0 2px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}.tphn{font:700 24px/1 var(--display);color:var(--gold);min-width:28px;text-align:center}
.ovclub{display:flex;align-items:center;gap:16px;background:linear-gradient(100deg,color-mix(in srgb,var(--k1) 30%,var(--panel-2)),var(--panel-2) 70%);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.kit{width:64px;height:60px;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}.kit.sm{width:40px;height:38px}
.ovci{flex:1;min-width:0}.ovcn{font:600 22px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.ovchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.ovchips span:empty{display:none}.ovchips span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;color:var(--muted)}
.ovform{display:flex;gap:3px}.ovform span{width:24px;height:24px;display:grid;place-items:center;border-radius:6px;font:700 12px/1 var(--body);color:#0b1626}.ovform .W{background:var(--win)}.ovform .D{background:var(--draw)}.ovform .L{background:var(--loss)}
.ovgrid{columns:2 300px;column-gap:12px}.ovgrid>.ovc{break-inside:avoid;margin-bottom:12px;display:block}
.ovnext{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:6px 2px 10px}.ovnext>div{flex:1;text-align:center}.ovvs{font-size:15px;margin:3px 0}
@media(max-width:600px){.ovclub{flex-wrap:wrap}.ovform{width:100%}}
.ovtop{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px;align-items:start}
.ovside{display:grid;gap:12px}
.ovg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ovc{background:var(--panel-2);border-radius:12px;padding:8px 10px;min-width:0}.ovc table{width:100%}.ovc td,.ovc th{padding:4px 4px}.ovc td b{font-weight:600}
.ovh{display:flex;justify-content:space-between;align-items:center;font:600 13px/1.2 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);padding:2px 2px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.lnk{background:none;border:0;color:var(--muted);font:500 12px/1 var(--body);text-transform:none;letter-spacing:0;padding:2px 4px}.lnk:hover{color:var(--text)}
.ovsec{font:600 16px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;margin:18px 2px 8px}
@media(max-width:820px){.ovtop{grid-template-columns:1fr}}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px}
@media(max-width:700px){.cols2{grid-template-columns:1fr}}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 22px}
@media(max-width:700px){.cols3{grid-template-columns:1fr 1fr}}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:5px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
th[data-sort]{cursor:pointer}
td{padding:5px 7px;border-bottom:1px solid rgba(41,64,96,.6);white-space:nowrap}
td.r,th.r{text-align:right}td.c,th.c{text-align:center}
tr.click{cursor:pointer}tr.click:hover td{background:rgba(255,255,255,.035)}
tr.me td{background:rgba(79,209,139,.10)}
.tw{overflow-x:auto}
.cell{display:inline-block;min-width:24px;text-align:center}
.pill{display:inline-block;min-width:34px;padding:2px 6px;text-align:center;background:var(--panel-2);border-radius:6px;font-weight:700}
.form span{display:inline-block;width:17px;height:17px;line-height:17px;text-align:center;border-radius:4px;font-size:10px;font-weight:700;margin-right:2px;color:#0A1424}
.form .W{background:var(--win)}.form .D{background:var(--draw)}.form .L{background:var(--loss)}
/* the squad list, two columns */
.sq{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
@media(max-width:700px){.sq{grid-template-columns:1fr}}
.sqr{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;align-items:center;padding:4px 4px;border-bottom:1px solid rgba(41,64,96,.6);cursor:pointer;border-radius:6px}
.sqr:hover{background:rgba(255,255,255,.035)}
.sqr .nm{font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sqr .ps{color:var(--gold);font-weight:600;font-size:12px;white-space:nowrap;min-width:64px;text-align:right}
.box{width:26px;height:20px;border:1px dashed var(--line);background:none;border-radius:5px;color:var(--muted);font:700 10px/18px var(--body);text-align:center;padding:0}
.box.on{background:var(--gold);border:1px solid var(--gold);color:var(--gold-ink)}
.box.sub{background:var(--panel-3);border:1px solid var(--line);color:var(--text)}

.tag{display:inline-block;padding:0 4px;border-radius:4px;font:700 10px/16px var(--body);margin-left:5px;background:var(--panel-3);color:var(--text);vertical-align:1px}
.tag.inj{background:var(--loss);color:#0A1424}.tag.sus{background:#E3483F;color:#fff}.tag.tir{background:#9DB0C9;color:#0A1424}
/* attributes */
.arow{display:flex;justify-content:space-between;gap:8px;padding:3px 2px;border-bottom:1px solid rgba(41,64,96,.5)}
.av{font-weight:700;min-width:24px;text-align:right}
.v9{color:#5CE39A}.v8{color:#A8E063}.v7{color:#F2D33D}.v6{color:var(--text)}.v5{color:#F2A65A}.v4{color:#E57A62}
.up{color:var(--win);font-size:10px}.aup,.adn{font-size:8.5px;opacity:.7;margin-right:3px;vertical-align:1px}.aup{color:var(--win)}.adn{color:var(--loss)}.dn{color:var(--loss);font-size:10px}
.born{color:var(--gold);font:600 16px/1.3 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0 0 12px}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px}
.strip div{background:var(--panel-2);border-radius:10px;text-align:center;padding:6px 0;color:var(--muted);font-size:12px}
.strip div b{display:block;color:var(--text);font:600 18px/1.2 var(--display)}

.tac{display:grid;grid-template-columns:minmax(250px,1fr) minmax(260px,1.1fr);gap:14px;align-items:start}

.pitch{position:relative;aspect-ratio:68/88;max-width:420px;width:100%;margin:0 auto;border-radius:12px;border:2px solid var(--chalk,rgba(243,239,230,.28));background:repeating-linear-gradient(180deg,#103828 0 10%,#13422F 10% 20%);overflow:hidden}

.pitch::after{content:'';position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid rgba(243,239,230,.28);border-radius:50%}

.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0;z-index:2;width:84px}
.slot .dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--body);background:var(--k1,#ddd);color:var(--k2,#111);border:2px solid rgba(255,255,255,.75);box-shadow:0 2px 6px rgba(0,0,0,.4)}

.pl.subs{color:var(--muted)}

.pl .no{color:var(--muted);font-weight:700;text-align:right}

.mpv-h{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}

  if (t.press) L.push('Pressing wins the ball higher up and tires your players.');

/* holiday, as in CM 01/02: the calendar runs on, every game played without you; the side as you left it or picked by
   your assistant (his Judging Ability: a poor one now and then leaves out a better player); optionally he buys from
   your short list */
function goHoliday(until, pick, buy){
  if (S.done){ toast('The season is over.'); return; }
  S.hol = { until, pick, buy }; const from = S.date, n0 = S.news.length; let steps = 0;
  while (S.hol && !S.done && S.date < until && steps++ < 600){ if (!autoStep()) break; }
  const games = S.results.filter(r => r.date > from).length;
  S.hol = null; news('board', 'Back from holiday', `You are back after ${daysBetween(from, S.date)} days. ${games} league round${games === 1 ? '' : 's'} were played while you were away; the news is waiting for you.`);
  save(); V = { s: 'news' }; view();
}
function autoStep(){
  const ev = events()[0]; if (!ev){ endSeason(); return false; }
  if (ev.date > S.date){ passDays(daysBetween(S.date, nextStop(ev.date))); monthly(); holidayBuy(); return true; }
  const t = S.tac[me()];
  if (S.hol.pick === 'ass'){ const a = (S.staff || []).find(x => x.role === 'ass'), ju = a ? a.ju : 8;
    Object.assign(t, bestXI(me(), t.form, true, judge())); }
  readyTactic(me()); if (t.xi.some(x => !x)) Object.assign(t, bestXI(me(), t.form, true));
  if (ev.k === 'shield'){ finishShield(null); return true; }
  if (ev.k === 'lc'){ S.lc.cur = lcDraw(); finishLC(null); return true; }
  if (ev.k === 'cup'){ const { ties, bye } = cupDraw(); S.cup.cur = { ties, bye, stage: S.cup.stage }; finishCup(null); passDays(1); return true; }
  finishLeague(null); passDays(1); return true;
}
function holidayBuy(){
  if (!S.hol || !S.hol.buy || !windowOpen()) return;
  for (const x of (S.short || []).slice()){ const p = P.get(x.id); if (!p || p.club === me()) continue;
    const ask = askingPrice(p); if (ask > S.fin.budget || squadOf(p.club).length <= 18) continue;
    const step = club(p.club).q - club(me()).q; if (step > 5 && rng(`w-${p.id}-${S.season}`)() < .7) continue;
    S.con[p.id] = { y: S.season + 4, w: wageDemand(p) }; moveP(p, me(), ask); S.short = S.short.filter(y => y.id !== p.id);
    news('club', `${p.n} signs`, `While you were away your assistant signed <b>${esc(p.n)}</b> from your short list for ${cash(ask)}.`); }
}

let PICK2 = [];
/* scouts: two of them, each sent to watch a club; after two weeks his report comes in and that club's players are
   known (attribute masking) for the rest of the game */
const SCOUT_DAYS = 14, SCOUT_NAMES = ['Scout #1', 'Scout #2'];
function scoutTick(){
  // a scout set to watch your next opponents: you know their players by the time you meet them
  if ((S.scouts || []).some(sc => sc && sc.next)){ const ev = events().find(e => e.k === 'cup' ? S.cup.alive.includes(me()) : e.r && e.r.m.some(m => m.h === me() || m.a === me()));
    const m = ev && ev.k !== 'cup' && ev.r.m.find(x => x.h === me() || x.a === me()), opp = m && (m.h === me() ? m.a : m.h);
    if (opp && !(S.seen || []).includes(opp) && daysBetween(S.date, ev.date) <= 7){ (S.seen = S.seen || []).push(opp); news('scout', `Scout report: ${club(opp).name}`, `Your scout has watched ${esc(club(opp).name)} ahead of your game: you know their players in full now.`); } }
  for (const [k, sc] of (S.scouts || []).entries()){
    if (!sc || !sc.c || daysBetween(sc.from, S.date) < SCOUT_DAYS) continue;
    const c = club(sc.c), sq = squadOf(sc.c).filter(p => p.prim !== 'GK').sort((a, b) => ovrNow(b) - ovrNow(a));
    S.seen = S.seen || []; if (!S.seen.includes(sc.c)) S.seen.push(sc.c);
    const pick3 = sq.slice(0, 3).map(p => `<b>${esc(p.n)}</b> (${cmPos(p.pos)}, ${p.age})`).join(', ');
    const young = sq.filter(p => p.age <= 21).slice(0, 1)[0];
    news('scout', `Scout report: ${c.name}`, `${SCOUT_NAMES[k]} has finished watching ${esc(c.name)}. Every player there is now known to you in full. He rates ${pick3} as their key men${young ? `, and keeps an eye on young <b>${esc(young.n)}</b> (${young.age})` : ''}.`);

/* ---- transfers: the windows (summer to 1 September, January), your bids and the selling club's answer, the player's
   terms, other clubs' bids for your players, and the other clubs' own business ---- */
const WINDOWS = () => [[`${S.season}-06-15`, `${S.season}-09-01`], ...((S.season === D.season && (D.rules || {}).windows) || [[`${S.season + 1}-01-01`, `${S.season + 1}-01-31`]])];
const windowOpen = (d = S.date) => WINDOWS().some(([a, b]) => d >= a && d <= b);
const windowNext = () => WINDOWS().find(([a]) => S.date < a);
const roundFee = v => v >= 1e7 ? Math.round(v / 5e5) * 5e5 : Math.round(v / 1e5) * 1e5;

// what the selling club wants: his value, more for a first-choice player, less with little left on his contract
function askingPrice(p){

  return roundFee(p.val * 1e6 * key * (yrs <= 1 ? .7 : yrs >= 4 ? 1.15 : 1));

/* ---- managers: reputation, jobs; transfers; the manager's own profile ---- */
const REP_WORDS = ['Poor', 'Average', 'Good', 'Very Good', 'Excellent', 'World Class'];
function managers(){
  const st = standings(), byQ = D.clubs.slice().sort((a, b) => b.q - a.q).map(c => c.id);
  return D.clubs.map(c => { const mine = c.id === me(), rr = rng(`m-${c.id}`), score = mine ? ({ 'Unproven': 1, 'Poor': 0, 'Average': 1, 'Good': 2, 'Very good': 3 }[S.rep] ?? 1) * 20 + 10 : clamp(Math.round((c.q - 70) * 3.2 + rr() * 14), 0, 99);
    const pos = st.findIndex(r => r.id === c.id) + 1, exp = byQ.indexOf(c.id) + 1, diff = S.round >= 5 ? pos - exp : 0;
    const sec = mine ? (S.conf >= 62 ? 'Secure' : S.conf >= 40 ? 'Okay' : S.conf >= 22 ? 'Insecure' : 'Very Insecure') : diff <= 0 ? 'Secure' : diff <= 3 ? 'Okay' : diff <= 6 ? 'Insecure' : 'Very Insecure';
    const vac = !mine && (S.vac || {})[c.id]; return { cid: c.id, name: mine ? S.manager : vac ? 'Vacant' : coachOf(c.id), mine, vac: !!vac, score: vac ? -1 : score, rep: vac ? '-' : REP_WORDS[clamp(Math.floor(score / 17), 0, 5)], sec: vac ? 'Vacant' : sec }; }).sort((a, b) => b.score - a.score);
}
/* the managers' merry-go-round: a manager whose club is well below where it should be may be sacked; the club appoints
   someone ten days later, unless you take the job first. Apply for any vacant job; whether you get it depends on your
   reputation and the club's standing */
const COACH_FIRST = ['Mark', 'Steve', 'Paul', 'Rui', 'Marco', 'Thomas', 'Graham', 'Sean', 'Luca', 'Ange', 'Niko', 'Ralf', 'Kevin', 'Danny'];
const COACH_LAST = ['Hartley', 'Dunmore', 'Ferreira', 'Rossetti', 'Wingate', 'Mallory', 'Kessler', 'Brannan', 'Okoro', 'Lindqvist', 'Vidal', 'Thornbury', 'Castell', 'Rourke'];
const coachOf = cid => (S.vac || {})[cid] ? null : ((S.coachOv || {})[cid] || club(cid).coach || `${club(cid).name} manager`);
// a good player of yours who hardly plays and is unhappy asks to leave; once he is playing and happy again he drops it
function unrest(){
  if (S.round < 8) return;
  for (const p of squadOf(me())){ const q = ps(p.id);
    if (q.req === S.season && q.mor >= 60){ q.req = null; news('club', `${p.n} is settled`, `<b>${esc(p.n)}</b> has withdrawn his transfer request.`); continue; }
    if (q.req === S.season || squadRank(p) >= 14 || q.apps >= S.round * .3 || q.mor >= 40 || q.injD) continue;
    q.req = S.season; news('club', `${p.n} wants to leave`, `<b>${esc(p.n)}</b> has handed in a transfer request: he wants first-team football. Other clubs will hear of it.`); }
}
function aiSackings(){
  S.vac = S.vac || {}; S.coachOv = S.coachOv || {};
  for (const [cid, v] of Object.entries(S.vac)) if (+cid !== me() && daysBetween(v.d, S.date) >= 10){
    const r = rng(`co-${cid}-${S.date}`), nm = `${COACH_FIRST[Math.floor(r() * COACH_FIRST.length)]} ${COACH_LAST[Math.floor(r() * COACH_LAST.length)]}`;
    S.coachOv[cid] = nm; delete S.vac[cid]; news('club', `${club(+cid).name} appoint ${nm}`, `${esc(club(+cid).name)} have named <b>${esc(nm)}</b> as their new manager.`); }
  if (S.round < 8) return;
  const st = standings(), byQ = D.clubs.slice().sort((a, b) => b.q - a.q).map(c => c.id);
  for (const c of D.clubs){ if (c.id === me() || S.vac[c.id]) continue;
    const diff = (st.findIndex(r => r.id === c.id) + 1) - (byQ.indexOf(c.id) + 1);
    if (diff >= 7 && Math.random() < .05){ const nm = coachOf(c.id); S.vac[c.id] = { d: S.date, prev: nm }; news('club', `${nm} sacked`, `${esc(c.name)} have parted company with <b>${esc(nm)}</b>, with the club ${ordinal(st.findIndex(r => r.id === c.id) + 1)} in the league.`); } }
}
const REP_SCORE = { 'Unproven': 1, 'Poor': 0, 'Average': 1, 'Good': 2, 'Very good': 3 };
function jobOK(cid){ const rank = D.clubs.slice().sort((a, b) => b.q - a.q).findIndex(c => c.id === cid) + 1; return rank >= [15, 12, 7, 1][REP_SCORE[S.rep] ?? 1]; }
function takeJob(cid){
  const old = S.club, c = club(cid), q = c.q;
  if (!S.sacked){ S.vac = S.vac || {}; S.vac[old] = { d: S.date }; }
  if (S.vac) delete S.vac[cid];

  S.fin = { ...S.fin, bal: Math.round((40 + (q - 70) * 6) * 1e6), budget: Math.round(Math.max(12, (q - 70) * 9) * 1e6) };

  news('board', `Welcome to ${c.name}`, `The chairman has appointed ${esc(S.manager)} as manager. The board's expectation: <b>${AIMS[S.aim].name}</b>.`);
}

  if (D.second) D.players = D.players.concat(D.second.players);
  D.players.forEach(p => { P.set(p.id, p); p._c0 = p.club; p._n0 = p.no; }); D.all = D.players.slice(); D.allClubs.forEach(c => C.set(c.id, c));
  D.pool = D.all.slice(); setLeagues(null);
  if (D.cup && (D.cup.rounds || []).length >= 5){ CUP_NAMES = D.cup.rounds.slice(-6).map(r => r[0]); CUP = D.cup.name || 'Cup'; }
  if (D.rules && D.rules.bench) BENCH = D.rules.bench;
  adopt(loadSave());
  view();
})();

// keys, as in CM: Enter or Space presses the green button on the left (Continue Game, Go to Match, Kick Off...),
// Esc goes back, Alt+arrows walk the history
document.addEventListener('keydown', e => {
  const t = e.target, typing = t && (t.isContentEditable || /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName));
  if (typing || e.ctrlKey || e.metaKey) return;
  if ((e.key === 'Enter' || e.key === ' ') && !(t && t.tagName === 'BUTTON') && !e.altKey){
    const g = document.querySelector('.side .sb.go:not([disabled])'); if (g){ e.preventDefault(); g.click(); } return; }
  if (e.key === 'Escape'){ const b = document.querySelector('#back:not([disabled])'); if (b){ e.preventDefault(); b.click(); } return; }
  if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){ const b = document.querySelector(e.key === 'ArrowLeft' ? '#navb:not([disabled])' : '#navf:not([disabled])'); if (b){ e.preventDefault(); b.click(); } }
});
</script>
