<style>

:root{

}
*{box-sizing:border-box}

body{font:14px/1.45 var(--body);margin:0;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}

.mbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;border-radius:12px;overflow:hidden;border:1px solid var(--line)}

<script>
'use strict';
/* =====================================================================================================================
   data: cm.json from the pipeline (pipeline/cm_model.py): the league's clubs, players with 25 attributes, fixtures

let D = null; const P = new Map(), C = new Map();

const KEYS_OF = { GK: ['ga', 'gr', 'gc', 'gh', 'gl'], CB: ['da', 'bw', 'he', 'pc', 'ju'], FB: ['da', 'bw', 'sp', 'st', 'lp'], DM: ['da', 'bw', 'lp', 'pc', 'st'], CM: ['lp', 'lf', 'bc', 'st', 'tp'],
  WM: ['lp', 'lf', 'dr', 'sp', 'st'], AM: ['lp', 'bc', 'tp', 'oa', 'dr'], W: ['dr', 'sp', 'ac', 'oa', 'bc'], ST: ['oa', 'fi', 'bc', 'he', 'kp'] };

function rng(seed){ let s = 0; for (const ch of String(seed)) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  const rounds = [];

    const by = new Map();
    for (const [date, round, h, a] of real){ const n = parseInt(String(round).replace(/\D+/g, ''), 10) || 0; if (!by.has(n)) by.set(n, { date, m: [] }); const r = by.get(n); r.m.push({ h, a }); if (date < r.date) r.date = date; }
    [...by.keys()].sort((a, b) => a - b).forEach(k => rounds.push(by.get(k)));
    for (let i = 1; i < rounds.length; i++) if (rounds[i].date <= rounds[i - 1].date) rounds[i].date = day(rounds[i - 1].date, 3);
  } else {
    const L = ids.slice(); const r0 = rng(seed); for (let i = L.length - 1; i > 0; i--){ const j = Math.floor(r0() * (i + 1)); [L[i], L[j]] = [L[j], L[i]]; }

  const order = slots.map((s, i) => i).sort((a, b) => (slots[a][0] === 'GK' ? -1 : 0) - (slots[b][0] === 'GK' ? -1 : 0));
  for (const i of order){ let best = null, bs = -1; for (const p of pool) if (!used.has(p.id)){ const v = score(p, slots[i][0]); if (v > bs){ bs = v; best = p; } } if (best){ xi[i] = best.id; used.add(best.id); } }

    if (q.injD){ q.injD = Math.max(0, q.injD - n); if (!q.injD){ q.light = 1; if (p.club === me()) news('injury', `${p.n} is fit again`, `${esc(p.n)} has recovered and is back in training. He may not be at his sharpest for his first game back.`); } }

function trainWeek(wk){
  const keys = Object.keys(ATTR_NAME), inten = [0.6, 1, 1.4][S.train.int];
  for (const p of D.players){ const q = ps(p.id), rr = rng(`${S.seed}-${p.id}-${wk}`), age = p.age, mine = p.club === me();
    const grow = age <= 19 ? .32 : age <= 21 ? .22 : age <= 24 ? .1 : age <= 27 ? .03 : age <= 29 ? 0 : age <= 31 ? -.06 : -.14;

    <div class="now ${last.c} ${last.side === 'them' ? 'them' : ''}" id="now">${last.m ? `<span class="dim" style="margin-right:8px">${last.m}'</span>` : ''}${last.t}</div>
    <div class="row" style="justify-content:space-between"><div class="row">${M.over ? `<button class="btn primary" id="done">Continue</button>` : `${L.started && !L.paused ? '<button class="btn" id="pause">Pause</button>' : `<button class="btn primary" id="play">${!L.started ? 'Kick off' : L.atHT ? 'Second half' : 'Resume'}</button>`}<button class="btn small" id="skip">To full time</button>`}</div>
      <div class="seg" id="spd">${SPEEDS.map(([, n], i) => `<button data-v="${i}" class="${SPEED === i ? 'on' : ''}">${n}</button>`).join('')}</div></div>
    <div class="mtabs">${tabs.map(([k, n]) => `<button data-mt="${k}" class="${MTAB === k ? 'on' : ''}">${n}</button>`).join('')}</div>
    <div id="mpanel">${mPanel()}</div></div>`;
  const on = (id, f) => { const el = $('#' + id); if (el) el.addEventListener('click', f); };
  on('play', () => { L.started = true; L.paused = false; L.atHT = false; run(); });
  on('pause', () => { L.paused = true; clearTimeout(TIMER); viewMatch(); });
  on('skip', () => { clearTimeout(TIMER); L.started = true; L.paused = true; L.atHT = false; while (step(M)) L.others.forEach(o => step(o)); L.others.forEach(o => playOut(o)); viewMatch(); });
  on('done', () => { LIVE = null; if (L.cup) finishCup(M, L.others); else finishLeague(M, L.others); passDays(1); save(); SCREEN = 'news'; view(); scrollTo(0, 0); });
  $('#spd').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { SPEED = +b.dataset.v; viewMatch(); }));
  document.querySelectorAll('[data-mt]').forEach(b => b.addEventListener('click', () => { MTAB = b.dataset.mt; viewMatch(); }));
  wireMatchPanel();
}
function mPanel(){
  const L = LIVE, M = L.M, us = M.h === me() ? M.H : M.A;
  const pct = Math.round(100 * M.H.poss / Math.max(1, M.H.poss + M.A.poss));
  if (MTAB === 'overview') return `<div class="grid2">${panel('Incidents', `<div class="inc">${M.inc.map(x => `<div class="h">${x.side === 'h' ? icon(x.k) + esc(x.t) : ''}</div><div class="m">${x.l}'</div><div>${x.side === 'a' ? icon(x.k) + esc(x.t) : ''}</div>`).join('') || '<div></div><div class="m">-</div><div></div>'}</div>`)}${panel('Commentary', `<div class="feed">${M.feed.slice().reverse().map(f => `<p class="${f.c} ${f.side === 'them' ? 'them' : ''}"><span class="m">${f.m ? f.m + "'" : ''}</span>${f.t}</p>`).join('')}</div>`)}</div><p class="small muted" style="margin:0">Referee ${esc(M.ref.n)} · ${esc(M.weather)}, ${M.temp}°C</p>`;
  if (MTAB === 'stats') return panel('Match stats', statBars({ poss: [pct, 100 - pct], pas: [Math.round(100 * M.H.pc / Math.max(1, M.H.pa)), Math.round(100 * M.A.pc / Math.max(1, M.A.pa))], sh: [M.H.sh, M.A.sh], sot: [M.H.sot, M.A.sot], cor: [M.H.corners, M.A.corners], fou: [M.H.fouls, M.A.fouls], off: [M.H.off, M.A.off], yc: [M.H.yc, M.A.yc], rc: [M.H.rc, M.A.rc] }, M.h, M.a));
  if (MTAB === 'ratings'){ const col = s => { const ids = [...s.on.map(x => x.id), ...s.subbed.map(x => x[0])].filter((id, i, a) => a.indexOf(id) === i); return ids.map(id => { const v = M.over ? s.rate[id] : clamp(6.3 + (s.rate[id] || 0), 1, 10), x = s.on.find(y => y.id === id); return `<div class="arow"><span>${esc(surname(P.get(id).n))} <span class="small dim">${x ? x.pos : 'off'}</span>${id === M.mom ? ' ★' : ''}</span><span class="num">${M.over ? v.toFixed(1) : Math.round(v)}</span></div>`; }).join(''); };
    return `<div class="grid2">${panel(esc(club(M.h).name), col(M.H))}${panel(esc(club(M.a).name), col(M.A))}</div>`; }
  if (MTAB === 'zones'){ const cur = (M.half - 1) * 100 + M.min, z = from => { const L2 = M.zones.filter(([m, h]) => (h - 1) * 100 + m > from); const c = [0, 0, 0]; L2.forEach(([, , k]) => c[k]++); const t = Math.max(1, L2.length); return c.map(v => Math.round(100 * v / t)); };
    const show = (t, v) => `<h3 style="margin:8px 0 6px">${t}</h3><div class="zones"><div>${v[0]}%<small>${esc(club(M.h).name)} half</small></div><div>${v[1]}%<small>Midfield</small></div><div>${v[2]}%<small>${esc(club(M.a).name)} half</small></div></div>`;
    return panel('Action zones', `${show('Last five minutes', z(cur - 5))}${show('The whole match', z(-1))}<div class="posbar" style="--bh:${kitOf(M.h)[0]};--ba:${kitOf(M.a)[0]}"><i style="width:${pct}%"></i><i style="width:${100 - pct}%"></i></div><p class="small muted" style="margin:6px 0 0">Possession: ${esc(club(M.h).name)} ${pct}%, ${esc(club(M.a).name)} ${100 - pct}%.</p>`); }
  if (MTAB === 'table'){ if (L.cup) return panel('Live table', '<p class="muted" style="margin:0">A cup match: no table today.</p>');
    const tab = JSON.parse(JSON.stringify(S.table)); for (const m of [M, ...L.others]){ if (!m.min && !m.over) continue; for (const [s, gf, ga] of [[m.H, m.H.goals, m.A.goals], [m.A, m.A.goals, m.H.goals]]){ const t = tab[s.cid]; t.p++; t.gf += gf; t.ga += ga; if (gf > ga) t.w++; else if (gf === ga) t.d++; else t.l++; } }
    const st = Object.entries(tab).map(([id, t]) => ({ id: +id, ...t, gd: t.gf - t.ga, pts: t.w * 3 + t.d })).sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
    return panel('Live table', `<table><thead><tr><th>#</th><th>Club</th><th class="r">P</th><th class="r">GD</th><th class="r">Pts</th></tr></thead><tbody>${st.map((r, i) => `<tr class="${r.id === me() ? 'me' : ''}"><td>${i + 1}</td><td><span class="kit" style="background:${kitOf(r.id)[0]}"></span>${esc(club(r.id).name)}</td><td class="r">${r.p}</td><td class="r">${r.gd > 0 ? '+' : ''}${r.gd}</td><td class="r"><b>${r.pts}</b></td></tr>`).join('')}</tbody></table>`); }
  if (MTAB === 'scores') return panel('Latest scores', L.others.length ? `<table><tbody>${L.others.map(o => `<tr><td class="r">${esc(club(o.h).name)}</td><td class="c"><b>${o.H.goals}-${o.A.goals}</b>${o.pens ? ` <span class="small dim">(${o.pens[0]}-${o.pens[1]} p)</span>` : ''}</td><td>${esc(club(o.a).name)}</td><td class="small dim">${o.over ? 'FT' : o.min ? label(o) + "'" : ''}</td></tr>`).join('')}</tbody></table>` : '<p class="muted" style="margin:0">No other matches today.</p>');
  if (MTAB === 'tactics'){ const t = us.t, seg = (key, Lb) => `<div class="seg" data-mk="${key}">${Lb.map((n, i) => `<button data-v="${i}" class="${t[key] === i ? 'on' : ''}">${n}</button>`).join('')}</div>`, tog = (k, n) => `<button class="tog ${t[k] ? 'on' : ''}" data-mt2="${k}">${t[k] ? '✓' : '○'} ${n}</button>`;
    return `<div class="grid2">${panel('Team instructions', `<div class="instr"><span class="small muted">Mentality</span>${seg('men', MENT.map(x => x.replace('Very ', 'V. ')))}<span class="small muted">Passing</span>${seg('pass', PASS)}<span class="small muted">Tackling</span>${seg('tack', TACK)}<span class="small muted">Tactics</span><div class="row">${tog('press', 'Pressing')}${tog('offside', 'Offside trap')}${tog('counter', 'Counter')}${tog('mbb', 'Men behind ball')}</div></div>`)}
      ${panel(`Substitutions · ${us.subs}/5`, M.over ? '<p class="muted" style="margin:0">The match is over.</p>' : `<div class="grid2"><div><div class="small muted" style="margin-bottom:4px">On the pitch</div>${us.on.map(x => `<button class="btn small" style="width:100%;justify-content:space-between;margin-bottom:3px;${L.sel && L.sel.off === x.id ? 'border-color:var(--acc)' : ''}" data-off="${x.id}"><span>${x.pos} ${esc(surname(x.p.n))}</span><span class="dim">${Math.round(x.e)}%</span></button>`).join('')}</div><div><div class="small muted" style="margin-bottom:4px">Substitutes</div>${us.bench.map(id => P.get(id)).filter(Boolean).map(p => `<button class="btn small" style="width:100%;justify-content:space-between;margin-bottom:3px;${L.sel && L.sel.on === p.id ? 'border-color:var(--acc)' : ''}" data-on="${p.id}"><span>${p.prim} ${esc(surname(p.n))}</span><span class="dim">${ovrNow(p)}</span></button>`).join('') || '<span class="small muted">None left</span>'}</div></div><p class="small muted" style="margin:6px 0 0">The percentages are energy. Pick one to take off and one to bring on.</p>`)}</div>`; }
  return '';
}
function wireMatchPanel(){
  const L = LIVE; if (!L) return; const M = L.M, us = M.h === me() ? M.H : M.A;
  document.querySelectorAll('.seg[data-mk] button').forEach(b => b.addEventListener('click', () => { const k = b.parentElement.dataset.mk; us.t[k] = +b.dataset.v; if (!M.over) say(M, us, 'minor', `${esc(club(us.cid).name)} change their ${k === 'men' ? 'approach: ' + MENT[us.t.men].toLowerCase() : k === 'pass' ? 'passing: ' + PASS[us.t.pass].toLowerCase() : 'tackling: ' + TACK[us.t.tack].toLowerCase()}.`); viewMatch(); }));
  document.querySelectorAll('[data-mt2]').forEach(b => b.addEventListener('click', () => { us.t[b.dataset.mt2] = !us.t[b.dataset.mt2]; viewMatch(); }));
  document.querySelectorAll('[data-off]').forEach(b => b.addEventListener('click', () => { L.sel = { off: +b.dataset.off, on: L.sel && L.sel.on }; trySub(); }));
  document.querySelectorAll('[data-on]').forEach(b => b.addEventListener('click', () => { L.sel = { on: +b.dataset.on, off: L.sel && L.sel.off }; trySub(); }));
}
function trySub(){ const L = LIVE, M = L.M, us = M.h === me() ? M.H : M.A; if (L.sel && L.sel.off && L.sel.on){ const out = us.on.find(x => x.id === L.sel.off); if (!out || !substitute(M, us, out, false, L.sel.on)) toast('No more substitutions allowed.'); L.sel = null; } viewMatch(); }
function run(){
  clearTimeout(TIMER);
  const L = LIVE; if (!L || L.paused) return;
  const M = L.M, n0 = M.feed.length, g0 = M.H.goals + M.A.goals;
  const going = step(M); L.others.forEach(o => { if (!going || o.half < M.half || (o.half === M.half && o.min < M.min)) step(o); });
  if (!going){ L.others.forEach(o => playOut(o)); L.paused = true; viewMatch(); return; }
  if (M.ht){ M.ht = false; L.paused = true; L.atHT = true; L.others.forEach(o => { while (!o.over && o.half === 1) step(o); o.ht = false; }); viewMatch(); return; }
  if (M.feed.length !== n0 || M.min % 5 === 0 || MTAB !== 'overview' && MTAB !== 'tactics') viewMatch();
  else { const c = $('#clock'); if (c) c.textContent = label(M) + "'"; }
  TIMER = setTimeout(run, SPEEDS[SPEED][0] * (M.H.goals + M.A.goals > g0 ? 3 : 1));
}

/* =====================================================================================================================
   start
   ===================================================================================================================== */
(async () => {
  try { const r = (await window.__cm) || await fetch('cm.json', { cache: 'no-cache' }); if (r.ok) D = await r.json(); } catch (e) {}
  if (!D || !D.clubs || D.clubs.length < 4){ $('#app').innerHTML = `${header()}<div class="content"><section class="panel"><div class="pb"><h2>Coming soon</h2><p class="muted">The league is being put together. Come back tomorrow.</p></div></section></div>`; return; }
  for (const [k, n] of D.attrs || []) ATTR_NAME[k] = n;
  D.players.forEach(p => P.set(p.id, p)); D.clubs.forEach(c => C.set(c.id, c));
  const s = loadSave();
  if (s && s.v === 2 && C.has(s.club) && Object.keys(s.table).length === D.clubs.length && Object.keys(s.table).every(id => C.has(+id))){
    S = s;
    // players who have left the data since: out of every selection; new players: a contract
    for (const id in S.tac){ const t = S.tac[id]; t.xi = t.xi.map(x => x && P.has(x) ? x : null); t.bench = t.bench.filter(x => P.has(x)); }
    for (const p of D.players) if (!S.con[p.id]) S.con[p.id] = contractFor(p);
    longInjured();
  }
  view();
})();
</script>
