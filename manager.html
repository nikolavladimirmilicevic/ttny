<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<script>window.__cm = fetch('cm.json', { cache: 'no-cache' }).catch(() => null);   /* the league starts downloading first */</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manager · This Time Next Year</title>
<meta name="description" content="Take charge of a Premier League club: squad, tactics, training, the board, and every match told in words.">
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Manager: laid out the classic way (a bar down the left with the date and Continue Game, a title, tabs above and
   below the content, Back and Next) and dressed like the other two games: the night blue, the panels, Oswald and Rubik,
   and its own colour, the green of a fresh pitch. */
:root{
  --night:#0B1626; --panel:#13233A; --panel-2:#1A2E4A; --panel-3:#22395A; --line:#294060;
  --gold:#4FD18B; --gold-ink:#06210F; --text:#F3EFE6; --muted:#A3B1C4; --dim:#7488A3;
  --win:#5CC08A; --loss:#E57A62; --draw:#C9B458; --hot:#E57A62; --ok:#5CC08A; --warn:#F2B24A; --sky:#7FC8F8; --yel:#F2D33D;
  --display:'Oswald','Arial Narrow',Arial,sans-serif; --body:'Rubik','Segoe UI',Arial,sans-serif; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--night);color:var(--text)}
body{font:14px/1.45 var(--body);margin:0;min-height:100vh;background-attachment:fixed;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27130%27%20height%3D%27130%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27white%27%20stroke-opacity%3D%27.035%27%20stroke-width%3D%273%27%20stroke-linecap%3D%27round%27%3E%3Cpath%20d%3D%27M18%2022l14%2014M32%2022L18%2036%27%2F%3E%3Ccircle%20cx%3D%2795%27%20cy%3D%2798%27%20r%3D%279%27%2F%3E%3Cpath%20d%3D%27M40%2050q20%2018%2045%2034%27%20stroke-dasharray%3D%274%207%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E")}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.small{font-size:12px}.dim{color:var(--muted)}.yel{color:var(--gold)}.sky{color:var(--sky)}.r{text-align:right}.c{text-align:center}.num{font-variant-numeric:tabular-nums}
/* the strip the three games share */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;max-width:1180px;margin:0 auto}
.mark{display:flex;align-items:center;gap:8px;font:700 16px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}.mark .home{display:flex;align-items:center;gap:8px;color:var(--text);text-decoration:none}.mark img{height:28px;width:auto}.mark .mtxt>span{color:var(--gold)}
.mark .trk{display:inline-flex;align-items:center;gap:5px;margin-left:6px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);text-decoration:none;font:500 11px/1 var(--body);letter-spacing:.04em;text-transform:none}.mark .trk:hover{color:var(--text)}
.games{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}.games a{padding:5px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font:600 13px/1 var(--body);white-space:nowrap}.games a.on{background:var(--gold);color:var(--gold-ink)}.games a:not(.on):hover{color:var(--text)}
@media(max-width:440px){.mark .trk span{display:none}.mark .trk{padding:5px 6px;margin-left:2px}.mark .mtxt{display:none}.mark img{height:32px}.games a{padding:5px 10px;font-size:12px}}
@media(max-width:400px){.games a{padding:5px 7px;font-size:11.5px}.mark .trk{display:none}}
/* the frame */
.cm{display:grid;grid-template-columns:150px 1fr;gap:12px;max-width:1180px;margin:0 auto;padding:0 16px 30px}
.side{background:var(--panel);border-radius:14px;display:flex;flex-direction:column;align-items:stretch;padding:10px 8px;gap:4px;align-self:start;position:sticky;top:10px}
.date{background:var(--panel-2);border-radius:10px;text-align:center;padding:8px 4px;font:600 15px/1.25 var(--display);letter-spacing:.04em;text-transform:uppercase}
.date span{display:block}.date span:first-child{color:var(--gold)}.date span:last-child{color:var(--muted);font-size:12px}
.arrows{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.arrows button{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;color:var(--text);font-weight:700;padding:5px 0}
.arrows button:disabled{opacity:.35;cursor:default}
.sb{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;color:var(--muted);font-weight:500;padding:8px 10px;line-height:1.2}
.sb:hover{background:var(--panel-2);color:var(--text)}
.sb.go{background:var(--gold);color:var(--gold-ink);text-align:center;font:600 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;border-radius:10px;padding:12px 6px;margin:4px 0}
.sb.go:hover{filter:brightness(1.08)}
.sb.mgr,.sb.myclub{color:var(--text);font-weight:700}
.sb.on{background:var(--panel-3);color:var(--text);box-shadow:inset 3px 0 0 var(--gold)}
.sb .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--warn);color:#2A1700;font-size:11px;line-height:18px;text-align:center}
.main{display:flex;flex-direction:column;gap:8px;min-width:0}
/* the title */
.banner{position:relative;display:grid;grid-template-columns:30px 1fr auto;align-items:center;min-height:66px;border-radius:14px;overflow:hidden;
  background:linear-gradient(100deg,var(--k1,#1A2E4A) 0,color-mix(in srgb,var(--k1,#1A2E4A) 55%,var(--night)) 100%)}
.banner h1{margin:0;text-align:center;font:600 30px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em;color:var(--k2,var(--text));padding:10px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner .sub{display:block;font:500 13px/1.3 var(--body);text-transform:none;letter-spacing:0;opacity:.9;margin-top:2px}
.banner .act{margin:8px;align-self:start}
@media(max-width:600px){.banner{grid-template-columns:1fr}.banner>span:first-child{display:none}.banner h1{font-size:22px;white-space:normal}.banner .act{justify-self:center;margin:0 8px 10px}.banner .act:empty{display:none}}
/* tabs, dropdowns, buttons */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--panel);border-radius:999px;padding:4px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;min-width:90px;background:none;border:0;color:var(--muted);font-weight:600;padding:7px 12px;border-radius:999px;white-space:nowrap}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:var(--gold);color:var(--gold-ink)}
.tabs button:disabled{color:#4F6280;cursor:default}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dd{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;color:var(--text);font-weight:500;padding:6px 8px;min-width:120px}
.dd option{background:var(--panel)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;color:var(--text);font-weight:600;padding:7px 13px}
.btn:hover{border-color:var(--muted)}
.btn.y{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
input[type=text]{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:7px 10px}
.bn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bn button{background:var(--panel-2);border:0;border-radius:10px;color:var(--text);font:600 16px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:13px 0}
.bn button:hover:not(:disabled){background:var(--panel-3)}
.bn #next:not(:disabled){background:var(--gold);color:var(--gold-ink)}
.bn button:disabled{color:#4F6280;cursor:default}
/* the content */
.pane{background:var(--panel);border-radius:14px;padding:14px;min-height:240px;overflow:auto}
.ptitle{font:600 15px/1.2 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:2px 0 10px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px}
@media(max-width:700px){.cols2{grid-template-columns:1fr}}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 22px}
@media(max-width:700px){.cols3{grid-template-columns:1fr 1fr}}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:5px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
th[data-sort]{cursor:pointer}
td{padding:5px 7px;border-bottom:1px solid rgba(41,64,96,.6);white-space:nowrap}
td.r,th.r{text-align:right}td.c,th.c{text-align:center}
tr.click{cursor:pointer}tr.click:hover td{background:rgba(255,255,255,.035)}
tr.me td{background:rgba(79,209,139,.10)}
.tw{overflow-x:auto}
.cell{display:inline-block;min-width:24px;text-align:center}
.pill{display:inline-block;min-width:34px;padding:2px 6px;text-align:center;background:var(--panel-2);border-radius:6px;font-weight:700}
.form span{display:inline-block;width:17px;height:17px;line-height:17px;text-align:center;border-radius:4px;font-size:10px;font-weight:700;margin-right:2px;color:#0A1424}
.form .W{background:var(--win)}.form .D{background:var(--draw)}.form .L{background:var(--loss)}
/* the squad list, two columns */
.sq{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
@media(max-width:700px){.sq{grid-template-columns:1fr}}
.sqr{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;align-items:center;padding:4px 4px;border-bottom:1px solid rgba(41,64,96,.6);cursor:pointer;border-radius:6px}
.sqr:hover{background:rgba(255,255,255,.035)}
.sqr .nm{font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sqr .ps{color:var(--gold);font-weight:600;font-size:12px;white-space:nowrap;min-width:64px;text-align:right}
.box{width:26px;height:20px;border:1px dashed var(--line);background:none;border-radius:5px;color:var(--muted);font:700 10px/18px var(--body);text-align:center;padding:0}
.box.on{background:var(--gold);border:1px solid var(--gold);color:var(--gold-ink)}
.box.sub{background:var(--panel-3);border:1px solid var(--line);color:var(--text)}
.c-inj{color:var(--loss)!important}.c-sus{color:#F29BC4!important}.c-res{color:var(--sky)!important}.c-out{opacity:.55}
.tag{display:inline-block;padding:0 4px;border-radius:4px;font:700 10px/16px var(--body);margin-left:5px;background:var(--panel-3);color:var(--text);vertical-align:1px}
.tag.inj{background:var(--loss);color:#0A1424}.tag.sus{background:#E3483F;color:#fff}.tag.tir{background:#9DB0C9;color:#0A1424}
/* attributes */
.arow{display:flex;justify-content:space-between;gap:8px;padding:3px 2px;border-bottom:1px solid rgba(41,64,96,.5)}
.av{font-weight:700;min-width:24px;text-align:right}
.v9{color:#5CE39A}.v8{color:#A8E063}.v7{color:#F2D33D}.v6{color:var(--text)}.v5{color:#F2A65A}.v4{color:#E57A62}
.up{color:var(--win);font-size:10px}.dn{color:var(--loss);font-size:10px}
.born{color:var(--gold);font:600 16px/1.3 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0 0 12px}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px}
.strip div{background:var(--panel-2);border-radius:10px;text-align:center;padding:6px 0;color:var(--muted);font-size:12px}
.strip div b{display:block;color:var(--text);font:600 18px/1.2 var(--display)}
/* the pitch */
.tac{display:grid;grid-template-columns:minmax(250px,1fr) minmax(260px,1.1fr);gap:14px;align-items:start}
@media(max-width:760px){.tac{grid-template-columns:1fr}.tac>div:last-child{order:-1}}
.pitch{position:relative;aspect-ratio:68/88;max-width:420px;width:100%;margin:0 auto;border-radius:12px;border:2px solid var(--chalk,rgba(243,239,230,.28));background:repeating-linear-gradient(180deg,#103828 0 10%,#13422F 10% 20%);overflow:hidden}
.pitch::before{content:'';position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(243,239,230,.28)}
.pitch::after{content:'';position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid rgba(243,239,230,.28);border-radius:50%}
.pitch .bx{position:absolute;left:24%;right:24%;bottom:0;height:15%;border:2px solid rgba(243,239,230,.28);border-bottom:0}
.pitch .bx.t{top:0;bottom:auto;border-bottom:2px solid rgba(243,239,230,.28);border-top:0}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0;z-index:2;width:84px}
.slot .dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--body);background:var(--k1,#ddd);color:var(--k2,#111);border:2px solid rgba(255,255,255,.75);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.slot .nm{font-size:11px;text-shadow:0 1px 2px #000;white-space:nowrap;max-width:84px;overflow:hidden;text-overflow:ellipsis}
.slot.ok .dot{border-color:var(--warn)}.slot.bad .dot{border-color:var(--loss)}.slot.pick .dot{outline:3px solid var(--gold)}
.slot.empty .dot{background:rgba(0,0,0,.35);color:#fff;border-style:dashed}
.pl{display:grid;grid-template-columns:24px 1fr auto auto;gap:8px;align-items:center;padding:4px 6px;border-bottom:1px solid rgba(41,64,96,.5);cursor:pointer;border-radius:6px}
.pl:hover{background:rgba(255,255,255,.035)}
.pl.subs{color:var(--muted)}
.pl.pick{background:rgba(79,209,139,.14)}
.pl .no{color:var(--muted);font-weight:700;text-align:right}
.instr{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;align-items:center}
@media(max-width:520px){.instr{grid-template-columns:1fr 1fr}}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:var(--panel-2);border:0;padding:5px 10px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--gold);color:var(--gold-ink);font-weight:600}
.tog{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:12px;color:var(--muted)}
.tog.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:600}
/* news */
.nl{max-height:220px;overflow-y:auto;border-radius:10px;background:var(--panel-2)}
.nl div{display:grid;grid-template-columns:96px 40px 1fr;gap:8px;padding:6px 10px;cursor:pointer;border-bottom:1px solid rgba(41,64,96,.7)}
.nl div span{color:var(--muted);font-size:12px}
.nl div:hover{background:rgba(255,255,255,.04)}
.nl div.on{background:var(--panel-3);box-shadow:inset 3px 0 0 var(--gold)}
.nl div.new b::before{content:'● ';color:var(--warn)}
.nmsg h2{margin:16px 0 8px;font:600 20px/1.2 var(--display);text-transform:uppercase;letter-spacing:.02em}
.nmsg p{font-size:15px;line-height:1.55;margin:0 0 10px}
/* the match */
.mteams{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mteams .t{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font:600 22px/1.1 var(--display);text-transform:uppercase;border-radius:14px}
.mteams .t b{font:700 34px/1 var(--display);background:rgba(0,0,0,.2);padding:2px 10px;border-radius:8px}
@media(max-width:600px){.mteams .t{font-size:15px;padding:8px 10px}.mteams .t b{font-size:24px}}
.msc{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;font-size:13px;min-height:20px}
.msc .h{text-align:right}.msc .mid{color:var(--gold);font:600 13px/1.4 var(--display);letter-spacing:.06em;text-transform:uppercase}
.big{margin:12px auto;max-width:680px;min-height:90px;display:grid;place-items:center;text-align:center;padding:16px 18px;background:var(--night);border:1px solid var(--line);border-radius:14px;font:500 19px/1.4 var(--body)}
.big.goal{background:linear-gradient(180deg,rgba(79,209,139,.28),var(--night));font-weight:700;font-size:22px;border-color:var(--gold)}
.big.them{background:linear-gradient(180deg,rgba(229,122,98,.28),var(--night));border-color:var(--loss)}
.big.yel{color:var(--yel)}
@media(max-width:600px){.big{font-size:16px;min-height:76px}}
.l5{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;max-width:560px;margin:6px auto;font-size:12px;color:var(--muted)}
.l5 .bar{display:flex;height:16px;border-radius:8px;overflow:hidden}
.l5 .bar i{display:grid;place-items:center;font-style:normal;font-size:10.5px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.minfo{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;color:var(--muted);font-size:12px;margin-top:8px}
.feed{max-height:320px;overflow-y:auto}
.feed p{margin:0;padding:4px 6px;border-bottom:1px solid rgba(41,64,96,.5);font-size:13px}
.feed p .m{display:inline-block;width:42px;color:var(--dim)}
.feed p.goal{color:var(--gold);font-weight:700}.feed p.goal.them{color:var(--loss)}.feed p.yel{color:var(--yel)}.feed p.red{color:#FF8A7A;font-weight:700}.feed p.minor{color:var(--muted)}
.sbar{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.sbar .l{grid-column:1/-1;text-align:center;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:-4px}
.sbar .b{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--panel-3)}
.zones{display:grid;grid-template-columns:repeat(3,1fr);border-radius:12px;overflow:hidden;background:#103828}
.zones div{padding:16px 4px;text-align:center;font:700 24px/1 var(--display);border-right:1px solid rgba(243,239,230,.2)}
.zones div:last-child{border:0}
.zones small{display:block;font:500 10.5px/1.4 var(--body);color:#cfe;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.inc{display:grid;grid-template-columns:1fr 46px 1fr;gap:4px 8px;font-size:13px}
.inc .h{text-align:right}.inc .m{text-align:center;color:var(--dim)}
.mclock{background:var(--panel-2);border-radius:10px;text-align:center;color:var(--gold);font:700 30px/1 var(--display);padding:10px 2px}
/* odds and ends */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#060D18;border:1px solid var(--line);border-radius:10px;padding:10px 14px;z-index:90;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:90vw}
.clubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.clubs button{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px;text-align:left}
.clubs button:hover{border-color:var(--gold)}
.clubs .sw{width:32px;height:32px;flex:none;display:grid;place-items:center;background:var(--k1);border-radius:8px}
.clubs .sw img{width:26px;height:26px;object-fit:contain}
.clubs b{display:block}.clubs small{color:var(--muted)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:640px;margin:10px auto}
.menu button{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;font:600 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:15px 8px}
.menu button:first-child{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.menu button:hover:not(:disabled){border-color:var(--gold)}
.menu button:disabled{color:#4F6280;cursor:default}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.meter{height:12px;border-radius:6px;background:var(--panel-3);overflow:hidden}.meter i{display:block;height:100%}
.empty{padding:20px;text-align:center;color:var(--muted)}
.loading{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:760px){
  .cm{grid-template-columns:1fr;padding:0 10px 24px}
  .side{position:static;flex-direction:row;flex-wrap:wrap;padding:6px;gap:4px}
  .date{flex:0 0 auto;display:flex;gap:6px;padding:6px 10px;align-items:center}

/* =====================================================================================================================

/* =====================================================================================================================
   after a match: the table, condition, goals, cards and bans, injuries, morale, the gate money

function apply(M, kind){

  if (kind === 'league') for (const [s, gf, ga] of [[H, hg, ag], [Aw, ag, hg]]){ const t = S.table[s.cid]; t.p++; t.gf += gf; t.ga += ga; const r = gf > ga ? 'W' : gf === ga ? 'D' : 'L'; t[r === 'W' ? 'w' : r === 'D' ? 'd' : 'l']++; t.form = [...t.form, r].slice(-5); }

    // a banned player sits this one out, and it counts toward his ban
    for (const p of squadOf(s.cid)){ const q = ps(p.id); if (q.sus > 0) q.sus--; }
    const played = new Set([...s.on.map(x => x.id), ...s.subbed.flatMap(x => [x[0], x[1]])]);
    for (const x of s.on){ const q = ps(x.id); q.cond = clamp(q.cond - (100 - x.e) * .55, 30, 100); }
    for (const [o] of s.subbed){ const q = ps(o); q.cond = clamp(q.cond - 22, 30, 100); }
    for (const id of played){ const q = ps(id), ev = s.ev[id] || {}; q.apps++; if (s.subbed.some(x => x[1] === id)) q.sub++; q.g += ev.g || 0; q.a += ev.a || 0; if (s.rate[id]) q.rt.push(s.rate[id]); if (M.mom === id) q.mom++; q.light = 0;
      if (ev.rc) q.sus = Math.max(q.sus, ev.straight ? 3 : 1);
      else if (ev.yc){ const before = q.yc; q.yc += ev.yc; if (before < 5 && q.yc >= 5) q.sus = Math.max(q.sus, 1); else if (before < 10 && q.yc >= 10) q.sus = Math.max(q.sus, 2); } }
    for (const j of s.inj) ps(j.id).injD = Math.max(ps(j.id).injD, j.d);

    for (const p of squadOf(s.cid)){ const q = ps(p.id); q.mor = clamp(q.mor + (played.has(p.id) ? (won > 0 ? 6 : won === 0 ? 0 : -6) : (won > 0 ? 1 : -1) - (q.apps < S.round / 4 ? 1 : 0)), 15, 100); }
  }

  if (M.h === me() || M.a === me()){
    const home = M.h === me(), c = club(me()), fill = clamp(.82 + (S.conf - 50) / 400 + Math.random() * .08, .6, 1), price = 38 + (c.q - 70) * 2.2;
    const gate = home ? Math.round((c.cap || 30000) * fill * price) : 0, tv = 1.9e6 + (kind === 'cup' ? .5e6 : 0);
    S.fin.gate += gate; S.fin.tv += tv; S.fin.bal += gate + tv;
    M.att = Math.round((club(M.h).cap || 30000) * (home ? fill : clamp(fill, .75, 1)));
  }
}

/* =====================================================================================================================

function events(){

    if (q.injD){ q.injD = Math.max(0, q.injD - n); if (!q.injD){ q.light = 1; if (p.club === me()) news('injury', `${p.n} is fit again`, `${esc(p.n)} has recovered and is back in training. He may not be at his sharpest for his first game back.`); } }

function trainWeek(wk){

    const grow = age <= 19 ? .32 : age <= 21 ? .22 : age <= 24 ? .1 : age <= 27 ? .03 : age <= 29 ? 0 : age <= 31 ? -.06 : -.14;

function playerFlags(p){

const avgRt = q => q.rt.length ? (q.rt.reduce((a, b) => a + b, 0) / q.rt.length).toFixed(2) : '-';
const morWord = m => m >= 85 ? 'Superb' : m >= 70 ? 'Very Good' : m >= 55 ? 'Good' : m >= 40 ? 'Okay' : m >= 25 ? 'Poor' : 'Very Poor';
function clubSquad(cid, o){

  const L = squadOf(cid).filter(fl).sort((a, b) => { const f = keyf[SORT.k] || keyf.pos, x = f(a), y = f(b); return (x > y ? 1 : x < y ? -1 : 0) * SORT.d; });

function nextFree(){ const t = S.tac[me()], i = t.xi.indexOf(null); if (i >= 0) return FORMS[t.form][i][0]; return t.bench.length < 7 ? 'S' + (t.bench.length + 1) : null; }
function toggleSel(id){
  const t = S.tac[me()];
  if (t.xi.includes(id)){ t.xi[t.xi.indexOf(id)] = null; save(); return; }
  if (t.bench.includes(id)){ t.bench = t.bench.filter(x => x !== id); save(); return; }
  if (!avail(id)){ toast('He is not available.'); return; }
  const i = t.xi.indexOf(null); if (i >= 0) t.xi[i] = id; else if (t.bench.length < 7) t.bench.push(id); else toast('Your side and substitutes are full.');

function wirePlayers(list){ document.querySelectorAll('[data-pl]').forEach(r => r.addEventListener('click', e => { if (e.target.closest('[data-sel],[data-bench]')) return; go({ s: 'player', id: +r.dataset.pl, list }); })); }
function nextFixture(cid){
  const L = [];
  for (let i = S.round; i < S.rounds.length; i++){ const m = S.rounds[i].m.find(x => x.h === cid || x.a === cid); if (m){ L.push({ date: S.rounds[i].date, comp: 'League', m }); break; } }
  if (S.cup.stage < 5 && S.cup.alive.includes(cid)) L.push({ date: S.cupDates[S.cup.stage], comp: 'Cup · ' + CUP_NAMES[S.cup.stage], m: null });
  return L.sort((a, b) => a.date < b.date ? -1 : 1)[0];
}

}

    `<div class="banner"><span></span><h1>Next Match<span class="sub">${L.cup ? 'Cup · ' + esc(L.cup) : esc(D.league)}</span></h1><span></span></div>
    <div class="mteams"><div class="t" style="background:${kh};color:${kh2}"><span>${esc(club(M.h).name)}</span></div><div class="t" style="background:${ka};color:${ka2}"><span>${esc(club(M.a).name)}</span></div></div>
    <section class="pane"><dl class="kv"><dt>Date</dt><dd>${fmtDate(S.date, true)}</dd><dt>Venue</dt><dd>${esc(club(M.h).venue || '')}</dd><dt>Referee</dt><dd>${esc(M.ref.n)}: ${strict}</dd><dt>Weather</dt><dd>${esc(M.weather)}, ${M.temp}°C${wxNote}</dd><dt>Opponents</dt><dd>${esc(club(opp).name)}${S.round ? ', ' + ordinal(st.findIndex(r => r.id === opp) + 1) : ''}, ${esc(M.h === me() ? M.A.t.form : M.H.t.form)}</dd></dl>
      <div class="cols2" style="margin-top:10px"><div><div class="ptitle">${esc(club(M.h).name)}</div>${line(M.H)}</div><div><div class="ptitle">${esc(club(M.a).name)}</div>${line(M.A)}</div></div></section>
    <div class="bn"><button id="totac2">Back</button><button id="tomatch2">Next</button></div>`);
  const goMatch = () => { L.pre = false; viewMatch(); }, toTac = () => { LIVE = null; go({ s: 'club', cid: me(), tab: 'tactics' }); toast('Press Continue Game when you are ready for the match.'); };
  $('#tomatch').addEventListener('click', goMatch); $('#tomatch2').addEventListener('click', goMatch);
  $('#totac').addEventListener('click', toTac); $('#totac2').addEventListener('click', toTac);
}
function viewMatch(){
  const L = LIVE, M = L.M, [kh, kh2] = kitOf(M.h), [ka, ka2] = kitOf(M.a);
  if (L.pre){ viewPre(); return; }
  const clock = M.over ? 'FT' : !L.started ? '0' : L.atHT ? 'HT' : label(M);
  const last = M.feed[M.feed.length - 1] || { t: 'The teams are out.', c: '' };
  const scorers = side => M.hs.filter(g => g.side === side).map(g => `${esc(surname(P.get(g.id).n))} ${g.l}`).join(', ');
  const pct = (from) => { const Z = M.zones.filter(([m, h]) => (h - 1) * 100 + m > from); const hp = Z.length ? Z.filter(z => z[2] === 2).length + Z.filter(z => z[2] === 1).length / 2 : 0; return Z.length ? Math.round(100 * hp / Z.length) : 50; };
  const cur = (M.half - 1) * 100 + M.min, p5 = pct(cur - 5);
  const bigCls = last.c === 'goal' ? (last.side === 'them' ? 'goal them' : 'goal') : last.c === 'yel' ? 'yel' : last.c === 'red' ? '' : last.c === 'minor' || !last.c ? 'calm' : 'calm';
  const half = M.over ? 'Full Time' : !L.started ? 'Kick Off' : L.atHT ? 'Half Time' : M.half === 1 ? 'First Half' : 'Second Half';
  const us = M.h === me() ? M.H : M.A;
  const tabs = [['overview', 'Match Overview'], ['stats', 'Match Stats'], ['zones', 'Action Zones'], ['report', 'Match Report']];
  const tabs2 = [['ratings', 'Player Ratings'], ['scores', 'Latest Scores'], ['table', 'Live Table'], ['tactics', `${esc(club(me()).name)} Tactics`]];
  let panelBody = '';
  if (MTAB === 'overview') panelBody = `<div class="msc"><div class="h">${scorers('h')}</div><div class="mid">${half}</div><div>${scorers('a')}</div></div>
    <div class="big ${bigCls}" id="now">${last.m ? `${last.m}' &nbsp;` : ''}${last.t}</div>
    <div class="l5"><span>Last 5 Mins</span><span class="bar"><i style="width:${p5}%;background:${kh};color:${kh2};text-shadow:none">${p5}%</i><i style="width:${100 - p5}%;background:${ka === kh ? '#888' : ka};color:${ka === kh ? '#fff' : ka2};text-shadow:none">${100 - p5}%</i></span></div>
    <div class="minfo"><span>Referee - ${esc(M.ref.n)}</span><span>Attendance - ${(M.att || 0).toLocaleString('en-GB')}</span><span>Weather - ${esc(M.weather)}, ${M.temp}°C</span></div>`;
  else panelBody = mPanel();
  const side = `<div class="mclock">${clock}</div>${M.over ? `<button class="sb go" id="done">Continue Game</button>` : L.started && !L.paused ? '<button class="sb go" id="pause">Pause</button>' : `<button class="sb go" id="play">${!L.started ? 'Kick Off' : L.atHT ? 'Second Half' : 'Resume Match'}</button>`}
    ${M.over ? '' : '<button class="sb" id="skip">To Full Time</button>'}<button class="sb" data-mt="tactics">${esc(club(me()).name)} Tactics</button>
    <div class="date" style="margin-top:6px"><span class="small">Commentary Speed</span></div>${SPEEDS.map(([, n], i) => `<button class="sb ${SPEED === i ? 'on' : ''}" data-spd="${i}" style="padding:5px 3px;font-size:11.5px">${n}</button>`).join('')}`;
  mframe(side, `<div class="mteams"><div class="t" style="background:${kh};color:${kh2}"><span>${esc(club(M.h).name)}</span><b>${M.H.goals}</b></div><div class="t" style="background:${ka};color:${ka2}"><span>${esc(club(M.a).name)}</span><b>${M.A.goals}</b></div></div>
    ${M.pens ? `<p class="c yel" style="margin:2px 0"><b>Penalties: ${M.pens[0]}-${M.pens[1]}</b></p>` : ''}
    <nav class="tabs">${tabs.map(([k, n]) => `<button data-mt="${k}" class="${MTAB === k ? 'on' : ''}">${n}</button>`).join('')}</nav>
    <section class="pane" id="mpanel">${panelBody}</section>
    <nav class="tabs">${tabs2.map(([k, n]) => `<button data-mt="${k}" class="${MTAB === k ? 'on' : ''}">${n}</button>`).join('')}</nav>`);
  const on = (id, f) => { const el = $('#' + id); if (el) el.addEventListener('click', f); };
  on('play', () => { L.started = true; L.paused = false; L.atHT = false; run(); });
  on('pause', () => { L.paused = true; clearTimeout(TIMER); viewMatch(); });
  on('skip', () => { clearTimeout(TIMER); L.started = true; L.paused = true; L.atHT = false; while (step(M)) L.others.forEach(o => step(o)); L.others.forEach(o => playOut(o)); viewMatch(); });
  on('done', () => { LIVE = null; if (L.cup) finishCup(M, L.others); else finishLeague(M, L.others); passDays(1); save(); HIST.push(V); V = { s: 'news', i: 0 }; view(); scrollTo(0, 0); });
  document.querySelectorAll('[data-spd]').forEach(b => b.addEventListener('click', () => { SPEED = +b.dataset.spd; OPT.spd = SPEED; saveOpt(); viewMatch(); }));
  document.querySelectorAll('[data-mt]').forEach(b => b.addEventListener('click', () => { MTAB = b.dataset.mt; viewMatch(); }));
  wireMatchPanel();
}
function mPanel(){
  const L = LIVE, M = L.M, us = M.h === me() ? M.H : M.A;
  const pct = Math.round(100 * M.H.poss / Math.max(1, M.H.poss + M.A.poss));
  if (MTAB === 'report') return `<div class="cols2"><div><div class="ptitle">Incidents</div><div class="inc">${M.inc.map(x => `<div class="h">${x.side === 'h' ? icon(x.k) + esc(x.t) : ''}</div><div class="m">${x.l}'</div><div>${x.side === 'a' ? icon(x.k) + esc(x.t) : ''}</div>`).join('') || '<div></div><div class="m">-</div><div></div>'}</div></div><div><div class="ptitle">Commentary</div><div class="feed">${M.feed.slice().reverse().map(f => `<p class="${f.c} ${f.side === 'them' ? 'them' : ''}"><span class="m">${f.m ? f.m + "'" : ''}</span>${f.t}</p>`).join('')}</div></div></div>`;
  if (MTAB === 'stats') return statBars({ poss: [pct, 100 - pct], pas: [Math.round(100 * M.H.pc / Math.max(1, M.H.pa)), Math.round(100 * M.A.pc / Math.max(1, M.A.pa))], sh: [M.H.sh, M.A.sh], sot: [M.H.sot, M.A.sot], cor: [M.H.corners, M.A.corners], fou: [M.H.fouls, M.A.fouls], off: [M.H.off, M.A.off], yc: [M.H.yc, M.A.yc], rc: [M.H.rc, M.A.rc] }, M.h, M.a);
  if (MTAB === 'ratings'){ const col = s => { const ids = [...s.on.map(x => x.id), ...s.subbed.map(x => x[0])].filter((id, i, a) => a.indexOf(id) === i); return ids.map(id => { const v = M.over ? s.rate[id] : clamp(6.3 + (s.rate[id] || 0), 1, 10), x = s.on.find(y => y.id === id); return `<div class="arow"><span>${esc(cmName(P.get(id).n))} <span class="small yel">${x ? x.pos : 'off'}</span>${id === M.mom ? ' ★' : ''}</span><span class="av">${M.over ? v.toFixed(1) : Math.round(v)}</span></div>`; }).join(''); };
    return `<div class="cols2"><div><div class="ptitle">${esc(club(M.h).name)}</div>${col(M.H)}</div><div><div class="ptitle">${esc(club(M.a).name)}</div>${col(M.A)}</div></div>`; }
  if (MTAB === 'zones'){ const cur = (M.half - 1) * 100 + M.min, z = from => { const L2 = M.zones.filter(([m, h]) => (h - 1) * 100 + m > from); const c = [0, 0, 0]; L2.forEach(([, , k]) => c[k]++); const t = Math.max(1, L2.length); return c.map(v => Math.round(100 * v / t)); };
    const show = (t, v) => `<div class="ptitle">${t}</div><div class="zones"><div>${v[0]}%<small>${esc(club(M.h).name)} half</small></div><div>${v[1]}%<small>Midfield</small></div><div>${v[2]}%<small>${esc(club(M.a).name)} half</small></div></div>`;
    return `${show('Last 5 Minutes', z(cur - 5))}${show('Whole Match', z(-1))}<p class="c" style="margin-top:8px"><b>Possession:</b> ${esc(club(M.h).name)} ${pct}%, ${esc(club(M.a).name)} ${100 - pct}%</p>`; }
  if (MTAB === 'table'){ if (L.cup) return '<p class="empty">A cup match: no table today.</p>';
    const tab = JSON.parse(JSON.stringify(S.table)); for (const m of [M, ...L.others]){ if (!m.min && !m.over) continue; for (const [s, gf, ga] of [[m.H, m.H.goals, m.A.goals], [m.A, m.A.goals, m.H.goals]]){ const t = tab[s.cid]; t.p++; t.gf += gf; t.ga += ga; if (gf > ga) t.w++; else if (gf === ga) t.d++; else t.l++; } }
    const st = Object.entries(tab).map(([id, t]) => ({ id: +id, ...t, gd: t.gf - t.ga, pts: t.w * 3 + t.d })).sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
    return `<table><thead><tr><th></th><th>Club</th><th class="c">Pld</th><th class="c">GD</th><th class="c">Pts</th></tr></thead><tbody>${st.map((r, i) => `<tr class="${r.id === me() ? 'me' : ''}"><td>${i + 1}</td><td><b>${esc(club(r.id).name)}</b></td><td class="c">${r.p}</td><td class="c">${r.gd > 0 ? '+' : ''}${r.gd}</td><td class="c yel"><b>${r.pts}</b></td></tr>`).join('')}</tbody></table>`; }
  if (MTAB === 'scores') return L.others.length ? `<table><tbody>${L.others.map(o => `<tr><td class="r" style="width:40%"><b>${esc(club(o.h).name)}</b></td><td class="c"><span class="pill">${o.H.goals} - ${o.A.goals}</span>${o.pens ? ` <span class="small dim">(${o.pens[0]}-${o.pens[1]} p)</span>` : ''}</td><td style="width:40%"><b>${esc(club(o.a).name)}</b></td><td class="small yel">${o.over ? 'FT' : o.min ? label(o) + "'" : ''}</td></tr>`).join('')}</tbody></table>` : '<p class="empty">No other matches today.</p>';
  if (MTAB === 'tactics'){ const t = us.t, seg = (key, Lb) => `<span class="seg" data-mk="${key}">${Lb.map((n, i) => `<button data-v="${i}" class="${t[key] === i ? 'on' : ''}">${n}</button>`).join('')}</span>`, tog = (k, n) => `<button class="tog ${t[k] ? 'on' : ''}" data-mt2="${k}">${t[k] ? '✓' : '·'} ${n}</button>`;
    return `<div class="cols2"><div><div class="ptitle">Team Instructions</div><div class="instr"><span class="yel"><b>Mentality</b></span>${seg('men', MENT)}<span class="yel"><b>Passing</b></span>${seg('pass', PASS)}<span class="yel"><b>Tackling</b></span>${seg('tack', TACK)}<span class="yel"><b>Tactics</b></span><span class="tools">${tog('press', 'Pressing')}${tog('offside', 'Offside Trap')}${tog('counter', 'Counter')}${tog('mbb', 'Men Behind Ball')}</span></div></div>
      <div><div class="ptitle">Substitutions ${us.subs}/5</div>${M.over ? '<p class="dim">The match is over.</p>' : `<div class="cols2"><div><div class="small yel">On the pitch</div>${us.on.map(x => `<div class="pl ${L.sel && L.sel.off === x.id ? 'pick' : ''}" data-off="${x.id}"><span class="yel small">${x.pos}</span><b>${esc(surname(x.p.n))}</b><span></span><span class="small dim">${Math.round(x.e)}%</span></div>`).join('')}</div><div><div class="small yel">Substitutes</div>${us.bench.map(id => P.get(id)).filter(Boolean).map(p => `<div class="pl ${L.sel && L.sel.on === p.id ? 'pick' : ''}" data-on="${p.id}"><span class="yel small">${p.prim}</span><b>${esc(surname(p.n))}</b><span></span><span class="small ${vcls(ovrNow(p))}">${ovrNow(p)}</span></div>`).join('') || '<p class="dim small">None left</p>'}</div></div><p class="small dim">The percentages are energy. Pick one to take off and one to bring on.</p>`}</div></div>`; }
  return '';
}
function wireMatchPanel(){
  const L = LIVE; if (!L) return; const M = L.M, us = M.h === me() ? M.H : M.A;
  document.querySelectorAll('.seg[data-mk] button').forEach(b => b.addEventListener('click', () => { const k = b.parentElement.dataset.mk; us.t[k] = +b.dataset.v; if (!M.over) say(M, us, 'minor', `${esc(club(us.cid).name)} change their ${k === 'men' ? 'approach: ' + MENT[us.t.men].toLowerCase() : k === 'pass' ? 'passing: ' + PASS[us.t.pass].toLowerCase() : 'tackling: ' + TACK[us.t.tack].toLowerCase()}.`); viewMatch(); }));
  document.querySelectorAll('[data-mt2]').forEach(b => b.addEventListener('click', () => { us.t[b.dataset.mt2] = !us.t[b.dataset.mt2]; viewMatch(); }));
  document.querySelectorAll('[data-off]').forEach(b => b.addEventListener('click', () => { L.sel = { off: +b.dataset.off, on: L.sel && L.sel.on }; trySub(); }));
  document.querySelectorAll('[data-on]').forEach(b => b.addEventListener('click', () => { L.sel = { on: +b.dataset.on, off: L.sel && L.sel.off }; trySub(); }));
}
function trySub(){ const L = LIVE, M = L.M, us = M.h === me() ? M.H : M.A; if (L.sel && L.sel.off && L.sel.on){ const out = us.on.find(x => x.id === L.sel.off); if (!out || !substitute(M, us, out, false, L.sel.on)) toast('No more substitutions allowed.'); L.sel = null; } viewMatch(); }
function run(){
  clearTimeout(TIMER);
  const L = LIVE; if (!L || L.paused) return;
  const M = L.M, n0 = M.feed.length, g0 = M.H.goals + M.A.goals;
  const going = step(M); L.others.forEach(o => { if (!going || o.half < M.half || (o.half === M.half && o.min < M.min)) step(o); });
  if (!going){ L.others.forEach(o => playOut(o)); L.paused = true; viewMatch(); return; }
  if (M.ht){ M.ht = false; L.paused = true; L.atHT = true; L.others.forEach(o => { while (!o.over && o.half === 1) step(o); o.ht = false; }); viewMatch(); return; }
  if (M.feed.length !== n0 || M.min % 5 === 0 || (MTAB !== 'overview' && MTAB !== 'tactics')) viewMatch();
  else { const c = document.querySelector('.mclock'); if (c) c.textContent = label(M); }
  TIMER = setTimeout(run, SPEEDS[SPEED][0] * (M.H.goals + M.A.goals > g0 ? 3 : 1));
}

/* =====================================================================================================================
   start
   ===================================================================================================================== */
(async () => {
  try { const r = (await window.__cm) || await fetch('cm.json', { cache: 'no-cache' }); if (r.ok) D = await r.json(); } catch (e) {}
  if (!D || !D.clubs || D.clubs.length < 4){ $('#app').innerHTML = `${header()}<p class="loading">The league is being put together. Come back tomorrow.</p>`; return; }
  for (const [k, n] of D.attrs || []) ATTR_NAME[k] = n;
  D.players.forEach(p => P.set(p.id, p)); D.clubs.forEach(c => C.set(c.id, c));
  const s = loadSave();
  if (s && s.v === 2 && C.has(s.club) && Object.keys(s.table).length === D.clubs.length && Object.keys(s.table).every(id => C.has(+id))){
    S = s;
    // players who have left the data since: out of every selection; new players: a contract
    for (const id in S.tac){ const t = S.tac[id]; t.xi = t.xi.map(x => x && P.has(x) ? x : null); t.bench = t.bench.filter(x => P.has(x)); }
    for (const p of D.players) if (!S.con[p.id]) S.con[p.id] = contractFor(p);
    longInjured();
  }
  view();
})();
</script>
