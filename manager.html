/* ---- part 2b: the Nations League from 2028/29 (three leagues of 18), World Cup qualifying on every continent, the

/* the Nations League 2028/29: three leagues of eighteen, three groups of six in each, drawn from pots of six (two teams

/* holiday, as in CM 01/02: the calendar runs on, every game played without you; the side as you left it or picked by
   your assistant (his Judging Ability: a poor one now and then leaves out a better player); optionally he buys from
   your short list */
function goHoliday(until, pick, buy){
  if (S.done){ toast('The season is over.'); return; }
  S.hol = { until, pick, buy }; const from = S.date, n0 = S.news.length; let steps = 0;
  while (S.hol && !S.done && S.date < until && steps++ < 600){ if (!autoStep()) break; }
  const games = S.results.filter(r => r.date > from).length;
  S.hol = null; news('board', 'Back from holiday', `You are back after ${daysBetween(from, S.date)} days. ${games} league round${games === 1 ? '' : 's'} were played while you were away; the news is waiting for you.`);
  save(); V = { s: 'news' }; view();
}
function autoStep(){
  const ev = events()[0]; if (!ev){ endSeason(); return false; }
  if (ev.date > S.date){ passDays(daysBetween(S.date, nextStop(ev.date))); monthly(); holidayBuy(); return true; }
  if (ev.k === 'nt'){ finishNT(null, ev.f); return true; }
  if (ev.k === 'euq'){ finishEUQ(null); return true; }
  if (ev.k === 'fr'){ finishFr(null, ev.f); passDays(1); return true; }
  const t = S.tac[me()];
  if (S.hol.pick === 'ass'){ const a = (S.staff || []).find(x => x.role === 'ass'), ju = a ? a.ju : 8;
    Object.assign(t, bestXI(me(), t.form, true, judge())); }
  readyTactic(me()); if (t.xi.some(x => !x)) Object.assign(t, bestXI(me(), t.form, true));
  if (ev.k === 'shield'){ finishShield(null); return true; }
  if (ev.k === 'eu'){ finishEU(ev.c, null); return true; }
  if (ev.k === 'usc'){ finishUSC(null); return true; }
  if (ev.k === 'fic'){ finishFIC(null); return true; }
  if (ev.k === 'cwc'){ finishCWC(null); return true; }
  if (ev.k === 'lc'){ S.lc.cur = lcDraw(); finishLC(null); return true; }
  if (ev.k === 'cup'){ const { ties, bye } = cupDraw(); S.cup.cur = { ties, bye, stage: S.cup.stage }; finishCup(null); passDays(1); return true; }
  finishLeague(null); passDays(1); return true;
}
function holidayBuy(){
  if (!S.hol || !S.hol.buy || !windowOpen()) return;
  for (const x of (S.short || []).slice()){ const p = P.get(x.id); if (!p || p.club === me()) continue;
    const ask = askingPrice(p); if (ask > S.fin.budget || squadOf(p.club).length <= 18) continue;
    const step = club(p.club).q - club(me()).q; if (step > 5 && rng(`w-${p.id}-${S.season}`)() < .7) continue;
    S.con[p.id] = { y: S.season + 4, w: wageDemand(p) }; moveP(p, me(), ask); S.short = S.short.filter(y => y.id !== p.id);
    news('club', `${p.n} signs`, `While you were away your assistant signed <b>${esc(p.n)}</b> from your short list for ${cash(ask)}.`); }
}

// the first team and the reserves: the 25 best senior players and whoever is picked; the rest are reserves

const inRes = p => { const pr = (S.promo || {})[p.id]; return pr === 0 || (pr !== 1 && !!(p.ac || p.yth) && p.age < 22); };

  for (const p of L){ if (pr[p.id] === 1) keep.add(p.id); else if (pr[p.id] === 0) keep.delete(p.id); }   // the manager's own moves, whatever the squad

  const on = (sel, f) => document.querySelectorAll(sel).forEach(el => el.addEventListener('click', () => { f(el); save(); view(); }));
  S.bids = S.bids || [];
  const cur = () => S.bids.slice().reverse().find(x => x.id === p.id && x.st !== 'off');
  on('[data-bid]', el => { const ao = +(($('#bao') || {}).value || 0), so = +(($('#bso') || {}).value || 0); S.bids.push({ id: p.id, fee: +el.dataset.bid, d: S.date, st: 'wait', ...(ao ? { ao } : {}), ...(so ? { so } : {}) }); toast(`Bid sent to ${club(p.club).name}.`); });
  on('#bidoff', () => { const b = cur(); if (b) b.st = 'off'; });
  on('#faoffer', () => { S.bids.push({ id: p.id, fee: 0, d: S.date, st: 'yes', w: faWage(p), fa: 1 }); });
  on('#bidask', () => { const b = cur(); if (b){ b.fee = b.ask; b.st = 'yes'; b.w = wageDemand(p); } });
  on('[data-sign]', el => { const b = cur(); if (!b) return; const y = +el.dataset.sign;
    // a player at a much bigger club may not want to come
    if (b.fa){ const up = ovrNow(p) - club(me()).q;   // a free agent much better than your side would rather wait for a bigger club
      if (up > 5 && rng(`fa-${p.id}-${me()}`)() < Math.min(.85, .25 + up * .08)){ b.st = 'off'; news('club', `${p.n} turns you down`, `<b>${esc(p.n)}</b> would rather wait for an offer from a bigger club than ${esc(club(me()).name)}.`); toast(`${cmName(p.n)} does not want to join.`); return; } }
    const step = club(p.club).q - club(me()).q, star = !b.fa && squadRank(p) < 4;
    if ((step > 5 && rng(`w-${p.id}-${S.season}`)() < .7) || (star && step > 2 && rng(`s-${p.id}`)() < .5)){ b.st = 'off'; news('club', `${p.n} turns you down`, `<b>${esc(p.n)}</b> does not want to leave ${esc(club(p.club).name)} for ${esc(club(me()).name)}.`); toast(`${cmName(p.n)} does not want to join.`); return; }
    if (b.fee > S.fin.budget){ toast('There is not enough in the transfer budget.'); return; }
    const cl = clFrom(V.tcl, b.w, p), w = clWage(p, b.w, y, cl), from = p.club;
    S.con[p.id] = { y: S.season + y, w, ...(Object.keys(cl).length ? { cl } : {}) }; b.st = 'done'; moveP(p, me(), b.fee); clSign(p, cl);
    if (b.ao) (S.addons = S.addons || []).push({ id: p.id, to: from, amt: roundFee(b.fee * b.ao), n: 25, got: 0 });
    if (b.so) (S.sellOut = S.sellOut || []).push({ id: p.id, to: from, pct: b.so, fee: b.fee + (b.ao ? roundFee(b.fee * b.ao) : 0) });
    news('club', `${p.n} signs`, `<b>${esc(p.n)}</b> joins ${esc(club(me()).name)} ${b.fa ? 'on a free transfer' : `for ${cash(b.fee)}${bidCl(b)}`} on ${wage(w)}, until 30.6.${String(S.season + y).slice(2)}.`); toast(`${cmName(p.n)} signs!`); });
  document.querySelectorAll('[data-cl]').forEach(el => el.addEventListener('change', () => { V = { ...V, tcl: clIdx() }; view(); }));
  on('[data-oaccs]', el => { const o = S.offers[+el.dataset.oaccs]; if (!o || o.st !== 'open') return; o.st = 'acc'; const fee = roundFee(o.fee * .9); S.con[p.id] = { y: S.season + 3, w: wageDemand(p) }; moveP(p, o.from, fee);
    (S.sellIn = S.sellIn || []).push({ id: p.id, pct: .2, from: o.from });
    news('club', `${p.n} sold`, `<b>${esc(p.n)}</b> leaves for ${esc(club(o.from).name)} for ${cash(fee)}, with 20% of any future fee coming back to us.`); V = { s: 'club', cid: me(), tab: 'squad' }; });
  on('[data-oacc]', el => { const o = S.offers[+el.dataset.oacc]; if (!o || o.st !== 'open') return; o.st = 'acc'; S.con[p.id] = { y: S.season + 3, w: wageDemand(p) }; moveP(p, o.from, o.fee);
    news('club', `${p.n} sold`, `<b>${esc(p.n)}</b> leaves for ${esc(club(o.from).name)} for ${cash(o.fee)}.`); V = { s: 'club', cid: me(), tab: 'squad' }; });
  on('[data-orej]', el => { const o = S.offers[+el.dataset.orej]; if (o && o.st === 'open'){ o.st = 'rej'; bidRefused(o); } });
  on('#loanout', () => { const to = D.allClubs.filter(c => c.id !== me() && c.q < club(me()).q && squadOf(c.id).length < 32).sort(() => Math.random() - .5)[0];
    if (!to){ toast('No club wants him just now.'); return; }
    (S.loans = S.loans || {})[p.id] = { from: me(), to: to.id }; moveP(p, to.id, 0, 'Loan');
    news('club', `${p.n} goes on loan`, `<b>${esc(p.n)}</b> joins ${esc(to.name)} on loan until the end of the season.`); V = { s: 'club', cid: me(), tab: 'squad' }; });
  on('#loanin', () => { S.loanAsk = S.loanAsk || {};
    if (squadOf(p.club).length <= 20 || rng(`loan-${p.id}-${S.date}`)() < .35){ S.loanAsk[p.id] = 'no'; toast(`${club(p.club).name} say no.`); return; }
    (S.loans = S.loans || {})[p.id] = { from: p.club, to: me() }; moveP(p, me(), 0, 'Loan');
    news('club', `${p.n} arrives on loan`, `<b>${esc(p.n)}</b> joins on loan from ${esc(club(S.loans[p.id].from).name)} until the end of the season.`); toast(`${cmName(p.n)} joins on loan.`); });
}
/* ---- staff, as in CM 01/02: an assistant manager, coaches, goalkeeping coaches and physios, each with attributes on
   CM's 1-20 scale. Coaching (outfield, goalkeepers) speeds training; Physiotherapy speeds recovery from injury; Man
   Management keeps players happier; the assistant's Judging Ability decides how well he picks a side when you are away.
   Free staff are listed under Staff Search; some are interested in working for you. ---- */
const STAFF_ROLES = { ass: ['Assistant Manager', 1], coach: ['Coach', 4], gk: ['Goalkeeping Coach', 2], phys: ['Physio', 2] };
const STAFF_FIRST = ['Gary', 'Steve', 'Kevin', 'Brian', 'Ian', 'Martin', 'Phil', 'Nigel', 'Terry', 'Ray', 'Alan', 'Dean', 'Colin', 'Stuart', 'Jürgen', 'Carlos', 'Paulo', 'Henk', 'Lars', 'Pierre'];
const STAFF_LAST = ['Atkins', 'Bould', 'Royle', 'McCall', 'Pleat', 'Hodson', 'Gregory', 'Kinnear', 'Sutton', 'Ashworth', 'Bright', 'Coyle', 'Dunne', 'Haig', 'Moss', 'Pires', 'Wenning', 'Strand', 'Lacombe', 'Soriano'];
function makeStaff(role, lvl, r){
  const a = k => clamp(Math.round(lvl + (r() - .5) * 8 + k), 1, 20), main = { ass: 'ju', coach: 'co', gk: 'cg', phys: 'ph' }[role];
  const x = { id: Math.floor(r() * 1e9), n: `${STAFF_FIRST[Math.floor(r() * STAFF_FIRST.length)]} ${STAFF_LAST[Math.floor(r() * STAFF_LAST.length)]}`, role, age: 35 + Math.floor(r() * 25),
    co: a(role === 'coach' || role === 'ass' ? 2 : -5), cg: a(role === 'gk' ? 3 : -6), ju: a(role === 'ass' ? 3 : -2), mm: a(role === 'ass' ? 2 : -1), ph: a(role === 'phys' ? 4 : -9) };
  x[main] = clamp(x[main] + 2, 1, 20);
  x.w = Math.round((600 + (x[main] ** 2) * 18) / 50) * 50;
  return x;
}
function ensureStaff(){
  if (S.staff) return;
  const r = rng(`staff-${S.seed}`), lvl = clamp(6 + (club(me()).q - 72) * .5, 5, 15);
  S.staff = [makeStaff('ass', lvl, r), makeStaff('coach', lvl, r), makeStaff('coach', lvl, r), makeStaff('coach', lvl - 1, r), makeStaff('gk', lvl, r), makeStaff('phys', lvl, r)];
  // the club's real backroom staff by name (Transfermarkt's staff page); their abilities stay the game's own
  const real = (club(me()).staff || []).slice();
  for (const x of S.staff){ const i = real.findIndex(y => y.r === x.role); if (i < 0) continue; const y = real.splice(i, 1)[0]; x.n = y.n; if (y.age) x.age = y.age; if (y.nat) x.nat = y.nat; }
}
function staffPool(){
  const key = S.date.slice(0, 7);
  if (S.spool && S.spool.m === key) return S.spool.L;
  const r = rng(`spool-${S.seed}-${key}`), L = [];
  for (let i = 0; i < 28; i++){ const role = ['ass', 'coach', 'coach', 'coach', 'gk', 'phys'][Math.floor(r() * 6)], x = makeStaff(role, 4 + r() * 13, r); x.int = r() < .35 + (REP_SCORE[S.rep] ?? 1) * .1; L.push(x); }
  S.spool = { m: key, L }; return L;
}
const physioRate = () => { const ph = (S.staff || []).filter(x => x.role === 'phys'); if (!ph.length) return .9; return .9 + Math.max(...ph.map(x => x.ph)) * .015; };   // 10/20: 1.05 days a day; 20/20: 1.2
const manMgmt = () => { const a = (S.staff || []).find(x => x.role === 'ass'); return a ? a.mm : 8; };
function scrStaff(tab){
  ensureStaff(); const pool = staffPool(), mine = S.staff, wageAll = mine.reduce((t, x) => t + x.w, 0);
  const cell = (v, hi) => `<td class="c ${hi ? 'yel' : ''}"><b>${v}</b></td>`;

    return `<tr><td>${x.nat ? flag(x.nat) : ''}<b>${esc(x.n)}</b>${x.int && act === 'hire' ? ' <span class="tag" style="background:#1E6B43;color:#fff">Interested</span>' : ''}</td><td class="dim">${STAFF_ROLES[x.role][0]}</td><td class="c">${x.age}</td>${cell(x.co, m === 'co')}${cell(x.cg, m === 'cg')}${cell(x.ju, m === 'ju')}${cell(x.mm, false)}${cell(x.ph, m === 'ph')}<td class="r">${wage(x.w)}</td>
      <td class="r">${act === 'hire' ? `<button class="btn sm" data-hire="${x.id}">Offer Contract</button>` : `<button class="btn sm" data-fire="${x.id}">Release</button>`}</td></tr>`; };
  const head = `<thead><tr><th>Name</th><th>Job</th><th class="c">Age</th><th class="c" title="Coaching (outfield)">Coa</th><th class="c" title="Coaching (goalkeepers)">GK</th><th class="c" title="Judging Ability">Jud</th><th class="c" title="Man Management">Man</th><th class="c" title="Physiotherapy">Phy</th><th class="r">Wage</th><th></th></tr></thead>`;
  frame({ title: 'Search', act: `<span class="pill" title="Transfer budget">Funds: ${cash(S.fin.budget)}</span>`, top: FIND_TABS, topOn: 'staff',
    onTab: t => { V = { s: 'find', tab: t }; view(); },

      <div class="ptitle">Available Staff</div><div class="tw"><table>${head}<tbody>${pool.filter(x => !mine.some(y => y.id === x.id)).sort((a, b) => b.int - a.int || a.role.localeCompare(b.role)).map(x => row(x, 'hire')).join('')}</tbody></table></div><p class="small dim">A new list of free staff each month.</p>` });

    S.staff.push(x); news('club', `${x.n} joins`, `<b>${esc(x.n)}</b> joins as ${STAFF_ROLES[x.role][0].toLowerCase()} on ${wage(x.w)}.`); toast(`${x.n} has joined.`); save(); view(); }));
  document.querySelectorAll('[data-fire]').forEach(b => b.addEventListener('click', () => { const x = S.staff.find(y => y.id === +b.dataset.fire); if (!x) return;
    S.staff = S.staff.filter(y => y !== x); S.fin.bal -= x.w * 8; news('club', `${x.n} released`, `<b>${esc(x.n)}</b> has left the club with two months' pay.`); save(); view(); }));
}

// Search: players, staff, clubs, nations and competitions; then your short list, your scouts and the staff you hire
// every club the game knows: the leagues and their second tiers, the European cups' and the Club World Cup's clubs
const everyClub = () => [...C.values()].filter(c => c && c.id > 0 && c.name);
const FIND_TABS = [['search', 'Players'], ['people', 'Staff'], ['fclubs', 'Clubs'], ['nations', 'Nations'], ['comps', 'Competitions'], ['short', 'Short List'], ['sc1', 'Scout 1'], ['sc2', 'Scout 2'], ['staff', 'Your Staff']];
const NAT3 = { ALB: 'Albania', AND: 'Andorra', ARM: 'Armenia', AUT: 'Austria', AZE: 'Azerbaijan', BEL: 'Belgium', BIH: 'Bosnia-Herzegovina', BUL: 'Bulgaria', CRO: 'Croatia', CYP: 'Cyprus', CZE: 'Czech Republic', DEN: 'Denmark', ENG: 'England', ESP: 'Spain', FIN: 'Finland', FRA: 'France', GEO: 'Georgia', GER: 'Germany', GIB: 'Gibraltar', GRE: 'Greece', HUN: 'Hungary', ISR: 'Israel', ITA: 'Italy', KAZ: 'Kazakhstan', LTU: 'Lithuania', LVA: 'Latvia', NED: 'Netherlands', NOR: 'Norway', POL: 'Poland', POR: 'Portugal', ROU: 'Romania', SCO: 'Scotland', SLO: 'Slovenia', SRB: 'Serbia', SUI: 'Switzerland', SVK: 'Slovakia', SWE: 'Sweden', TUR: 'Turkey', UKR: 'Ukraine' };
const fold = s => String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase();
const ctryName = c => { const k = c.ctry || 'ENG'; return (D.lgs[k] && D.lgs[k].country) || NAT3[k] || k; };
// where a club plays: its league, its second tier, or its country (a club of the European cups or the Club World Cup)
function basedOf(cid){ const c = C.get(cid); if (!c) return ''; if (LG.has(cid)) return D.league; const k = c.ctry || 'ENG', L = D.lgs[k];
  if (L) return topOf(k).includes(cid) ? L.league : (L.secName || (k === HOME && D.second ? D.second.name : L.country));
  return c.cwc ? `${ctryName(c)} (${c.conf || ''})` : ctryName(c); }
/* a result table where every column sorts: a click on its head, again for the other way. cols: { k, label, cls, v (the
   value it sorts by), h (the cell), desc (sorts high first) } */
function resTable(list, cols, o = {}){
  const key = cols.some(c => c.k === V.sort) ? V.sort : (o.def || cols[0].k), col = cols.find(c => c.k === key), dir = V.dir || (col.desc ? -1 : 1);
  const L = list.slice().sort((a, b) => { const x = col.v(a), y = col.v(b); return ((typeof x === 'string' || typeof y === 'string') ? String(x).localeCompare(String(y)) : x - y) * dir; });
  const per = o.per || 25, pages = Math.max(1, Math.ceil(L.length / per)), pg = Math.min(V.pg || 0, pages - 1), rows = L.slice(pg * per, pg * per + per);
  const bar = pages > 1 ? `<div class="pgbar"><span class="dim small">${L.length} found</span><span class="pg"><button data-pg="0" ${pg ? '' : 'disabled'}>«</button><button data-pg="${pg - 1}" ${pg ? '' : 'disabled'}>‹</button><span>Pg ${pg + 1}/${pages}</span><button data-pg="${pg + 1}" ${pg < pages - 1 ? '' : 'disabled'}>›</button><button data-pg="${pages - 1}" ${pg < pages - 1 ? '' : 'disabled'}>»</button></span></div>` : '';
  const html = `${bar}<div class="tw"><table class="restbl"><thead><tr>${o.pre ? o.pre.head : ''}${cols.map(c => `<th class="srt ${c.cls || ''} ${c.k === key ? 'on' : ''}" data-srt="${c.k}" ${c.tip ? `title="${esc(c.tip)}"` : ''}>${c.label}${c.k === key ? (dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead><tbody>${rows.map(x => `<tr ${o.attrs ? o.attrs(x) : ''}>${o.pre ? o.pre.cell(x) : ''}${cols.map(c => `<td class="${c.cls || ''}">${c.h(x)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length + (o.pre ? 1 : 0)}" class="empty">Nothing found.</td></tr>`}</tbody></table></div>`;
  return { html, rows, all: L, wire: () => {
    document.querySelectorAll('.restbl [data-srt]').forEach(th => th.addEventListener('click', () => { const k = th.dataset.srt, c = cols.find(x => x.k === k); V = { ...V, sort: k, dir: k === key ? -dir : (c.desc ? -1 : 1), pg: 0 }; view(); }));
    document.querySelectorAll('[data-pg]').forEach(b => b.addEventListener('click', () => { V = { ...V, pg: +b.dataset.pg }; view(); })); } };
}

        <div class="ptitle">The numbers</div>${statBars({ poss: [pct, 100 - pct], sh: [M.H.sh, M.A.sh], sot: [M.H.sot, M.A.sot], cor: [M.H.corners, M.A.corners], fou: [M.H.fouls, M.A.fouls], yc: [M.H.yc, M.A.yc], rc: [M.H.rc, M.A.rc] }, M.h, M.a)}</div>
      ${L.others.length ? `<div><div class="ptitle">Elsewhere</div><table><tbody>${L.others.map(o => `<tr><td class="r">${esc(club(o.h).name)}</td><td class="c"><span class="pill">${o.H.goals} - ${o.A.goals}</span></td><td>${esc(club(o.a).name)}</td></tr>`).join('')}</tbody></table></div>` : ''}</div></div>`;
}

/* the Table tab of a cup match: a European league phase or a Club World Cup group live; a knockout round as its bracket
   (the European cups', the Club World Cup's), or the domestic cup's rounds so far, today's ties live and what is to come */
function cupPanel(L, M){
  const live = [M, ...L.others].filter(m => m.min || m.over), sc = (h, a) => { const m = live.find(x => x.h === h && x.a === a); return m ? [m.H.goals, m.A.goals, m.over ? 'FT' : label(m) + "'"] : null; };
  const liveTab = tab => { const T = JSON.parse(JSON.stringify(tab)); for (const m of live){ const a = T[m.h], b = T[m.a]; if (!a || !b) continue; const g1 = m.H.goals, g2 = m.A.goals;
      for (const [x, f, g] of [[a, g1, g2], [b, g2, g1]]){ x.p = (x.p || 0) + 1; x.gf += f; x.ga += g; if (f > g) x.w++; else if (f === g) x.d++; else x.l++; } } return T; };
  const rowsT = (T, cut) => Object.entries(T).map(([id, x]) => ({ id: +id, ...x, gd: x.gf - x.ga, pts: x.w * 3 + x.d })).sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf)
    .map((r, i) => `<tr class="${r.id === me() ? 'me' : ''}" style="${cut && cut.includes(i) ? 'border-bottom:2px dashed var(--line)' : ''}"><td>${i + 1}</td><td class="nm">${crest(r.id)}<b>${esc(club(r.id).name)}</b></td><td class="c">${r.p || 0}</td><td class="c">${r.gd > 0 ? '+' : ''}${r.gd}</td><td class="c yel"><b>${r.pts}</b></td></tr>`).join('');
  const head = '<thead><tr><th></th><th>Club</th><th class="c">Pld</th><th class="c">GD</th><th class="c">Pts</th></tr></thead>';
  const tie = (h, a, s, note) => `<tr class="${h === me() || a === me() ? 'me' : ''}"><td class="r" style="width:42%">${crest(h)}${esc(club(h).name)}</td><td class="c"><span class="pill">${s ? `${s[0]} - ${s[1]}` : 'v'}</span>${note ? `<div class="small dim">${note}</div>` : ''}</td><td style="width:42%">${crest(a)}${esc(club(a).name)}</td></tr>`;
  if (L.eu){ const c = S.eu.c[L.eu]; if (!c) return '';
    const d0 = c.days[c.cur] || {};
    if (d0.st == null) return `<div class="ptitle">${EU_NAME[L.eu]}: League Phase, live</div><table>${head}<tbody>${rowsT(liveTab(c.tab), [7, 23])}</tbody></table><p class="small dim">Top 8 to the round of 16, 9th to 24th to the play-offs.</p>`;
    return euKoHTML(c, L.eu); }
  if (L.fr) return '<p class="empty">A friendly: no table, nothing at stake but legs and places in the side.</p>';
  if (L.euq) return euqHTML(S.euq.ties[L.euq.tie].k);
  if (L.nt){ const f = L.nt; if (f.g != null){ const F = ntAllFx().filter(x => x.comp === f.comp && x.g === f.g), T = [...new Set(F.flatMap(x => [x.h, x.a]))]; return ntGrpHTML(esc(ntLabel(f)), T, F, () => ''); }
    return `<div class="ptitle">${esc(ntLabel(f))}</div><table class="ltab"><tbody>${ntAllFx().filter(x => x.comp === f.comp && x.k && ntKoName(x) === ntKoName(f)).map(ntRow).join('')}</tbody></table>`; }
  if (L.cwc){ const W = S.cwc; return W.ko && (W.days[W.cur] || {}).st != null ? cwcKoHTML(W) : cwcGroupsHTML(W); }
  if (L.shield || L.usc || L.fic) return `<p class="empty">${esc(L.cup)}: a single match, no table or bracket.</p>`;
  // the domestic cups: the rounds played, today's round live, the rounds to come
  const C2 = L.lc ? S.lc : S.cup, names = L.lc ? LC_NAMES : null, nm = i => names ? names[i] : cupName(i), N = L.lc ? S.lc.dates.length : CN();
  const today = L.lc ? (lcDraw() || []) : cupDraw().ties, bye = L.lc ? [] : (cupDraw().bye || []);
  const past = C2.log.slice().reverse().map(l => `<div class="ptitle">${esc(nm(l.stage))}</div><table><tbody>${l.res.filter(x => x.h === me() || x.a === me() || l.res.length <= 8).map(x => tie(x.h, x.a, x.s, x.p ? `${x.p[0]}-${x.p[1]} on penalties` : '')).join('')}</tbody></table>${l.res.length > 8 ? `<p class="small dim">${l.res.length} ties; yours shown.</p>` : ''}`).join('');
  const rest = Array.from({ length: Math.max(0, N - C2.stage - 1) }, (_, i) => nm(C2.stage + 1 + i));
  return `<div class="ptitle">${esc(nm(C2.stage))}: today</div><table><tbody>${today.map(x => { const s = sc(x.h, x.a); return tie(x.h, x.a, s, s ? s[2] : ''); }).join('')}</tbody></table>${bye.length ? `<p class="small dim">Through without playing: ${bye.map(id => esc(club(id).name)).join(', ')}.</p>` : ''}
    ${rest.length ? `<p class="small dim">Still to come: ${rest.map(esc).join(', ')}. ${today.length * 2 + bye.length} clubs are left today.</p>` : ''}${past}`;
}
function mPanel(){
  const L = LIVE, M = L.M, us = M.h === me() ? M.H : M.A;
  const pct = Math.round(100 * M.H.poss / Math.max(1, M.H.poss + M.A.poss));
  if (MTAB === 'report') return `${momentum(M)}<div class="cols2" style="margin-top:10px"><div><div class="ptitle">Incidents</div><div class="inc">${M.inc.map(x => `<div class="h">${x.side === 'h' ? icon(x.k) + incT(x) : ''}</div><div class="m">${x.l}'</div><div>${x.side === 'a' ? icon(x.k) + incT(x) : ''}</div>`).join('') || '<div></div><div class="m">-</div><div></div>'}</div></div><div><div class="ptitle">Commentary</div><div class="feed">${M.feed.slice().reverse().map(f => `<p class="${f.c} ${f.side === 'them' ? 'them' : ''}"><span class="m">${f.m ? f.m + "'" : ''}</span>${f.t}</p>`).join('')}</div></div></div>`;
  if (MTAB === 'stats') return statBars({ poss: [pct, 100 - pct], pas: [Math.round(100 * M.H.pc / Math.max(1, M.H.pa)), Math.round(100 * M.A.pc / Math.max(1, M.A.pa))], sh: [M.H.sh, M.A.sh], sot: [M.H.sot, M.A.sot], cor: [M.H.corners, M.A.corners], fou: [M.H.fouls, M.A.fouls], off: [M.H.off, M.A.off], yc: [M.H.yc, M.A.yc], rc: [M.H.rc, M.A.rc] }, M.h, M.a);
  if (MTAB === 'ratings'){ const col = s => { const ids = [...s.on.map(x => x.id), ...s.subbed.map(x => x[0])].filter((id, i, a) => a.indexOf(id) === i); return ids.map(id => { const v = M.over ? s.rate[id] : clamp(6.3 + (s.rate[id] || 0), 1, 10), x = s.on.find(y => y.id === id); return `<div class="arow" data-dp="${id}"><span><span class="lk" data-lp="${id}">${esc(cmName(P.get(id).n))}</span> <span class="small yel">${x ? x.pos : 'off'}</span>${id === M.mom ? ' ★' : ''}</span><span class="av">${v.toFixed(1)}</span></div>`; }).join(''); };
    return `<div class="cols2"><div><div class="ptitle">${esc(club(M.h).name)}</div>${col(M.H)}</div><div><div class="ptitle">${esc(club(M.a).name)}</div>${col(M.A)}</div></div>`; }
  if (MTAB === 'zones'){ const cur = (M.half - 1) * 100 + M.min, z = from => { const L2 = M.zones.filter(([m, h]) => (h - 1) * 100 + m > from); const c = [0, 0, 0]; L2.forEach(([, , k]) => c[k]++); const t = Math.max(1, L2.length); return c.map(v => Math.round(100 * v / t)); };
    const show = (t, v) => `<div class="ptitle">${t}</div><div class="zones"><div>${v[0]}%<small>${esc(club(M.h).name)} half</small></div><div>${v[1]}%<small>Midfield</small></div><div>${v[2]}%<small>${esc(club(M.a).name)} half</small></div></div>`;
    return `${show('Last 5 Minutes', z(cur - 5))}${show('Whole Match', z(-1))}<p class="c" style="margin-top:8px"><b>Possession:</b> ${esc(club(M.h).name)} ${pct}%, ${esc(club(M.a).name)} ${100 - pct}%</p>`; }
  if (MTAB === 'table'){ if (L.cup) return cupPanel(L, M);
    const tab = JSON.parse(JSON.stringify(S.table)); for (const m of [M, ...L.others]){ if (!m.min && !m.over) continue; for (const [s, gf, ga] of [[m.H, m.H.goals, m.A.goals], [m.A, m.A.goals, m.H.goals]]){ const t = tab[s.cid]; t.p++; t.gf += gf; t.ga += ga; if (gf > ga) t.w++; else if (gf === ga) t.d++; else t.l++; } }
    const st = Object.entries(tab).map(([id, t]) => ({ id: +id, ...t, gd: t.gf - t.ga, pts: t.w * 3 + t.d })).sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
    return `<table><thead><tr><th></th><th>Club</th><th class="c">Pld</th><th class="c">GD</th><th class="c">Pts</th></tr></thead><tbody>${st.map((r, i) => `<tr class="${r.id === me() ? 'me' : ''}"><td>${i + 1}</td><td class="nm">${crest(r.id)}<b>${esc(club(r.id).name)}</b></td><td class="c">${r.p}</td><td class="c">${r.gd > 0 ? '+' : ''}${r.gd}</td><td class="c yel"><b>${r.pts}</b></td></tr>`).join('')}</tbody></table>`; }
  if (MTAB === 'scores' && OPT.bg === 'off' && !M.over) return '<p class="empty">The other results come in at full time (Game Settings: Other Matches).</p>';
  if (MTAB === 'scores') return L.others.length ? `<table><tbody>${L.others.map(o => `<tr><td class="r" style="width:40%"><b>${esc(club(o.h).name)}</b></td><td class="c"><span class="pill">${o.H.goals} - ${o.A.goals}</span>${o.pens ? ` <span class="small dim">(${o.pens[0]}-${o.pens[1]} p)</span>` : ''}</td><td style="width:40%"><b>${esc(club(o.a).name)}</b></td><td class="small yel">${o.over ? 'FT' : o.min ? label(o) + "'" : ''}</td></tr>`).join('')}</tbody></table>` : '<p class="empty">No other matches today.</p>';
  if (MTAB === 'tactics') return boardHTML(boardLive());
  return '';
}
function wireMatchPanel(){
  const L = LIVE; if (!L) return; const M = L.M, us = M.h === me() ? M.H : M.A;
  if (MTAB === 'tactics') boardWire(boardLive());
  document.querySelectorAll('[data-talk]').forEach(b => b.addEventListener('click', () => teamTalk(b.dataset.talk)));
  document.querySelectorAll('[data-fttalk]').forEach(b => b.addEventListener('click', () => ftTalk(b.dataset.fttalk)));
  document.querySelectorAll('.seg[data-mk] button').forEach(b => b.addEventListener('click', () => { const k = b.parentElement.dataset.mk; us.t[k] = +b.dataset.v; if (!M.over) say(M, us, 'minor', `${esc(club(us.cid).name)} change their ${k === 'men' ? 'approach: ' + MENT[us.t.men].toLowerCase() : k === 'pass' ? 'passing: ' + PASS[us.t.pass].toLowerCase() : 'tackling: ' + TACK[us.t.tack].toLowerCase()}.`); viewMatch(); }));
  document.querySelectorAll('[data-mt2]').forEach(b => b.addEventListener('click', () => { us.t[b.dataset.mt2] = !us.t[b.dataset.mt2]; viewMatch(); }));
  document.querySelectorAll('[data-off]').forEach(b => b.addEventListener('click', () => { L.sel = { off: +b.dataset.off, on: L.sel && L.sel.on }; trySub(); }));
  document.querySelectorAll('[data-on]').forEach(b => b.addEventListener('click', () => { L.sel = { on: +b.dataset.on, off: L.sel && L.sel.off }; trySub(); }));
}
function trySub(){ const L = LIVE, M = L.M, us = M.h === me() ? M.H : M.A; if (L.sel && L.sel.off && L.sel.on){ const out = us.on.find(x => x.id === L.sel.off); if (us.subs >= 5) toast('No more substitutions allowed.'); else if (out) substitute(M, us, out, false, L.sel.on); L.sel = null; } viewMatch(); }
function run(){
  clearTimeout(TIMER);
  const L = LIVE; if (!L || L.paused) return;
  const M = L.M, n0 = M.feed.length, g0 = M.H.goals + M.A.goals, i0 = M.inc.length;
  const going = step(M); L.others.forEach(o => { if (!going || o.half < M.half || (o.half === M.half && o.min < M.min)) step(o); });
  if (!going){ L.others.forEach(o => playOut(o)); L.paused = true; liveSave(true); viewMatch(); return; }
  if (M.ht){ M.ht = false; L.paused = true; L.atHT = true; L.others.forEach(o => { while (!o.over && o.half === 1) step(o); o.ht = false; }); liveSave(true); viewMatch(); return; }
  /* an injury or a red card of ours, or a red card for them: the match stops and the tactics open, so you can make the
     change (as CM's "pause on incidents") */
  if (going && MTAB !== 'tactics'){ const us = M.h === me() ? 'h' : 'a', ev = M.inc.slice(i0).find(x => (x.k === 'inj' || x.k === 'red') && x.side === us || x.k === 'red' && x.side !== us);
    if (ev){ L.why = `${ev.l}': ${ev.k === 'inj' ? `${esc(ev.t)} is injured` : ev.side === us ? `${esc(ev.t)} is sent off` : `${esc(club(ev.side === 'h' ? M.h : M.a).name)} are down to ten (${esc(ev.t)} sent off)`}.`; openMatchTac(); return; } }
  liveSave();
  if (M.feed.length !== n0 || M.min % 5 === 0 || (MTAB !== 'overview' && MTAB !== 'tactics')) viewMatch();
  else { const c = document.querySelector('.mclock'); if (c) c.textContent = label(M); }
  TIMER = setTimeout(run, SPEEDS[SPEED][0] * (M.H.goals + M.A.goals > g0 ? 3 : 1));
}

/* =====================================================================================================================
   start
   ===================================================================================================================== */
(async () => {
  try { const r = (await window.__cm) || await fetch('cm.json', { cache: 'no-cache' }); if (r.ok) D = await r.json(); } catch (e) {}
  if (!D || !D.clubs || D.clubs.length < 4){ $('#app').innerHTML = `${header()}<p class="loading">The league is being put together. Come back tomorrow.</p>`; return; }
  for (const [k, n] of D.attrs || []) ATTR_NAME[k] = n;
  // the Championship: its clubs and players live beside the league's, in the background
  D.pl0 = D.clubs.map(c => c.id);
  // England's league and the others the data has (France: Ligue 1 and Ligue 2; Italy: Serie A and Serie B), each with its own fixture list and cup
  for (const c of D.clubs.concat(D.second ? D.second.clubs : [])) c.ctry = c.ctry || 'ENG';
  D.lgs = { ENG: { k: 'ENG', country: 'England', league: D.league, top0: D.pl0.slice(), fixtures: D.fixtures, cup: D.cup, last_season: D.last_season, league_facts: D.league_facts, secName: (D.second || {}).name || 'Championship', ...LG_RULES.ENG } };
  const xc = [], xp = [];
  for (const [k, L] of Object.entries(D.leagues || {})){ if (!L || !Array.isArray(L.clubs) || L.clubs.length < 4) continue;
    D.lgs[k] = { k, country: L.country || k, league: L.league, top0: L.clubs.map(c => c.id), fixtures: L.fixtures, cup: L.cup, last_season: L.last_season, league_facts: L.league_facts || {}, secName: (L.second || {}).name || '', ...(LG_RULES[k] || LG_RULES.ENG) };
    for (const c of L.clubs.concat((L.second || {}).clubs || [])) c.ctry = c.ctry || k;
    xc.push(...L.clubs, ...((L.second || {}).clubs || [])); xp.push(...(L.players || []), ...((L.second || {}).players || [])); }
  D.allClubs = D.clubs.concat(D.second ? D.second.clubs : [], xc);
  if (D.second) D.players = D.players.concat(D.second.players);
  D.players = D.players.concat(xp);
  D.allClubs.forEach(c => C.set(c.id, c)); natFill(D.players);
  D.players.forEach(p => { P.set(p.id, p); p._c0 = p.club; p._n0 = p.no; }); D.all = D.players.slice();
  D.pool = D.all.slice(); setLeagues(null);
  try { const r = (await window.__wx) || await fetch('world.json'); if (r && r.ok) worldAdd(await r.json()); } catch (e) { console.warn('world.json', e); }
  euLoad();
  if (D.cup && (D.cup.rounds || []).length >= 5){ CUP_NAMES = D.cup.rounds.slice(-6).map(r => r[0]); CUP = D.cup.name || 'Cup'; }
  if (D.rules && D.rules.bench) BENCH = D.rules.bench;
  adopt(loadSave());
  if (S) liveLoad();
  view();
})();

// keys, as in CM: Enter or Space presses the green button on the left (Continue Game, Go to Match, Kick Off...),
// Esc goes back, Alt+arrows walk the history
document.addEventListener('keydown', e => {
  const t = e.target, typing = t && (t.isContentEditable || /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName));
  if (typing || e.ctrlKey || e.metaKey) return;
  if ((e.key === 'Enter' || e.key === ' ') && !(t && t.tagName === 'BUTTON') && !e.altKey){
    const g = document.querySelector('.side .sb.go:not([disabled])'); if (g){ e.preventDefault(); g.click(); } return; }
  if (e.key === 'Escape'){ const b = document.querySelector('#back:not([disabled])'); if (b){ e.preventDefault(); b.click(); } return; }
  if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){ const b = document.querySelector(e.key === 'ArrowLeft' ? '#navb:not([disabled])' : '#navf:not([disabled])'); if (b){ e.preventDefault(); b.click(); } }
});
</script>
