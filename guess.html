<style>
/* Guess Who: a player's career on screen, guess who it is; four modes, themed practice games, a new set every game */
:root{
  --night:#0B1626; --panel:#13233A; --panel-2:#1A2E4A; --line:#294060; --grass:#103828; --grass-2:#13422F;
  --gold:#FC9529; --gold-ink:#1A0A00; --text:#F3EFE6; --muted:#A3B1C4;
  --win:#5CC08A; --loss:#E57A62;
  --display:'Oswald','Arial Narrow',Arial,sans-serif; --body:'Rubik','Segoe UI',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--night);color:var(--text)}
body{font:15px/1.5 var(--body);margin:0;min-height:100vh;background-attachment:fixed;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27120%27%20height%3D%27120%27%3E%3Cg%20fill%3D%27white%27%20fill-opacity%3D%27.04%27%20font-family%3D%27Arial%2Csans-serif%27%20font-weight%3D%27700%27%3E%3Ctext%20x%3D%2714%27%20y%3D%2746%27%20font-size%3D%2740%27%20transform%3D%27rotate%28-14%2026%2034%29%27%3E%3F%3C%2Ftext%3E%3Ctext%20x%3D%2772%27%20y%3D%27104%27%20font-size%3D%2730%27%20transform%3D%27rotate%2812%2080%2094%29%27%3E%3F%3C%2Ftext%3E%3C%2Fg%3E%3C%2Fsvg%3E");transition:background-color .3s}
.wrap{max-width:980px;margin:0 auto;padding:12px 16px 80px}.narrow{max-width:640px;margin:0 auto}.stack{display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2{font-family:var(--display);font-weight:600;margin:0;line-height:1.1;text-transform:uppercase;letter-spacing:.01em}
.eyebrow{font:500 12px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)}.num{font-variant-numeric:tabular-nums}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.mark{display:flex;align-items:center;gap:8px;font:700 16px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}.mark .home{display:flex;align-items:center;gap:8px;color:var(--text);text-decoration:none}.mark img{height:28px;width:auto}.mark .mtxt>span{color:var(--gold)}
.mark .trk{display:inline-flex;align-items:center;gap:5px;margin-left:6px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);text-decoration:none;font:500 11px/1 var(--body);letter-spacing:.04em;text-transform:none}.mark .trk:hover{color:var(--text)}
@media(max-width:440px){.mark .trk span{display:none}.mark .trk{padding:5px 6px;margin-left:2px}}
.games{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}.games a{padding:5px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font:600 13px/1 var(--body);white-space:nowrap}.games a.on{background:var(--gold);color:var(--gold-ink)}.games a:not(.on):hover{color:var(--text)}
@media(max-width:440px){.mark .mtxt{display:none}.mark img{height:32px}.games a{padding:5px 10px;font-size:12px}}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.top a{color:var(--muted);font-size:13px;text-decoration:none;border:1px solid var(--line);padding:4px 12px;border-radius:999px}
.card{background:var(--panel);border-radius:14px;padding:18px;margin-top:12px}.stack>.card,.stack>section{margin-top:0}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:13px 18px;font:600 16px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;background:var(--panel-2);color:var(--text)}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}.btn:disabled{opacity:.45;cursor:default}
input.name{display:block;width:100%;margin-top:8px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font:inherit;font-size:16px}
.prog{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:4px 0 12px}.prog i{height:6px;border-radius:3px;background:var(--line)}.prog i.ok{background:var(--win)}.prog i.no{background:var(--loss)}.prog i.now{background:var(--gold)}
.qhead{display:flex;justify-content:space-between;align-items:baseline}
.timer{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin:10px 0 4px}.timer b{display:block;height:100%;background:var(--gold);width:100%}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.kit{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px;background:var(--line);border:2px solid var(--line)}
.reveal{display:flex;flex-direction:column;margin-top:6px}.reveal b{font-size:17px}.reveal span{font-size:13px}
.streak{margin:4px 0 12px;font-size:14px;color:var(--muted)}.streak b{color:var(--gold);font-size:18px}
.pbadge{display:inline-block;margin:8px 0 2px;padding:4px 12px;border-radius:999px;border:1px solid var(--win);color:var(--win);font-weight:700;font-size:13px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}.tab{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.tab.on{color:var(--text);border-color:var(--gold)}
.opts{display:grid;gap:8px;margin-top:14px}.opt.gone{opacity:.25;text-decoration:line-through}

.helps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.help{display:flex;gap:8px;align-items:flex-start;text-align:left;background:var(--panel-2);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:10px;padding:8px 10px;color:var(--text);font:inherit}
.help:hover:not(:disabled){border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.help b{display:block;font:600 13px var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--gold)}
.help small{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.3}
.help .hn{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#0B1626;font:600 12px var(--display)}
.help:disabled{opacity:.4;cursor:not-allowed;border-color:transparent}.help.used .hn{background:var(--muted)}
@media(max-width:520px){.help{padding:8px 6px;gap:6px;align-items:center}.help small{display:none}.help.used small{display:block}.help b{font-size:11.5px;letter-spacing:.02em}.help .hn{width:18px;height:18px;font-size:11px}}
.opt{text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-weight:600;font-size:16px;transition:background .2s,border-color .2s}
.opt:hover:not(:disabled){border-color:var(--gold)}.opt:disabled{cursor:default}.opt.right{background:rgba(92,192,138,.22);border-color:var(--win)}.opt.wrong{background:rgba(229,122,98,.22);border-color:var(--loss)}

/* ---------- settings ---------- */

/* sound, as in the draft game: off by default, made on the spot with Web Audio, no files; the draft game's choice is
   the starting point. The phone buzzes on a miss (only with the sound on, as there) */
const sndOn = () => { const v = store.get().sound; if (v != null) return !!v; try { const t = JSON.parse(localStorage.getItem('ttny.v9') || 'null'); return !!(t && t.pref && t.pref.sound); } catch (e) { return false; } };

const SND = {
  ctx: null,
  ac(){ if (!this.ctx){ const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ctx = new A(); } if (this.ctx.state === 'suspended') this.ctx.resume(); return this.ctx; },

    for (let k = 0; k < 900; k++){

/* ---------- modes and themes ---------- */
// ten: four names to choose from; drip: the same, but the clubs appear one by one (the sooner you know, the more you
// score); typed: no names given, type it; both: two clubs, which of four played for both; endless: four names, until
// the first miss. Each has its own table.
const MODES = [
  ['ten', 'Ten', 'Four names to choose from'],
  ['drip', 'One by one', 'Clubs appear one at a time'],
  ['typed', 'Type it', 'No names given'],
  ['both', 'Both clubs', 'Who played for both?'],
  ['endless', 'Endless', 'Until you miss one'],
];
const TEN_MODES = ['ten', 'drip', 'typed', 'both'];
const MODE_NAME = Object.fromEntries(MODES.map(m => [m[0], m[1]]));
// a theme narrows the players (and the wrong names); themed games are practice and do not go in the table
const THEMES = [
  ['all', 'All players', null],
  ['legends', 'The best known', 'legends'],
  ['ENG', 'Played in England', 'cc'], ['ESP', 'Played in Spain', 'cc'], ['ITA', 'Played in Italy', 'cc'], ['GER', 'Played in Germany', 'cc'],
  ['FRA', 'Played in France', 'cc'], ['POR', 'Played in Portugal', 'cc'], ['NED', 'Played in the Netherlands', 'cc'], ['SRB', 'Played in Serbia', 'cc'],
  ['serbs', 'Serbian players', p => p.nat === 'Serbia'], ['croats', 'Croatian players', p => p.nat === 'Croatia'],
  ['gk', 'Goalkeepers', p => p.pos === 'GK'],
];
const POOLS = {};
function themePool(k){
  if (POOLS[k]) return POOLS[k];
  const t = THEMES.find(x => x[0] === k) || THEMES[0], all = DATA.players, cc = DATA.cc || {};
  let pool;
  if (!t[2]) pool = all;
  else if (t[2] === 'legends') pool = byFame(all).slice(0, 200);
  else if (t[2] === 'cc') pool = all.filter(p => p.c.some(s => cc[s[0]] === k));
  else pool = all.filter(t[2]);
  return POOLS[k] = pool;
}
const prefs = () => { const s = store.get(); return { mode: MODE_NAME[s.mode] ? s.mode : 'ten', theme: THEMES.some(t => t[0] === s.theme) ? s.theme : 'all' }; };

/* ---------- the player's name: shared with This Time Next Year on the same site ---------- */
const store = { get(){ try { return JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) { return {}; } }, set(v){ try { localStorage.setItem(STORE, JSON.stringify(v)); } catch (e) {} } };
function playerName(){
  const own = store.get().name; if (own) return own;
  for (const k of ['ttny.v9.live', 'ttny.v9']){ try { const s = JSON.parse(localStorage.getItem(k) || 'null'); if (s && s.pref && s.pref.name) return s.pref.name; } catch (e) {} }
  return '';

/* ---------- the players for a game ---------- */
// a new game every time, harder as it goes: three well-known players, four from the middle, three from deeper in the list,
// by how well known they are (years at big clubs, the national team); a swapped player comes from the same band.
// Endless: three well-known, then the middle, then deeper and deeper for as long as you keep getting them right
const BANDS = [[0, .12], [0, .12], [0, .12], [.1, .4], [.1, .4], [.1, .4], [.1, .4], [.35, 1], [.35, 1], [.35, 1]];
const pickR = arr => arr[Math.floor(Math.random() * arr.length)];

  if (!FAME.has(players)) FAME.set(players, [...players].sort((a, b) => (b.f != null ? b.f - a.f : (b.ovr || 0) - (a.ovr || 0))));
  return FAME.get(players);

function buildQ(ans, players, band){

  if (!mates.length) mates = players.filter(p => p.id !== ans.id && p.n !== ans.n && shares(p) && (LINE[p.pos] || 'MID') === line);

function buildBoth(ans, players, band, pair){
  const cc = DATA.cc || {}, kits = DATA.kits || {};

  if (!pair){
    const known = clubs.filter(c => cc[c] || kits[c]); if (known.length >= 2) clubs = known;
    const pairs = []; for (let a = 0; a < clubs.length; a++) for (let b = a + 1; b < clubs.length; b++) pairs.push([clubs[a], clubs[b]]);
    pairs.sort(() => Math.random() - .5);
    for (const pr of pairs){ const q = buildBoth(ans, players, band, pr); if (q) return q; }
    return null;
  }
  const [A, B] = pair, has = (p, c) => p.c.some(x => x[0] === c), line = LINE[ans.pos] || 'MID';

  while (wrong.length < 3){ const c = pickR(src); if (!wrong.some(w => w.n === c.n)) wrong.push(c); }

  for (let t = 0; t < 25; t++){

    const q = mode === 'both' ? buildBoth(a, players, band, pair) : buildQ(a, players, band);

const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/ø/g, 'o').replace(/[łľ]/g, 'l').replace(/đ/g, 'd').replace(/ß/g, 'ss').replace(/æ/g, 'ae').replace(/ı/g, 'i').replace(/[^a-z0-9]+/g, ' ').trim();

  if (!NAMES){ const m = new Map(); for (const p of byFame(DATA.players)) if (!m.has(p.n)) m.set(p.n, norm(p.n).split(' ')); NAMES = [...m]; }
  const q = norm(text).split(' ').filter(Boolean); if (!q.length) return [];

  for (const [n, toks] of NAMES){ if (q.every(w => toks.some(t => t.startsWith(w)))){ out.push(n); if (out.length >= 6) break; } }

const HELPS = [['info', 'Info', 'Position, age, nationality'], ['half', 'Fifty-fifty', 'Two wrong names go'], ['swap', 'Swap', 'Another player']];
function useHelp(k){
  const q = G.qs[G.i]; if (!q || G.help[k] || G.answered) return;
  G.help[k] = true;
  const ty = $('#ty'); if (ty) G.tyText = ty.value;
  if (k === 'info'){ q.info = true; G.keepClock = true; }
  else if (k === 'half' && G.mode === 'typed'){ q.initials = true; G.keepClock = true; }
  else if (k === 'half'){ const wrong = q.opts.map((p, j) => j).filter(j => q.opts[j].id !== q.ans.id).sort(() => Math.random() - .5); q.cut = wrong.slice(0, 2); G.keepClock = true; }
  else if (k === 'swap'){ const nq = bandPool(G.pool, q.band, G.used).length ? makeQ(G.mode, G.pool, q.band, G.used) : null; if (!nq){ G.help[k] = false; toast('No other player to swap in.'); return; }
    G.qs[G.i] = nq; G.tyText = ''; }
  viewQ();
}
const points = p => p.ok ? 100 + Math.round(50 * Math.max(0, Q_SECONDS * 1000 - p.ms) / (Q_SECONDS * 1000)) : 0;   // 100 for the right name, up to 50 more for speed
// k: the option picked (-1 when time is up, -2 for a typed name)
function answer(k, typed){
  if (G.done || G.answered) return; G.answered = true; clearInterval(G.timer);
  const q = G.qs[G.i], ms = Math.round(performance.now() - G.t0), pick = k >= 0 ? q.opts[k].n : k === -2 ? typed : null, ok = pick === q.ans.n;
  G.picks.push({ ok, ms: Math.max(300, Math.min(ms, Q_SECONDS * 1000)), pick, q });
  document.querySelectorAll('.opt').forEach((b, j) => { b.disabled = true; if (q.opts[j].id === q.ans.id) b.classList.add('right'); else if (j === k) b.classList.add('wrong'); });
  document.querySelectorAll('.career li').forEach(r => r.classList.remove('hid'));
  const ty = $('#ty'); if (ty){ ty.disabled = true; ty.value = pick || ''; ty.classList.add(ok ? 'right' : 'wrong'); $('#sg').innerHTML = ''; }
  if (ok) SND.play('right'); else if (k === -1) SND.play('whistle', true); else SND.play('wrong');
  if (!ok) buzz(160);
  const last = G.mode !== 'endless' ? G.i + 1 >= G.qs.length : !ok;
  if (G.mode === 'endless' && ok){ const nq = makeQ('endless', G.pool, endlessBand(G.i + 1), G.used); if (nq) G.qs.push(nq); }
  const now = q.ans.c[q.ans.c.length - 1];
  $('#after').innerHTML = `<div class="verdict ${ok ? 'ok' : 'no'}">${ok ? (G.mode !== 'endless' ? 'Right! +' + points(G.picks[G.picks.length - 1]) : 'Right! ' + G.picks.length + ' in a row') : k === -1 ? 'Time is up.' : 'Not this time.'}</div>
    <div class="reveal"><b>${esc(q.ans.n)}</b><span class="muted">${[q.ans.nat, POS_NAME[LINE[q.ans.pos] || 'MID'], now && now[0]].filter(Boolean).map(esc).join(' · ')}</span></div>
    <button class="btn primary" id="nx" style="margin-top:12px">${last ? (G.mode !== 'endless' ? 'See your score' : 'See your run') : 'Next player'}</button>`;
  $('#nx').addEventListener('click', () => { G.answered = false; if (last || G.i + 1 >= G.qs.length) finish(); else { G.i++; viewQ(); } });
  $('#nx').focus();
}
function finish(){
  G.done = true;
  const right = G.picks.filter(p => p.ok).length, score = G.mode !== 'endless' ? G.picks.reduce((t, p) => t + points(p), 0) : right;
  const res = { ch: G.ch, mode: G.mode, theme: G.theme, score, right, picks: G.picks.map(p => [p.ok ? 1 : 0, p.ms]), log: G.picks, helps: Object.keys(G.help).filter(k => G.help[k]).length, name: playerName() };
  res.pb = addStats(res);
  if (res.theme === 'all') push(res);
  viewDone(res);
  const big = res.pb || (G.mode !== 'endless' && right === N_Q) || (G.mode === 'endless' && right >= 10);
  if (big){ confetti(); SND.play('applause'); buzz([40, 40, 40]); } else setTimeout(() => SND.play('whistle'), 300);
}
const themeName = k => (THEMES.find(t => t[0] === k) || [])[1];
function shareText(res){
  const d = new Date(today() + 'T12:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  const what = ['TTNY Guess Who', res.mode !== 'ten' ? MODE_NAME[res.mode] : '', res.theme !== 'all' ? themeName(res.theme) : '', d].filter(Boolean).join(' · ');
  const grid = res.picks.map(p => p[0] ? '🟩' : '🟥').join('');
  const helps = res.helps ? ` · ${res.helps} help${res.helps > 1 ? 's' : ''}` : ' · no helps';
  return res.mode === 'endless' ? `${what}\n${res.score} in a row${helps}\n${grid}\n${location.href.split('#')[0]}` : `${what}\n${res.right}/${N_Q} · ${res.score}${helps}\n${grid}\n${location.href.split('#')[0]}`;
}
// every player of the game, what you said, and his career when you open him
function reviewHTML(res, other){
  return `<section class="card"${other ? ' style="padding:12px 0 0"' : ''}><div class="eyebrow">${other ? 'The players' : 'Your players'}</div><div class="review">${res.log.map((p, j) => `<details><summary><span class="rk ${p.ok ? 'ok' : 'no'}">${p.ok ? '✓' : '✗'}</span><span class="rn"><b>${esc(p.q.ans.n)}</b>${p.ok ? '' : `<small class="muted">${p.pick ? (other ? 'said ' : 'you said ') + esc(p.pick) : 'time ran out'}</small>`}</span><span class="muted num">${res.mode !== 'endless' ? (p.ok ? '+' + points(p) : '0') : j + 1}</span></summary>${p.q.kind === 'both' ? `<div class="hint" style="margin-left:30px">${p.q.pair.map(esc).join(' &amp; ')}</div>` : ''}${careerHTML(p.q.ans.c, null, true)}</details>`).join('')}</div></section>`;
}
function viewDone(res){
  $('#app').innerHTML = `${header()}<div class="narrow">
    <section class="card" style="text-align:center"><div class="eyebrow">${res.mode === 'endless' ? 'Your endless run' : 'Your score'}${res.mode !== 'ten' && res.mode !== 'endless' ? ' · ' + MODE_NAME[res.mode] : ''}${res.theme !== 'all' ? ' · ' + esc(themeName(res.theme)) : ''}</div><div class="big num" style="margin-top:8px">${res.score}</div>
      ${res.pb ? '<div class="pbadge">Personal best!</div>' : ''}
      ${res.mode === 'endless' ? `<div class="muted">${res.score === 1 ? 'player' : 'players'} in a row</div>` : `<div class="muted">${res.right} of ${N_Q} right</div><div class="grid">${res.picks.map(p => p[0] ? '🟩' : '🟥').join('')}</div>`}
      ${res.theme !== 'all' ? '<div class="muted" style="font-size:13px">A practice game: not in the table.</div>' : ''}
      ${res.ch ? `<div class="vs"><span class="${res.score > res.ch.s ? 'w' : ''}">You ${res.score}</span><span class="${res.ch.s > res.score ? 'w' : ''}">${esc(res.ch.n)} ${res.ch.s}</span></div><div class="muted">${res.score > res.ch.s ? 'You beat ' + esc(res.ch.n) + '!' : res.score === res.ch.s ? 'A draw.' : esc(res.ch.n) + ' wins this one.'}</div>` : ''}
      <div class="row"><button class="btn primary" id="again">Play again</button><button class="btn" id="sh">Share</button></div>
      <div class="row" style="margin-top:8px"><button class="btn" id="img">As an image</button>${res.mode !== 'endless' ? '<button class="btn" id="chl">Challenge a friend</button>' : ''}</div>
      <button class="btn" id="home" style="margin-top:8px">Change mode or players</button></section>
    ${reviewHTML(res)}
    <section class="card">${tableHead()}<div id="lw" class="lastwin"></div><div id="lb"><p class="muted" style="margin:6px 0 0">Loading…</p></div></section></div>`;
  $('#again').addEventListener('click', () => { CH = null; history.replaceState(null, '', location.pathname + location.search); start(res.mode, res.theme); });
  $('#home').addEventListener('click', () => { CH = null; history.replaceState(null, '', location.pathname + location.search); viewStart(); });
  if ($('#chl')) $('#chl').addEventListener('click', async () => { const url = challengeLink(res), t = `I scored ${res.score} (${res.right}/${N_Q}) in TTNY Guess Who, ${MODE_NAME[res.mode]}. Same ten players for you: can you beat it?`;
    try { if (navigator.share){ await navigator.share({ text: t, url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(t + '\n' + url); toast('Link copied. Send it to a friend.'); } catch (e) { toast(url); } });
  LBMODE = res.mode; document.querySelectorAll('.tab[data-m]').forEach(x => x.classList.toggle('on', x.dataset.m === LBMODE)); bindTabs();
  $('#img').addEventListener('click', () => gameImage(res));
  $('#sh').addEventListener('click', async () => { const t = shareText(res);
    try { if (navigator.share){ await navigator.share({ text: t }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(t); toast('Copied. Paste it in your group.'); } catch (e) { toast(t); } });
  loadTable();
}
/* the game as an image to share, as the draft game makes its run and top 10: the page's colour and question marks, the
   score, the green and red row and the ten players */
async function gameImage(res){
  try { await document.fonts.load('700 40px Oswald'); await document.fonts.load('400 20px Rubik'); } catch (e) {}
  const W_ = 1080, H = 1350, acc = getComputedStyle(document.body).getPropertyValue('--gold').trim() || '#FF5FA2';
  const cv = document.createElement('canvas'); cv.width = W_; cv.height = H; const x = cv.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0B1626'); g.addColorStop(1, '#13233A'); x.fillStyle = g; x.fillRect(0, 0, W_, H);
  x.save(); x.fillStyle = 'rgba(255,255,255,.045)'; x.font = '700 64px Arial'; x.textAlign = 'center';
  for (let yy = 70, row = 0; yy < H + 80; yy += 150, row++) for (let xx = row % 2 ? 75 : 0; xx < W_ + 80; xx += 150){ x.save(); x.translate(xx + 40, yy); x.rotate((row + xx / 150) % 2 ? .22 : -.22); x.fillText('?', 0, 0); x.restore(); }
  x.restore(); x.fillStyle = acc; x.fillRect(0, 0, W_, 10);
  const T = (s, X, Y, font, col, al, mw) => { x.font = font; x.fillStyle = col; x.textAlign = al || 'left'; let t = String(s); if (mw) while (t.length > 1 && x.measureText(t).width > mw) t = t.slice(0, -2) + '…'; x.fillText(t, X, Y); };
  const D = '"Oswald","Arial Narrow",Arial,sans-serif', B = 'Rubik,Arial,sans-serif', white = '#F3EFE6', muted = '#A3B1C4';
  T('THIS TIME NEXT YEAR · GUESS WHO', 60, 90, `500 26px ${B}`, acc);
  T([MODE_NAME[res.mode], res.theme !== 'all' ? themeName(res.theme) : ''].filter(Boolean).join(' · ').toUpperCase(), 60, 170, `700 64px ${D}`, white, 'left', W_ - 120);
  T(res.score, 60, 330, `700 150px ${D}`, acc);
  T(res.mode === 'endless' ? `${res.score === 1 ? 'player' : 'players'} in a row` : `${res.right} of ${N_Q} right`, 60, 390, `400 34px ${B}`, muted);
  const n = res.picks.length, sq = Math.min(76, (W_ - 120 - (n - 1) * 12) / n);
  res.picks.forEach((p, i) => { x.fillStyle = p[0] ? '#5CC08A' : '#E57A62'; const X = 60 + i * (sq + 12); x.beginPath(); x.roundRect ? x.roundRect(X, 430, sq, sq, 12) : x.rect(X, 430, sq, sq); x.fill(); });
  const L = res.log.slice(0, 10), y0 = 430 + sq + 70;
  L.forEach((p, i) => { const Y = y0 + i * 62; T(p.ok ? '✓' : '✗', 60, Y, `700 34px ${B}`, p.ok ? '#5CC08A' : '#E57A62'); T(p.q.ans.n, 110, Y, `500 34px ${B}`, white, 'left', W_ - 300);
    if (res.mode !== 'endless') T(p.ok ? '+' + points(p) : '0', W_ - 60, Y, `700 34px ${D}`, p.ok ? white : muted, 'right'); });
  T(res.name || '', 60, H - 60, `600 30px ${D}`, white);
  T(location.host + location.pathname.replace(/[^/]*$/, '') + 'guess.html', W_ - 60, H - 60, `400 24px ${B}`, muted, 'right');
  showCanvas(cv, `ttny-guess-who-${res.mode}.png`, 'Your game');
}
// the image in an overlay with Share, Save and Close, as in the draft game
function showCanvas(cv, name, alt){
  const url = cv.toDataURL('image/png');
  const ov = document.createElement('div'); ov.className = 'imgov';
  ov.innerHTML = `<div class="imgbox"><img src="${url}" alt="${alt} as an image"><div class="btnrow"><button class="btn primary" data-img="share">Share</button><button class="btn" data-img="save">Save</button><button class="btn" data-img="close">Close</button></div><div class="muted" style="font-size:12px;text-align:center;margin-top:8px">On a phone you can also press and hold the image to save it.</div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', async e => {
    if (e.target === ov || e.target.dataset.img === 'close'){ ov.remove(); return; }
    const saveIt = async () => { const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
      if (dl){ try { await dl.save({ filename: name, data: blob }); toast('Saved.'); } catch (err) { if (err && err.code === 'declined') return; toast('Saving is not available here. Press and hold the image instead.'); } return; }
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); };
    if (e.target.dataset.img === 'save'){ await saveIt(); return; }
    if (e.target.dataset.img === 'share'){
      try { const blob = await new Promise(r => cv.toBlob(r, 'image/png')), file = new File([blob], name, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })){ await navigator.share({ files: [file], title: 'Guess Who' }); return; } } catch (err) { if (err && err.name === 'AbortError') return; }
      await saveIt(); }
  });
}
function confetti(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div'); box.className = 'confetti'; const cols = ['#FF5FA2', '#2ED3E0', '#C4F04D', '#A57BFF', '#FF4D6D', '#F3EFE6'];
  for (let i = 0; i < 70; i++){ const b = document.createElement('i'); b.style.cssText = `left:${Math.random() * 100}%;background:${cols[i % cols.length]};animation-delay:${Math.random() * .6}s;animation-duration:${1.8 + Math.random() * 1.4}s;transform:rotate(${Math.random() * 360}deg)`; box.appendChild(b); }
  document.body.appendChild(box); setTimeout(() => box.remove(), 4200);
}

/* ---------- the table (Supabase, table "guesses"): each name's best score, per mode, today, this week or ever ---------- */
let LBMODE = 'ten', LBPER = 'day';
const PERIODS = [['day', 'Today'], ['week', 'This week'], ['all', 'All time']];
const monday = () => { const d = new Date(today() + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() - (d.getUTCDay() + 6) % 7); return d.toISOString().slice(0, 10); };
const tableHead = () => `<div class="lbhead"><div class="tabs">${PERIODS.map(([k, n]) => `<button class="tab${LBPER === k ? ' on' : ''}" data-p="${k}">${n}</button>`).join('')}</div><span class="muted" style="font-size:12px">Best score</span></div><div class="tabs" style="margin-bottom:10px">${MODES.map(([k, n]) => `<button class="tab${LBMODE === k ? ' on' : ''}" data-m="${k}">${n}</button>`).join('')}</div>`;
function bindTabs(){
  document.querySelectorAll('.tab[data-m]').forEach(b => b.addEventListener('click', () => { LBMODE = b.dataset.m; document.querySelectorAll('.tab[data-m]').forEach(x => x.classList.toggle('on', x.dataset.m === LBMODE)); loadTable(); }));
  document.querySelectorAll('.tab[data-p]').forEach(b => b.addEventListener('click', () => { LBPER = b.dataset.p; document.querySelectorAll('.tab[data-p]').forEach(x => x.classList.toggle('on', x.dataset.p === LBPER)); loadTable(); }));
}
const head = () => Object.assign({ apikey: LB_CFG.key, 'Content-Type': 'application/json' }, /^eyJ/.test(LB_CFG.key) ? { Authorization: 'Bearer ' + LB_CFG.key } : {});
async function loadTable(){
  const el = $('#lb'); if (!el) return;
  const mode = LBMODE, per = LBPER;
  try {
    const q = LB_CFG.url + '/rest/v1/guesses?select=id,name,score,at' + (per === 'day' ? '&day=eq.' + today() : per === 'week' ? '&day=gte.' + monday() : '') + '&order=score.desc,at.asc&limit=300';
    let r = await fetch(q + '&mode=eq.' + mode, { headers: head(), cache: 'no-store' });
    if (!r.ok && mode === 'ten') r = await fetch(q, { headers: head(), cache: 'no-store' });   // a table from before the modes
    if (!r.ok) throw new Error(r.status);
    const seen = new Set(), rows = (await r.json()).filter(x => { const k = String(x.name || '').trim().toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 10);
    const me = playerName().trim().toLowerCase();
    if (mode !== LBMODE || per !== LBPER) return;
    el.innerHTML = rows.length ? `<div class="bruns">${rows.map((x, i) => `<button class="brun click${String(x.name).trim().toLowerCase() === me ? ' me' : ''}" data-g="${esc(x.id)}"><span class="bi num${i < 3 ? ' md' + (i + 1) : ''}">${i + 1}</span><span class="bt">${esc(x.name)}</span><span class="bs num">${+x.score || 0}</span><span class="bg">›</span></button>`).join('')}</div>` : `<p class="muted" style="margin:6px 0 0">Nobody has played this ${per === 'day' ? 'today' : per === 'week' ? 'this week' : ''} yet.</p>`;
    el.querySelectorAll('[data-g]').forEach(b => b.addEventListener('click', () => openGame(b.dataset.g)));
  } catch (e) { el.innerHTML = '<p class="muted" style="margin:6px 0 0">The table is not available here.</p>'; }
  lastWinner();
}
// a game from the table: its ten players (or its run), what was answered, and each career
async function openGame(id){
  let g = null;
  try { const r = await fetch(LB_CFG.url + '/rest/v1/guesses?select=name,score,mode,day,picks,log&id=eq.' + encodeURIComponent(id), { headers: head() }); if (r.ok) g = (await r.json())[0]; } catch (e) {}
  if (!g){ toast('This game could not be opened.'); return; }
  const mode = g.mode || 'ten', byId = new Map(DATA.players.map(p => [p.id, p]));
  const log = (g.log || []).map((l, i) => ({ ok: !!(g.picks[i] || [])[0], ms: (g.picks[i] || [])[1] || 20000, pick: l[1], q: { kind: l[2] ? 'both' : null, pair: l[2], ans: byId.get(l[0]) } })).filter(p => p.q.ans);
  const day = new Date(g.day + 'T12:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  const ov = document.createElement('div'); ov.className = 'imgov';
  ov.innerHTML = `<div class="revbox"><div class="lbhead"><div class="eyebrow">${esc(MODE_NAME[mode] || 'Ten')} · ${esc(day)}</div><button class="chip" data-x>Close</button></div>
    <h2>${esc(g.name)}: ${+g.score || 0}</h2>
    ${log.length ? reviewHTML({ mode, log }, true) : '<p class="muted">This game was played before the games were kept, so only its score is left.</p>'}</div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-x]')) ov.remove(); });
}
// ---------- last week's winner of the mode shown, above the table (as the weekly challenge's in the draft game)
async function lastWinner(){
  const el = $('#lw'); if (!el) return;
  const mode = LBMODE, end = monday(), d = new Date(end + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() - 7); const start = d.toISOString().slice(0, 10);
  try { const r = await fetch(LB_CFG.url + '/rest/v1/guesses?select=id,name,score&mode=eq.' + mode + '&day=gte.' + start + '&day=lt.' + end + '&order=score.desc,at.asc&limit=1', { headers: head(), cache: 'no-store' });
    const w = r.ok ? (await r.json())[0] : null; if (mode !== LBMODE) return;
    el.innerHTML = w ? `<span class="lw-c">🏆</span><span>Last week's winner in ${esc(MODE_NAME[mode])}: <b>${esc(w.name)}</b> · ${+w.score || 0}</span>` : '';
  } catch (e) { el.innerHTML = ''; }
}
async function push(res, retry){
  // the players of the game go with the score, so anyone can open it from the table: [player id, the name picked, the two clubs]
  const row = Object.assign({ id: 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), day: today(), name: (res.name || 'Unnamed').slice(0, 20), score: res.score, picks: res.picks }, res.mode !== 'ten' ? { mode: res.mode } : {},
    retry ? {} : { log: res.log.map(p => [p.q.ans.id, p.pick ? String(p.pick).slice(0, 40) : null, p.q.kind === 'both' ? p.q.pair : null]) });
  try {
    const r = await fetch(LB_CFG.url + '/rest/v1/guesses', { method: 'POST', headers: Object.assign(head(), { Prefer: 'return=minimal' }),
      body: JSON.stringify(row) });
    if (!r.ok && r.status === 400 && !retry) return push(res, true);   // a table from before the kept games: without them
    if (!r.ok) throw new Error('status ' + r.status);
    loadTable();
  } catch (e) { toast('Your score could not be saved to the table (' + e.message + ').'); }
}

// a visit counter with no personal data: one row per page per device per day (pipeline/visits.sql)
function countVisit(page){
  try { const k = 'ttny.seen', seen = JSON.parse(localStorage.getItem(k) || '{}'), d = new Date().toISOString().slice(0, 10);
    if (seen[page] === d) return; const first = !seen[page]; seen[page] = d; localStorage.setItem(k, JSON.stringify(seen));
    fetch(LB_CFG.url + '/rest/v1/visits', { method: 'POST', headers: Object.assign(head(), { Prefer: 'return=minimal' }), body: JSON.stringify({ page, first }) }).catch(() => {});
  } catch (e) {}
}
/* ---------- start ---------- */
(async () => {
  try { const r = await fetch('careers.json', { cache: 'no-cache' }); if (r.ok) DATA = await r.json(); } catch (e) {}
  if (!DATA || !DATA.players || DATA.players.length < 40){ $('#app').innerHTML = `${header()}<section class="card"><h2>Coming soon</h2><p class="muted" style="margin:8px 0 0">The players' careers are being collected. Come back tomorrow.</p></section>`; return; }
  // only the players whose every club has a crest (the career is shown as crests alone)
  const cr = DATA.cr || {}; DATA.players = DATA.players.filter(p => shownClubs(p.c).every(n => cr[n]));
  if (DATA.players.length < 40){ $('#app').innerHTML = `${header()}<section class="card"><h2>Coming soon</h2><p class="muted" style="margin:8px 0 0">The clubs' crests are being collected. Come back tomorrow.</p></section>`; return; }
  CH = readChallenge(); viewStart(); countVisit('guess');
})();
