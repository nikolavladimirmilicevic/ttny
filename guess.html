<style>
/* Guess Who: a player's career on screen, guess who it is; four modes, themed practice games, a new set every game */
:root{

}
*{box-sizing:border-box}

.prog{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:4px 0 12px}.prog i{height:6px;border-radius:3px;background:var(--line)}.prog i.ok{background:var(--win)}.prog i.no{background:var(--loss)}.prog i.now{background:var(--gold)}

.opt:hover:not(:disabled){border-color:var(--gold)}.opt:disabled{cursor:default}.opt.right{background:rgba(92,192,138,.22);border-color:var(--win)}.opt.wrong{background:rgba(229,122,98,.22);border-color:var(--loss)}

.grid{font-size:22px;letter-spacing:2px;margin:10px 0}
.lb{list-style:none;margin:8px 0 0;padding:0}.lb li{display:flex;justify-content:space-between;padding:8px 2px;border-top:1px solid var(--line)}.lb li:first-child{border-top:0}.lb li.me{color:var(--gold);font-weight:700}

.mode:last-child:nth-child(odd){grid-column:span 2}.key{display:inline-block;min-width:20px;margin-right:8px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:5px;text-align:center}@media (hover:none){.key{display:none}}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:12px}.pair .pc{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);text-align:center;font-weight:700;font-size:16px}.pair .pc .kit{width:30px;height:30px;border-radius:8px;border-width:3px;margin:0}.pair .amp{font:700 22px var(--display);color:var(--gold)}
.chal{border-color:var(--gold)}.vs{display:flex;justify-content:center;gap:18px;margin-top:10px;font-weight:700}.vs .w{color:var(--win)}
.per{display:flex;gap:4px;margin-top:6px}.per .tab{font-weight:500}
.hero h2{font-size:24px}.who{margin-top:14px;font-size:15px}.who .name{margin-top:0}.linkbtn{background:none;border:0;color:var(--gold);padding:0 4px;font-size:13px;text-decoration:underline}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.pill{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px}.pill.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.mdesc{margin:8px 0 12px;font-size:13px}.small{font-size:13px;margin:6px 0 0}.small:empty{display:none}
.more{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:13px}.more select{background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.mode{display:flex;flex-direction:column;align-items:flex-start;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);text-align:left}.mode b{font-family:var(--display);letter-spacing:.04em;text-transform:uppercase;font-size:14px}.mode small{font-size:12px;color:var(--muted)}.mode.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}.mode.on b{color:var(--gold)}
select.name{display:block;width:100%;margin-top:8px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font:inherit;font-size:16px}
.tabs{flex-wrap:wrap;margin-top:8px}
.timer b{transition:background .3s}.timer b.low{background:var(--loss)}
.career li.hid .cl{font-size:0;width:56px;height:31px;text-align:center;background:var(--line)!important;border-color:var(--line)!important;user-select:none}.career li.hid .cl::after{content:'?';font-size:15px;color:var(--muted)}
.typed{margin-top:14px}.typed input{margin-top:0}.typed input.right{border-color:var(--win);background:rgba(92,192,138,.22)}.typed input.wrong{border-color:var(--loss);background:rgba(229,122,98,.22)}
.sugg{display:grid;gap:6px;margin-top:8px}.sg{text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-weight:600}.sg.first{border-color:var(--gold)}.sg:hover{border-color:var(--gold)}
.opt.right{animation:pop .35s ease-out}@keyframes pop{50%{transform:scale(1.03)}}
.review details{border-top:1px solid var(--line)}.review details:first-child{border-top:0}.review summary{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:baseline;padding:9px 2px;cursor:pointer;list-style:none}.review summary::-webkit-details-marker{display:none}
.review .rk{font-weight:700}.review .rk.ok{color:var(--win)}.review .rk.no{color:var(--loss)}.review .rn{display:flex;flex-direction:column}.review .rn small{font-size:12px}.review .career{margin:2px 0 12px;align-items:flex-start;padding-left:30px}.review .career li{align-items:flex-start}.review .career li+li::before{padding-left:14px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:8}.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall linear forwards}@keyframes fall{to{top:105%;transform:translateX(30px) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<div class="wrap" id="app"><p class="muted">Loading…</p></div>
<script>
/* ---------- settings ---------- */
const LB_CFG = { url: 'https://sadpfbuqocbekvlwxfqz.supabase.co', key: 'sb_publishable_etNezztDu3d9TwRBm5cJ-w_Z2PyvVsP' };
const N_Q = 10, Q_SECONDS = 20, STORE = 'ttny.guess.v1';
const LINE = { GK: 'GK', CB: 'DEF', LB: 'DEF', RB: 'DEF', DMF: 'MID', CMF: 'MID', LMF: 'MID', RMF: 'MID', AMF: 'MID', LWF: 'FWD', RWF: 'FWD', CF: 'FWD' };
const POS_NAME = { GK: 'goalkeeper', DEF: 'defender', MID: 'midfielder', FWD: 'forward' };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = m => { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); };
const today = () => new Date().toISOString().slice(0, 10);   // the day's table changes at midnight UTC
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ---------- modes and themes ---------- */
// ten: four names to choose from; drip: the same, but the clubs appear one by one (the sooner you know, the more you
// score); typed: no names given, type it; both: two clubs, which of four played for both; endless: four names, until
// the first miss. Each has its own table.
const MODES = [
  ['ten', 'Ten', 'Four names to choose from'],
  ['drip', 'One by one', 'Clubs appear one at a time'],
  ['typed', 'Type it', 'No names given'],
  ['both', 'Both clubs', 'Who played for both?'],
  ['endless', 'Endless', 'Until you miss one'],
];
const TEN_MODES = ['ten', 'drip', 'typed', 'both'];
const MODE_NAME = Object.fromEntries(MODES.map(m => [m[0], m[1]]));
// a theme narrows the players (and the wrong names); themed games are practice and do not go in the table
const THEMES = [
  ['all', 'All players', null],
  ['legends', 'The best known', 'legends'],
  ['ENG', 'Played in England', 'cc'], ['ESP', 'Played in Spain', 'cc'], ['ITA', 'Played in Italy', 'cc'], ['GER', 'Played in Germany', 'cc'],
  ['FRA', 'Played in France', 'cc'], ['POR', 'Played in Portugal', 'cc'], ['NED', 'Played in the Netherlands', 'cc'], ['SRB', 'Played in Serbia', 'cc'],
  ['serbs', 'Serbian players', p => p.nat === 'Serbia'], ['croats', 'Croatian players', p => p.nat === 'Croatia'],
  ['gk', 'Goalkeepers', p => p.pos === 'GK'],
];
const POOLS = {};
function themePool(k){
  if (POOLS[k]) return POOLS[k];
  const t = THEMES.find(x => x[0] === k) || THEMES[0], all = DATA.players, cc = DATA.cc || {};
  let pool;
  if (!t[2]) pool = all;
  else if (t[2] === 'legends') pool = byFame(all).slice(0, 200);
  else if (t[2] === 'cc') pool = all.filter(p => p.c.some(s => cc[s[0]] === k));
  else pool = all.filter(t[2]);
  return POOLS[k] = pool;
}
const prefs = () => { const s = store.get(); return { mode: MODE_NAME[s.mode] ? s.mode : 'ten', theme: THEMES.some(t => t[0] === s.theme) ? s.theme : 'all' }; };

/* ---------- the player's name: shared with This Time Next Year on the same site ---------- */
const store = { get(){ try { return JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) { return {}; } }, set(v){ try { localStorage.setItem(STORE, JSON.stringify(v)); } catch (e) {} } };
function playerName(){
  const own = store.get().name; if (own) return own;
  for (const k of ['ttny.v9.live', 'ttny.v9']){ try { const s = JSON.parse(localStorage.getItem(k) || 'null'); if (s && s.pref && s.pref.name) return s.pref.name; } catch (e) {} }
  return '';
}

/* ---------- the players for a game ---------- */
// a new game every time, harder as it goes: three well-known players, four from the middle, three from deeper in the list,
// by how well known they are (years at big clubs, the national team); a swapped player comes from the same band.
// Endless: three well-known, then the middle, then deeper and deeper for as long as you keep getting them right
const BANDS = [[0, .12], [0, .12], [0, .12], [.1, .4], [.1, .4], [.1, .4], [.1, .4], [.35, 1], [.35, 1], [.35, 1]];
const pickR = arr => arr[Math.floor(Math.random() * arr.length)];
const FAME = new WeakMap();
function byFame(players){
  if (!FAME.has(players)) FAME.set(players, [...players].sort((a, b) => (b.f != null ? b.f - a.f : (b.ovr || 0) - (a.ovr || 0))));
  return FAME.get(players);
}
function bandPool(players, band, used){
  const list = byFame(players), n = list.length, lo = Math.floor(band[0] * n);
  return list.slice(lo, Math.max(lo + 1, Math.floor(band[1] * n))).filter(p => !used.has(p.id));
}
const endlessBand = i => i < 3 ? BANDS[0] : i < 8 ? BANDS[3] : i < 15 ? BANDS[7] : [.6, 1];
// three wrong answers: the same line, a similar age and standing, never the same name; one of them, when there is one,
// played for a club in this career too, so the clubs alone do not give it away
function buildQ(ans, players, band){
  const line = LINE[ans.pos] || 'MID', near = (p, a, o) => p.id !== ans.id && p.n !== ans.n && (LINE[p.pos] || 'MID') === line && Math.abs((p.age || 26) - (ans.age || 26)) <= a && Math.abs((p.ovr || 70) - (ans.ovr || 70)) <= o;
  const clubs = new Set(ans.c.map(x => x[0])), shares = p => p.c.some(x => clubs.has(x[0]));
  const wrong = [];
  let mates = players.filter(p => p.id !== ans.id && p.n !== ans.n && shares(p) && (LINE[p.pos] || 'MID') === line && Math.abs((p.age || 26) - (ans.age || 26)) <= 5);
  if (!mates.length) mates = players.filter(p => p.id !== ans.id && p.n !== ans.n && shares(p) && (LINE[p.pos] || 'MID') === line);
  if (mates.length) wrong.push(pickR(mates));
  let cand = players.filter(p => near(p, 3, 6)); if (cand.length < 3) cand = players.filter(p => near(p, 6, 12)); if (cand.length < 3) cand = players.filter(p => p.id !== ans.id && p.n !== ans.n);
  while (wrong.length < 3 && cand.length){ const c = cand.splice(Math.floor(Math.random() * cand.length), 1)[0]; if (!wrong.some(w => w.n === c.n)) wrong.push(c); }
  return { ans, band, opts: [ans, ...wrong].map(p => ({ p, k: Math.random() })).sort((a, b) => a.k - b.k).map(x => x.p), cut: [], info: false };
}
// Both clubs: two clubs from his career and four names; the three wrong ones played for one of the two, never both
function buildBoth(ans, players, band, pair){
  const cc = DATA.cc || {}, kits = DATA.kits || {};
  let clubs = [...new Set(ans.c.map(x => x[0]))];
  if (!pair){
    const known = clubs.filter(c => cc[c] || kits[c]); if (known.length >= 2) clubs = known;
    const pairs = []; for (let a = 0; a < clubs.length; a++) for (let b = a + 1; b < clubs.length; b++) pairs.push([clubs[a], clubs[b]]);
    pairs.sort(() => Math.random() - .5);
    for (const pr of pairs){ const q = buildBoth(ans, players, band, pr); if (q) return q; }
    return null;
  }
  const [A, B] = pair, has = (p, c) => p.c.some(x => x[0] === c), line = LINE[ans.pos] || 'MID';
  const one = DATA.players.filter(p => p.id !== ans.id && p.n !== ans.n && has(p, A) !== has(p, B));
  if (one.length < 3) return null;
  const same = one.filter(p => (LINE[p.pos] || 'MID') === line), src = same.length >= 3 ? same : one, wrong = [];
  // one from each club when it can, so neither club gives the answer away
  for (const c of [A, B]){ const l = src.filter(p => has(p, c) && !wrong.includes(p)); if (l.length) wrong.push(pickR(l)); }
  while (wrong.length < 3){ const c = pickR(src); if (!wrong.some(w => w.n === c.n)) wrong.push(c); }
  return { kind: 'both', ans, band, pair: [A, B], opts: [ans, ...wrong].map(p => ({ p, k: Math.random() })).sort((a, b) => a.k - b.k).map(x => x.p), cut: [], info: false };
}
function makeQ(mode, players, band, used, ans, pair){
  for (let t = 0; t < 25; t++){
    const a = ans || pickR(bandPool(players, band, used)); if (!a) return null;
    const q = mode === 'both' ? buildBoth(a, players, band, pair) : buildQ(a, players, band);
    if (q){ used.add(a.id); return q; }
    if (ans) { ans = null; pair = null; }
  }
  return null;
}
function newSet(players, used, mode){
  const qs = [];
  for (const band of BANDS){ const q = makeQ(mode, players, band, used); if (q) qs.push(q); }
  return qs;
}

/* ---------- typing a name: every player in the game can be suggested, accents and case do not matter ---------- */
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/ø/g, 'o').replace(/[łľ]/g, 'l').replace(/đ/g, 'd').replace(/ß/g, 'ss').replace(/æ/g, 'ae').replace(/ı/g, 'i').replace(/[^a-z0-9]+/g, ' ').trim();
let NAMES = null;
function suggest(text){
  if (!NAMES){ const m = new Map(); for (const p of byFame(DATA.players)) if (!m.has(p.n)) m.set(p.n, norm(p.n).split(' ')); NAMES = [...m]; }
  const q = norm(text).split(' ').filter(Boolean); if (!q.length) return [];
  const out = [];
  for (const [n, toks] of NAMES){ if (q.every(w => toks.some(t => t.startsWith(w)))){ out.push(n); if (out.length >= 6) break; } }
  return out;
}

/* ---------- state ---------- */
let DATA = null, G = null;   // G: the game { mode, theme, pool, qs, i, picks: [{ok, ms, pick}], used, help: {info, half, swap}, t0, timer }

/* ---------- screens ---------- */
const header = () => `<div class="top"><div><div class="eyebrow">This Time Next Year</div><h1 style="font-size:26px;margin-top:4px">Guess Who</h1></div><a href="./">The draft game</a></div>`;
function viewStart(){
  const name = playerName(), pr = prefs();
  $('#app').innerHTML = `${header()}
    ${CH ? `<section class="card chal"><div class="eyebrow">A challenge</div><h2 style="margin-top:6px">${esc(CH.n)}: ${CH.s}</h2>
      <p class="muted" style="margin:6px 0 0">${CH.r} of ${CH.q.length} right in ${esc(MODE_NAME[CH.m])}${CH.t !== 'all' ? ' · ' + esc(themeName(CH.t)) : ''}. Same players, can you beat it?</p>
      <button class="btn primary" id="gch" style="margin-top:12px"></button>
      <button class="btn" id="xch" style="margin-top:8px">No thanks, a game of my own</button></section>` : ''}
    <section class="card hero"><h2>Whose career is this?</h2>
      <p class="muted" style="margin:6px 0 0">His clubs, in order. Who is he?</p>
      <div id="who" class="who"></div>

function bindTabs(){
  document.querySelectorAll('.tab[data-m]').forEach(b => b.addEventListener('click', () => { LBMODE = b.dataset.m; document.querySelectorAll('.tab[data-m]').forEach(x => x.classList.toggle('on', x.dataset.m === LBMODE)); loadTable(); }));
  document.querySelectorAll('.tab[data-p]').forEach(b => b.addEventListener('click', () => { LBPER = b.dataset.p; document.querySelectorAll('.tab[data-p]').forEach(x => x.classList.toggle('on', x.dataset.p === LBPER)); loadTable(); }));
}
const head = () => Object.assign({ apikey: LB_CFG.key, 'Content-Type': 'application/json' }, /^eyJ/.test(LB_CFG.key) ? { Authorization: 'Bearer ' + LB_CFG.key } : {});
async function loadTable(){
  const el = $('#lb'); if (!el) return;
  const mode = LBMODE, per = LBPER;
  try {
    const q = LB_CFG.url + '/rest/v1/guesses?select=name,score,at' + (per === 'day' ? '&day=eq.' + today() : per === 'week' ? '&day=gte.' + monday() : '') + '&order=score.desc,at.asc&limit=300';
    let r = await fetch(q + '&mode=eq.' + mode, { headers: head(), cache: 'no-store' });
    if (!r.ok && mode === 'ten') r = await fetch(q, { headers: head(), cache: 'no-store' });   // a table from before the modes
    if (!r.ok) throw new Error(r.status);
    const seen = new Set(), rows = (await r.json()).filter(x => { const k = String(x.name || '').trim().toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 10);
    const me = playerName().trim().toLowerCase();
    if (mode !== LBMODE || per !== LBPER) return;
    el.innerHTML = rows.length ? `<ol class="lb">${rows.map((x, i) => `<li class="${String(x.name).trim().toLowerCase() === me ? 'me' : ''}"><span>${i + 1}. ${esc(x.name)}</span><b class="num">${+x.score || 0}</b></li>`).join('')}</ol>` : `<p class="muted" style="margin:6px 0 0">Nobody has played this ${per === 'day' ? 'today' : per === 'week' ? 'this week' : ''} yet.</p>`;
  } catch (e) { el.innerHTML = '<p class="muted" style="margin:6px 0 0">The table is not available here.</p>'; }
}
async function push(res){
  try {
    const r = await fetch(LB_CFG.url + '/rest/v1/guesses', { method: 'POST', headers: Object.assign(head(), { Prefer: 'return=minimal' }),
      body: JSON.stringify(Object.assign({ id: 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), day: today(), name: (res.name || 'Unnamed').slice(0, 20), score: res.score, picks: res.picks }, res.mode !== 'ten' ? { mode: res.mode } : {})) });
    if (!r.ok) throw new Error('status ' + r.status);
    loadTable();
  } catch (e) { toast('Your score could not be saved to the table (' + e.message + ').'); }
}

/* ---------- start ---------- */
(async () => {
  try { const r = await fetch('careers.json', { cache: 'no-cache' }); if (r.ok) DATA = await r.json(); } catch (e) {}
  if (!DATA || !DATA.players || DATA.players.length < 40){ $('#app').innerHTML = `${header()}<section class="card"><h2>Coming soon</h2><p class="muted" style="margin:8px 0 0">The players' careers are being collected. Come back tomorrow.</p></section>`; return; }
  CH = readChallenge(); viewStart();
})();
</script>
