name: Calibrate difficulty

on:
  schedule:
    - cron: '7 7 * * *'     # once a day, after the morning data update: draft bots set the strong-XI lift
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update        # never at the same time as a data update
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the browser for the bots
        run: |
          npm install --no-save playwright@1.64.0
          npx playwright install --with-deps chromium
      - name: Draft bots set the lift (13 / 10 / 8% titles for a sharp drafter)
        run: |
          python3 -m http.server 8830 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2
          node pipeline/tools/calibrate.js world.json 1500
      - name: Commit
        run: |
          git config user.name "ttny-data-bot"
          git config user.email "ttny-data-bot@users.noreply.github.com"
          git add world.json
          git diff --cached --quiet || git commit -m "Calibrate difficulty $(date -u +%F)"
          git pull --rebase origin main
          git push
