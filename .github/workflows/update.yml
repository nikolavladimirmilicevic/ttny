name: Update data

on:
  schedule:
    - cron: '17 5,11,17 * * *'   # three times a day (05:17, 11:17, 17:17 UTC): GitHub can delay or skip a scheduled run,
                                  # so the later ones are the backup; each run only fetches what is new
    - cron: '47 8,21 * * *'      # two more backups (08:47, 21:47 UTC): a run with nothing new to fetch costs almost nothing
    - cron: '3 1,2,3 * * 1'      # Monday 02:03, 03:03, 04:03 CET (01:03-03:03 UTC): last week's results in, then the new weekly challenge
  workflow_dispatch:        # "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and build world.json
        run: python3 pipeline/update.py
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          MAX_REQUESTS: ${{ vars.MAX_REQUESTS || '90' }}
          GRID_COL1_IS_RIGHT: ${{ vars.GRID_COL1_IS_RIGHT || '0' }}
      - name: Commit data
        if: always()   # keep what was fetched even when the build step fails
        run: |
          git config user.name "ttny-data-bot"
          git config user.email "ttny-data-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Data update $(date -u +%F)"
          # code may have been pushed while the run was fetching: put the data on top of it
          git pull --rebase origin main
          git push
