name: Update data

on:
  schedule:
    - cron: '17 5 * * *'   # every day, 05:17 UTC
  workflow_dispatch:        # "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and build world.json
        run: python3 pipeline/update.py
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          MAX_REQUESTS: ${{ vars.MAX_REQUESTS || '90' }}
          GRID_COL1_IS_RIGHT: ${{ vars.GRID_COL1_IS_RIGHT || '1' }}
      - name: Commit data
        run: |
          git config user.name "ttny-data-bot"
          git config user.email "ttny-data-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Data update $(date -u +%F)"
          git push
