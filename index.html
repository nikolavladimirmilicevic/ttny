<style>
/* Layout: one centred column (max 980px), stadium-night look; draft splits into list | pitch on wide screens */
:root{
  --night:#0B1626; --panel:#13233A; --panel-2:#1A2E4A; --line:#294060;
  --gold:#E3B341; --gold-ink:#1C1606; --text:#F3EFE6; --muted:#A3B1C4;
  --win:#5CC08A; --loss:#E57A62; --draw:#C9CED6;
  --grass:#103828; --grass-2:#13422F; --chalk:rgba(243,239,230,.28);
  --gA:#2F8CFF; --gB:#35C46A; --gC:#F2D33D; --gD:#F28A2E; --gE:#E8443A;   /* PES condition colours: blue, green, yellow, orange, red */
  --display:'Oswald','Arial Narrow',Arial,sans-serif;
  --body:'Rubik','Segoe UI',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--night);color:var(--text)}
body{font:15px/1.5 var(--body);margin:0}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:12px 120px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.1;text-wrap:balance;text-transform:uppercase;letter-spacing:.01em}
.eyebrow{font:500 12px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.mark{font:700 16px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.mark .mtxt > span{color:var(--gold)}
.mark{display:flex;align-items:center;gap:8px}
.mark .trk{display:inline-flex;align-items:center;gap:5px;margin-left:6px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);text-decoration:none;font:500 11px/1 var(--body);letter-spacing:.04em;text-transform:none}
.mark .trk:hover{color:var(--text);border-color:var(--gold)}
@media(max-width:440px){.mark .trk span{display:none}.mark .trk{padding:5px 6px;margin-left:2px}.mark .logo{height:32px}}
/* on a phone the logo carries the name, so the words give way to the clock and buttons */
@media(max-width:440px){.topbar:has(.chip) .mark .mtxt{display:none}}.mark .logo{height:28px;width:auto;flex:none}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:14px}.hero .hlogo{align-self:start;width:0;height:0;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.hero h1 .hl{display:inline-block;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.chip.hot{border-color:var(--gold);color:var(--gold)}.chip .ico{display:none}
.chip.warn{border-color:var(--loss);color:var(--loss)}
.chip.quit{background:transparent;cursor:pointer}

.btn{border:0;border-radius:10px;padding:13px 18px;font:600 16px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;background:var(--panel-2);color:var(--text)}
.btn.primary{background:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 160px}
@media(max-width:440px){.mark{font-size:13px;letter-spacing:.06em;white-space:nowrap}.chip{padding:3px 8px;font-size:11px}.chip .lbl{display:none}.chip .ico{display:inline}.btnrow{flex-wrap:nowrap}.btnrow .btn{flex:1 1 0;font-size:14px;letter-spacing:.03em;padding:13px 10px;min-width:0}}

.card{background:var(--panel);border-radius:14px;padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}

/* home */
.hero{padding:26px 20px 26px;border-radius:16px;background:
  radial-gradient(120% 90% at 50% -10%,rgba(227,179,65,.22),transparent 60%),
  repeating-linear-gradient(90deg,var(--grass) 0 40px,var(--grass-2) 40px 80px);
  border:1px solid var(--line)}
.hero h1{font-size:clamp(44px,12vw,88px);font-weight:700;line-height:.95}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{margin:12px 0 0;max-width:46ch;color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--panel);border-radius:12px;padding:12px}
.stat b{display:block;font:600 28px/1 var(--display)}
.stat span{font-size:12px;color:var(--muted)}
details.rules{background:var(--panel);border-radius:14px;padding:4px 18px}
details.rules summary{padding:14px 0;font:600 16px var(--display);letter-spacing:.06em;text-transform:uppercase;list-style:none}
details.rules summary::after{content:"+";float:right;color:var(--gold)}
details.rules[open] summary::after{content:"−"}
details.rules ol{margin:0 0 16px;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.bruns{display:flex;flex-direction:column;gap:6px}
.brun{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font:inherit;cursor:pointer}
.brun:hover{border-color:var(--gold)}.brun.champ{border-color:rgba(227,179,65,.55);background:linear-gradient(90deg,rgba(227,179,65,.12),var(--panel-2) 60%)}
.brun .bi{flex:none;width:24px;height:24px;line-height:24px;border-radius:50%;text-align:center;color:var(--muted);font-weight:700;font-size:13px}.brun.champ .bi{color:var(--gold)}
.brun .bi.md1{background:linear-gradient(135deg,#F7D66B,#C9971C);color:#2A1D00}.brun .bi.md2{background:linear-gradient(135deg,#E9EEF3,#9AA6B2);color:#1E252C}.brun .bi.md3{background:linear-gradient(135deg,#E6A472,#9C5A2B);color:#2B1406}
.brun.flash{animation:bflash 2.4s ease-out 1}@keyframes bflash{0%,30%{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 22px rgba(227,179,65,.55)}100%{box-shadow:none}}
.t10{display:inline-flex;align-items:baseline;gap:8px;margin-top:10px;padding:6px 14px;border-radius:999px;background:linear-gradient(135deg,rgba(247,214,107,.22),rgba(201,151,28,.12));border:1px solid var(--gold);color:var(--gold)}.t10 b{font-size:20px}.t10 span{font-size:13px;color:var(--text)}
.t10.pop{animation:t10pop .7s cubic-bezier(.2,1.6,.4,1) .4s both}@keyframes t10pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.scorebox .sbig{font-size:34px;color:var(--gold);line-height:1}.sparts{display:grid;gap:6px;margin-top:10px}.sp{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}.sp span{display:flex;flex-direction:column}.sp small{color:var(--muted);font-size:12px}.sp b{font-size:16px}
.lbtabs{display:flex;gap:4px}.lbt{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:3px 11px;font:inherit;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}.lbt.on{color:var(--text);border-color:var(--gold)}
.weekly{border:1px solid var(--gold)}.wkcs{display:flex;flex-wrap:wrap;gap:5px}.wkc{font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--kit);color:var(--kit-ink);font-weight:600}
.hello{margin-top:16px;font-size:16px}.linkb{background:none;border:0;padding:0 0 0 6px;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}
.radar .rv{transform-origin:var(--cx) var(--cy);animation:rgrow .5s cubic-bezier(.2,.9,.3,1)}@keyframes rgrow{from{transform:scale(0);opacity:.2}}
@media (prefers-reduced-motion:reduce){.radar .rv,.t10.pop,.brun.flash{animation:none}}

  font:700 18px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase;background:var(--gold);color:var(--gold-ink);box-shadow:0 8px 24px rgba(0,0,0,.45);animation:gflash 1.3s ease-out forwards}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const MR = Math.random;
const pick = (a, r = MR) => a[Math.floor(r() * a.length)];
function shuffle(a, r = MR){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function poisson(l, r){ const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= r(); } while (p > L); return k - 1; }

  rows.forEach((row, i) => {

function drawPitch(x, xi, PX, PY, PW, PH){

  const sorted = [...xi].sort((p, q) => p.y - q.y), rows = [];

  rows.forEach((row, ri) => {
    const cy = top + 32 + (rows.length > 1 ? ri * gap : (PH - 60 - BH) / 2);
    row.sort((p, q) => p.x - q.x);
    const cxs = row.map(p => PX + PW * (0.06 + 0.88 * p.x / 100));
    row.forEach((p, i) => {
      const cx = cxs[i], left = i ? (cx - cxs[i - 1]) : 2 * (cx - PX - 6), right = i < row.length - 1 ? (cxs[i + 1] - cx) : 2 * (PX + PW - 6 - cx);

      txt(x, rt1(p.rt), cx, cy + 11, '700 27px Oswald, "Arial Narrow", Arial, sans-serif', rg === 'C' || rg === 'B' || rg === 'D' ? '#0B1626' : '#fff', 'center');
      if (p.cap){ x.beginPath(); x.arc(cx + 27, cy - 22, 14, 0, 2 * Math.PI); x.fillStyle = '#0B1626'; x.fill(); x.lineWidth = 3; x.strokeStyle = '#F2C14E'; x.stroke();
        txt(x, 'C', cx + 27, cy - 15, '700 19px Oswald, "Arial Narrow", Arial, sans-serif', '#F2C14E', 'center'); }
      const nm_ = surname(p.n), nf = fit(nm_, room - 20, 500, 24, 17), tw = Math.min(room, x.measureText(nm_).width + 20);

function showCanvas(cv, name, alt){
  const url = cv.toDataURL('image/png'), kind = alt;
  const ov = document.createElement('div'); ov.className = 'imgov';
  ov.innerHTML = `<div class="imgbox"><img src="${url}" alt="${kind} as an image"><div class="btnrow"><button class="btn primary" data-img="share">Share</button><button class="btn ghost" data-img="save">Save</button><button class="btn ghost" data-img="close">Close</button></div><div class="muted" style="font-size:12px;text-align:center;margin-top:8px">On a phone you can also press and hold the image to save it.</div></div>`;
  document.body.appendChild(ov);

    if (e.target === ov || e.target.dataset.img === 'close'){ ov.remove(); return; }
    const saveIt = async () => {
      const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
      if (dl){ try { await dl.save({ filename: name, data: blob }); toast('Saved.'); } catch (err) { if (err && err.code === 'declined') return; toast('Saving is not available here. Press and hold the image instead.'); } return true; }
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); return true;
    };
    if (e.target.dataset.img === 'save'){ await saveIt(); return; }

// the run score and what it is made of
function scoreBox(r){
  const h = seasonSummary(r), p = scoreParts(h), f = v => (Math.round(v * 100) / 100).toString();
  const row = (l, v, sub) => `<div class="sp"><span>${l}${sub ? `<small>${sub}</small>` : ''}</span><b class="num">${v}</b></div>`;
  return `<section class="card scorebox"><div class="drafthead"><div class="eyebrow">Run score</div><b class="num sbig">${score99(h)}</b></div>
    <div class="sparts">${row('Results', '+' + f(p.m), `${num(h.w)} wins × 2, ${num(h.d)} draws × 1`)}${p.bye ? row('Play-off skipped', '+' + p.bye, 'top 8: counted as two wins') : ''}${row('Furthest round', '+' + f(p.st), esc(STAGE_SHORT[h.stage] || ''))}${row('League phase', '+' + f(p.ps), `(37 − ${num(h.pos)}) / 4`)}
    ${row('Competition', '× ' + f(p.cw), esc(COMPS[h.comp] ? COMPS[h.comp].short : ''))}${row('Difficulty', '× ' + f(p.dw), esc(DIFF[h.diff] ? DIFF[h.diff].label : ''))}${row('On the 1-99 scale', score99(h), `${p.total.toFixed(1)} of the best possible ${SCORE_MAX}`)}</div></section>`;
}
function viewSeason(){
  const r = S.run, champ = r.cup.stage === 'champion';
  return `${doneTop()}
  <div class="stack">
    <section class="card verdict${champ ? ' champ' : ''}">
      ${champ ? TROPHY : ''}<div class="eyebrow">${champ ? 'Champions' : 'Run over'} · ${r.arch ? new Date(r.doneAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : 'Your run'}${r.player ? ' · ' + esc(r.player) : ''}</div>
      ${r.rank ? `<div class="t10${r.arch ? '' : ' pop'}"><b class="num">No. ${r.rank}</b><span>${r.rankWk ? 'this week' : 'in the top 10'}</span></div>` : ''}
      <h1 style="margin-top:8px">${verdictHead(r)}</h1>
      ${runPath(r)}
      ${(r.ach || []).length ? `<div class="achnew">${r.ach.map(k => achChip(ACH.find(a => a[0] === k), true)).join('')}</div>` : ''}
      ${runStory(r) ? `<p class="story" style="margin:12px 0 0;font-size:16px;line-height:1.45">${runStory(r)}</p>` : ''}
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="chip quit" data-act="img" data-kind="season" style="padding:6px 14px;font-size:13px;color:var(--text)">Share as image</button></div>
    </section>
    <div class="endgrid">
      <div class="stack">${scoreBox(r)}${playerOfRun(r)}${seasonBox(r)}</div>
      <div class="stack">${(h => xiBox('Your XI', h.xi, h.form))(seasonSummary(r))}${teamBox(r)}${playersBox(r)}</div>
    </div>
  </div>
  ${dock('<button class="btn primary" data-act="scr" data-to="comp">The competition</button>', r.arch ? '<button class="btn ghost" data-act="back">Back</button>' : '')}`;
}
/* the whole competition: the winner, the bracket, the league table, the top scorers */
function viewComp(){
  const r = S.run, c = r.cup, t = c.ev.find(e => e.k === 'table');
  const champ = c.champ === 'YOU';
  return `${doneTop()}
  <div class="stack">
    <section class="card verdict${champ ? ' champ' : ''}"><div class="eyebrow">${compOf(r).name}</div>
      <h1 style="margin-top:8px">${champ ? 'Your XI' : esc(nm(c.champ))}</h1><p style="margin:8px 0 0">won the ${compOf(r).short}.</p></section>
    ${koBox(c)}
    ${topBox(r)}
    ${t ? tableHTML(tableAfter(c, (c.lg || []).length), 'League phase table', `You finished ${ord(t.pos)}`) : ''}
  </div>
  ${dock(r.arch ? '<button class="btn primary" data-act="back">Back</button>' : r.keepN ? '<button class="btn primary" data-act="scr" data-to="keep">Next run: who stays?</button>' : '<button class="btn primary" data-act="cont">New run</button>', '<button class="btn ghost" data-act="scr" data-to="season">Your run</button>')}`;
}
/* who stays for the next run */
function viewKeep(){
  const r = S.run, st = r.cup.stage, n = r.keepN, champ = st === 'champion';
  const mr = matchRatings(r), k = campaign(r);
  const lst = arrangement(r.picks, r.form).map(pid => W.P[pid]).map(p => {
    const on = r.keepSel.includes(p.id);
    return `<button class="krow${on ? ' on' : ''}" data-act="keep" data-p="${p.id}" data-pid="${p.id}" aria-pressed="${on}" ${n ? '' : 'disabled'}>
      <span class="box">${on ? '✓' : ''}</span><span style="min-width:0"><div class="nm" style="font-weight:500">${esc(p.name)}</div><div class="muted" style="font-size:12px">${natTag(p)} · ${p.pos.join(' · ')} · ${esc(W.C[p.club].name)}</div></span>
      <span class="kst">${rtChip(mr[p.id] && mr[p.id].avg)}<small>${k.g[p.id] || 0} G · ${k.a[p.id] || 0} A</small></span></button>`;
  }).join('');
  return `${doneTop()}
  <div class="stack">
    <section class="card verdict${champ ? ' champ' : ''}">
      <div class="eyebrow">Next run</div>
      <h1 style="margin-top:8px">${n ? 'Who stays?' : 'Starting over'}</h1>
      ${champ && r.comp && r.comp !== 'cl' && n ? `<p style="margin:8px 0 0">You won the ${compOf(r).short}. Next run: the <b>${COMPS[NEXT_COMP[r.comp]].short}</b>.</p>` : ''}
      ${st === 'league' && n ? `<p style="margin:8px 0 0">Out of the top 24. Next run drops to the <b>${COMPS[PREV_COMP[r.comp || 'cl']].short}</b>.</p>` : ''}
      <p class="muted" style="margin:10px 0 0">${n ? `Play the next run now and up to <b style="color:var(--text)">${n}</b> player${n > 1 ? 's' : ''} come with you. Choose within <b class="num" style="color:var(--gold)" data-cd="${r.stepDl || Date.now()}">${fmt((r.stepDl || Date.now()) - Date.now())}</b>; after that, or going home, the next run starts with a fresh squad.` : 'No players carry over. Next run starts from scratch.'}</p>
    </section>
    ${n ? `<div><div class="drafthead" style="margin-bottom:8px"><div class="eyebrow">Choose who stays · ${r.keepSel.length} of ${n}</div>${n >= r.picks.length ? `<button class="chip quit" data-act="keepall" style="padding:5px 12px;font-size:12px;color:var(--text)">${r.keepSel.length >= r.picks.length ? 'Clear all' : 'Keep all 11'}</button>` : ''}</div><div class="keep">${lst}</div></div>` : ''}
  </div>
  ${dock(n ? `<button class="btn primary" data-act="cont">${S.armed === 'cont' ? `Sure? Only ${r.keepSel.length} of ${n} kept` : r.keepSel.length ? `Next run · ${r.keepSel.length} kept` : 'Next run'}</button>` : `<button class="btn primary" data-act="cont">New run</button>`, `<button class="btn ghost${S.armed === 'home' ? ' warn' : ''}" data-act="home">${S.armed === 'home' ? 'Tap again to leave' : 'Home'}</button>`)}`;
}

function render(){
  const r = S.run; if (PC) PC.hidden = true;
  document.body.dataset.comp = (r && r.comp) || START_COMP[(S.pref && S.pref.diff) || 'medium'];
  try {
    syncStep();
    requestAnimationFrame(() => document.querySelectorAll('.bracket-wrap[data-focus]').forEach(el => { el.scrollLeft = +el.dataset.focus; }));
    const key = !r ? 'home' : r.phase + ':' + (r.phase === 'cup' ? r.scr : r.phase === 'done' ? r.dscr : '');
    const app = $('#app'), fresh = key !== render.key; if (fresh){ app.classList.remove('enter'); void app.offsetWidth; app.classList.add('enter'); render.key = key; }
    { const t = document.querySelector('.ribbon .rt.cur'); render.fromRect = t ? t.getBoundingClientRect() : null; }   // where the next match's zoom starts
    document.body.classList.remove('matchon'); runLive.cur = null;
    const pl = document.querySelector('.plist'), prevList = r && r.phase === 'draft' && pl ? pl.innerHTML : null;   // the last club's players stay while the next is drawn
    $('#app').innerHTML = !r ? viewHome() : r.phase === 'draft' ? viewDraft() : r.phase === 'lineup' ? viewLineup() : r.phase === 'cup' ? viewCup() : viewDone();
    fitHeroLogo();
    if (!r && LB.flash) setTimeout(() => { LB.flash = null; }, 2600);   // the new run's row on the top 10 lights up once
    runLive();
    // the first club stays hidden behind the run's title card and is drawn the moment the card goes, however it goes
    { const card = document.querySelector('.clubcard.reveal');
      if (runIntro(() => { if (card) card.classList.remove('prespin'); runSpin(prevList); })){ if (card) card.classList.add('prespin'); } else runSpin(prevList); }
    runKoSpin();
    if (!runReveal() && fresh) countUp(app);
    if (r && r.phase === 'done' && r.celebrate){ r.celebrate = false; save(); if (r.tm) confetti(); else titleMoment(); }
  } catch (e) {
    // a saved run that no longer fits the data (new ratings, new positions): drop it rather than show a blank page
    console.error(e);
    if (r && r.arch){ S.run = null; $('#app').innerHTML = viewHome(); toast('That run can no longer be shown: some of its players are gone from the data.'); }
    else if (r){ S.run = null; save(); $('#app').innerHTML = viewHome(); toast('The data was updated, so your run in progress was reset.'); }
    else throw e;
  }
}

const TOUCH = () => matchMedia('(pointer:coarse)').matches;
document.addEventListener('click', e => {
  // on a phone, tapping a player's rating circle in the keep list opens his card instead of ticking him
  if (TOUCH() && e.target.closest('.krow .ovdot')) return;
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a !== 'quit' && a !== 'cont' && a !== 'kickoff' && a !== 'home') S.armed = null;
  if (a === 'snd'){   // in place, so a match being played out is not restarted
    S.pref = S.pref || {}; S.pref.sound = !S.pref.sound; save(); document.querySelectorAll('.chip.snd').forEach(x => x.outerHTML = sndBtn());
    if (S.pref.sound) SND.play('whistle', true); return;
  }
  if (a === 'quit'){
    if (S.armed === 'quit' && S.run && S.run.phase === 'done'){ S.armed = null; S.run = null; save(); render(); scrollTo(0, 0); }
    else if (S.armed === 'quit'){ S.armed = null; S.run = null; S.stats.runs++; S.stats.streak = 0; save(); render(); scrollTo(0, 0); toast('Run abandoned. It counts as a loss.'); }
    else {   // update the button in place so the draft card does not replay its reveal
      S.armed = 'quit'; b.outerHTML = quitBtn();
      setTimeout(() => { if (S.armed === 'quit'){ S.armed = null; const q = document.querySelector('[data-act=quit]'); if (q) q.outerHTML = quitBtn(); } }, 4000);
    }
    return;
  }
  if (a === 'start'){ S.editName = 0; if (!(S.pref && S.pref.name)){ toast('Type your name first.'); const x = document.getElementById('pname'); if (x) x.focus(); return; } newRun(); }
  else if (a === 'pickd'){ S.pref = Object.assign({ diff: 'medium' }, S.pref, { diff: b.dataset.d }); save(); render(); }
  else if (a === 'open') openRun(+b.dataset.i, b.dataset.wk === '1');
  else if (a === 'lbtab'){ S.pref = Object.assign({}, S.pref, { lbTab: b.dataset.t }); save(); lbShow(); }
  else if (a === 'weekly'){ S.editName = 0; if (!(S.pref && S.pref.name)){ toast('Type your name first.'); const x = document.getElementById('pname'); if (x) x.focus(); return; } if (!weeklyOk()){ toast('This week\'s challenge is not ready yet.'); return; } newRun(null, true); }
  else if (a === 'rename'){ S.editName = 1; render(); const x = document.getElementById('pname'); if (x){ x.focus(); x.select(); } }
  else if (a === 'back'){ S.run = null; render(); requestAnimationFrame(() => { const x = document.querySelector('.bruns'); if (x) toTop(x.closest('section')); }); }
  else if (a === 'pick') choose(b.dataset.p);
  else if (a === 'help') useHelp(b.dataset.k);
  else if (a === 'form'){ S.run.form = b.dataset.f; S.run.sel = null; save(); render(); }
  else if (a === 'slot'){
    const r = S.run; if (!r || locked()) return;
    const f = r.form, arr = arrangement(r.picks, f), j = +b.dataset.j;
    if (r.sel == null || !arr[r.sel]) r.sel = arr[j] ? j : null;
    else if (r.sel === j) r.sel = null;
    else if (canMove(arr, f, r.sel, j)){ const pid = arr[r.sel]; arr[r.sel] = arr[j] || null; arr[j] = pid; r.manual = r.manual || {}; r.manual[f] = arr; r.sel = null; }
    else r.sel = arr[j] ? j : null;
    save(); render();
  }
  else if (a === 'kickoff'){   // a second tap confirms: shape and positions are final for the season
    if (S.armed === 'kickoff'){ S.armed = null; kickoff(); }
    else { S.armed = 'kickoff'; render(); toast('Shape and positions are final for the whole run. Tap again to confirm.'); }
  }
  // a match still being played out: the first press only ends it; the next press moves on
  else if ((a === 'next' || a === 'all' || a === 'scr') && runLive.cur && runLive.cur.el.isConnected && !runLive.cur.el.dataset.blown){ runLive.cur.endNow(); }
  else if ((a === 'next' || a === 'all' || a === 'scr') && runLive.cur && runLive.cur.el.isConnected && runLive.cur.waiting){ runLive.cur.close(); }
  else if (a === 'scr'){ const r = S.run; if (r.phase === 'done') r.dscr = b.dataset.to; else r.scr = b.dataset.to; S.armed = null; save(); render(); scrollTo(0, 0); }
  else if (a === 'next') step(false);
  else if (a === 'all') step(true);
  else if (a === 'keepall'){   // a title: the whole XI can stay, in one tap (a second tap clears it)
    const r = S.run; r.keepSel = r.keepSel.length >= r.picks.length ? [] : [...r.picks]; save(); render();
  }
  else if (a === 'keep'){
    const r = S.run, id = b.dataset.p, i = r.keepSel.indexOf(id);
    if (i > -1) r.keepSel.splice(i, 1); else if (r.keepSel.length < r.keepN) r.keepSel.push(id); else toast('You can keep ' + r.keepN + '. Untick someone first.');
    save(); render();
  }
  else if (a === 'cont'){
    // fewer kept than allowed: ask once more, in case the list was missed
    const r = S.run;
    if (r && r.keepN && r.keepSel.length < r.keepN && S.armed !== 'cont'){ S.armed = 'cont'; render(); toast(`You can keep ${r.keepN} but chose ${r.keepSel.length}. Tap again to go on.`);
      requestAnimationFrame(() => { const k = document.querySelector('.krow'); const sec = k && (k.closest('section') || k.parentElement); if (sec) toTop(sec); }); }
    else { S.armed = null; continueRun(); }
  }
  else if (a === 'img') showImage(b.dataset.kind);
  else if (a === 'fresh2'){ S.run = null; save(); render(); }
  else if (a === 'lbimg') showTopImage();
  else if (a === 'home'){
    const r = S.run;
    // leaving while players could still carry over loses them: a second tap confirms
    if (r && r.phase === 'done' && !r.arch && r.keepN > 0 && !r.carryOff && S.armed !== 'home'){
      S.armed = 'home'; render(); toast('Leaving now means nobody carries over. Tap again to leave.');
      setTimeout(() => { if (S.armed === 'home'){ S.armed = null; render(); } }, 4000); return;
    }
    S.armed = null;
    if (r && r.phase === 'done') S.run = null;
    save(); render(); scrollTo(0, 0);
  }
});

document.addEventListener('input', e => {
  if (e.target.id !== 'pname') return;
  const v = e.target.value.replace(/\s+/g, ' ').trim().slice(0, 20);
  S.pref = Object.assign({ diff: 'medium' }, S.pref, { name: v }); save();
  const b = document.querySelector('[data-act=start]'); if (b){ b.disabled = !v; b.textContent = v ? 'Start a run as ' + v : 'Type your name to start'; }
});
document.addEventListener('keydown', e => { if (e.target.id === 'pname' && e.key === 'Enter'){ const b = document.querySelector('[data-act=start]'); if (b && !b.disabled) b.click(); } });
/* player card: hover on desktop, tap on a pitch slot on touch */
const PC = $('#pcard');
// hover targets: players on the pitch, the rating circle on the end-of-run list, rows of the players table
const cardTarget = t => t.closest('.slot[data-pid]') || (t.closest('.krow .ovdot') && t.closest('.krow[data-pid]')) || t.closest('tr[data-pid]');
function showCard(el, x, y){
  const p = W.P[el.dataset.pid]; if (!p) return;
  PC.classList.remove('sheet');
  if (PC.hidden || PC.dataset.pid !== String(p.id)){ PC.innerHTML = cardHTML(p); PC.dataset.pid = p.id; }
  PC.hidden = false;
  const w = PC.offsetWidth, h = PC.offsetHeight, vw = innerWidth, vh = innerHeight;
  let left = x + 16, top = y + 16;
  if (left + w > vw - 8) left = Math.max(8, x - w - 16);
  if (top + h > vh - 8) top = Math.max(8, vh - h - 8);
  PC.style.left = left + 'px'; PC.style.top = top + 'px';
}
document.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const el = cardTarget(e.target);
  if (el) showCard(el, e.clientX, e.clientY); else PC.hidden = true;
});
document.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') PC.hidden = true; });
/* on a phone: a tap on a player opens his card as a sheet at the bottom of the screen; it stays while you scroll,
   another tap on a player switches it, the cross or a tap anywhere else closes it */
function openSheet(pid){
  const p = W.P[pid]; if (!p) return;
  PC.classList.add('sheet'); PC.style.left = PC.style.top = '';
  PC.innerHTML = `<button class="sheet-x" data-sheet-x aria-label="Close">✕</button>` + cardHTML(p); PC.dataset.pid = p.id; PC.hidden = false;
}
document.addEventListener('click', e => {
  if (!TOUCH()) return;
  if (e.target.closest('[data-sheet-x]')){ PC.hidden = true; return; }
  if (e.target.closest('#pcard')) return;
  const el = cardTarget(e.target);
  if (el && !(S.run && S.run.phase === 'lineup')) openSheet(el.dataset.pid); else PC.hidden = true;   // line-up: a tap moves players
});

const TIPS = ['Penalties go in 68.6% of the time, the all-time World Cup rate.', 'Home advantage is bigger in Europe than in the leagues: measured on 973 European matches.',
  'Only the play-off and the Round of 16 are drawn; after that the bracket decides.', 'From 2025/26 the club ranked higher in the league phase plays the second leg at home.',
  'A position a player rarely plays costs him up to 4 points; one he plays often, half a point.', 'Full chemistry adds 33 Elo points on top of your players (measured: an earlier guess was three times that).',
  'A start 90 days old counts half as much toward a player\'s positions as one today.', 'Win a title and carry all 11 into the next run, one competition up.',
  'Seeds 1 and 2 can only meet in the final; 3 and 4 are split between the halves too.', 'Run score 1-99: 1 is the worst run possible, 99 a Champions League title on Hard from 1st place with every match won.'];
function loaderTips(){
  const el = document.querySelector('.ld-tip'); if (!el) return; let i = Math.floor(Math.random() * TIPS.length);
  const show = () => { if (!el.isConnected) return clearInterval(t); el.classList.remove('in'); void el.offsetWidth; el.textContent = TIPS[i++ % TIPS.length]; el.classList.add('in'); };
  show(); const t = setInterval(show, 3200);
}
async function boot(){
  loaderTips();
  let raw = null;
  try {
    const lg = document.querySelector('.ld-logo'); if (lg) lg.style.backgroundImage = `url(${LOGO})`;
    const r = await fetch('world.json?t=' + Date.now(), { cache: 'no-store' });   // always the latest data, never a cached copy
    if (r.ok){
      // the data is a few MB: a progress bar while it arrives (the size is a guess when the server compresses it)
      const bar = document.querySelector('.ld-bar b'), len = +r.headers.get('content-length') || 0;
      const total = len && !r.headers.get('content-encoding') ? len : Math.max(len * 6, 7e6);
      if (r.body && r.body.getReader && bar){
        const rd = r.body.getReader(), parts = []; let got = 0;
        for (;;){ const { done, value } = await rd.read(); if (done) break; parts.push(value); got += value.length; bar.style.width = Math.min(97, 4 + 93 * got / total) + '%'; }
        bar.style.width = '100%';
        raw = JSON.parse(new TextDecoder().decode(await new Blob(parts).arrayBuffer()));
      } else raw = await r.json();
    }
  } catch (e) {}
  W = null;
  if (raw && raw.clubs){ const w = worldFromData(raw); if (w.draftable.length >= 11) W = w; }
  if (!W) W = buildWorld();
  if (W.meta.live) CFG.STORE += '.live';
  window.__ttny = { W, CFG, feasible, assign, simMatch, buildCup, shootout };
  load();
  const bad = id => !W.P[id] || !W.P[id].sc || W.P[id].ovr == null;
  if (S.run && S.run.picks && S.run.picks.some(bad)) S.run = null;
  // a run from before a data update whose players no longer fit together: start again
  if (S.run && S.run.picks && S.run.picks.length === 11 && !feasible(S.run.picks).length) S.run = null;
  delete S.dyn; S.best = S.best || [];   // challenges are gone: nothing carries over from an old save
  if (S.run && S.run.phase === 'done' && S.run.dscr === 'dynasty') S.run.dscr = 'season';
  catchUp();
  render();
  setInterval(tick, 1000);
}
/* away for a while (the phone slept, the tab was closed): every clock that ran out in the meantime is played out in
   order, on the clock it would have had, as if the page had stayed open: random picks, a random shape, the next steps,
   nobody kept. Away a few minutes, you land where the game would be by now. */
function catchUp(){
  const realNow = Date.now, start = realNow(); let moved = false;
  toast.quiet = true;
  try {
    for (let guard = 0; guard < 600; guard++){
      const r = S.run;
      if (r && r.stepDl && start > r.stepDl){
        const t = r.stepDl; Date.now = () => t + 1;
        render(); timeUp(); render(); moved = true; continue;
      }
      break;
    }
  } finally { Date.now = realNow; toast.quiet = false; }
  if (!moved) return false;
  save(); render();
  setTimeout(() => toast('The clock moved the game on while you were away.'), 300);
  return true;
}
// a newer version of the game published while this one is open: reload (the run is saved), but never in the middle of a live match
const BUILD = '20261024090940';
async function checkBuild(){
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' }); if (!r.ok) return;
    const v = await r.json(); if (!v.build || v.build === BUILD || BUILD === 'dev') return;
    if (runLive.cur || document.getElementById('intro')){ setTimeout(checkBuild, 8000); return; }
    save(); try { sessionStorage.setItem('ttny-updated', '1'); } catch (e) {} location.reload();
  } catch (e) {}
}
setInterval(checkBuild, 60 * 1000);
try { if (sessionStorage.getItem('ttny-updated')){ sessionStorage.removeItem('ttny-updated'); setTimeout(() => toast('The game was updated. Your run carries on.'), 800); } } catch (e) {}
// back after a while: after 10 minutes away, load the page again (the newest data); clocks that ran out are played out
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ hiddenAt = Date.now(); return; }
  if (hiddenAt && Date.now() - hiddenAt > 10 * 60 * 1000){ save(); location.reload(); return; }
  if (W) catchUp();
  checkBuild();
});
addEventListener('pageshow', e => { if (e.persisted) location.reload(); });   // a page restored from the back-forward cache
boot().then(lbInit, lbInit);   // the lists once the data (and this week's challenge) is in
</script>
